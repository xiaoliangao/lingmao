<?xml version="1.0" encoding="UTF-8"?>
<!-- 工艺单的附页：工艺标准里的一张图片，一张一页、缩放到 A4（架构 §11.1）。PDF 文件不走这里，直接拼在后面 -->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${title}">附页</title>
  <style>
    @page { size: A4; margin: 12mm 10mm; }
    body { font-family: 'SCM Sans'; font-size: 9pt; color: #2b2622; }
    h2 { font-size: 11pt; font-weight: bold; margin: 0 0 4mm 0; padding: 1mm 2mm; background: #efe9e1; border-left: 2pt solid #8a5a32; }
    .img { text-align: center; }
    .img img { max-width: 190mm; max-height: 250mm; }
  </style>
</head>
<body>
  <h2 th:text="${title}">附页 1 · 工艺标准</h2>
  <div class="img"><img th:src="${image}" alt=""/></div>
</body>
</html>
