spring:
  application:
    name: scm
  autoconfigure:
    # 不要 Spring Security 自动建的那个“默认用户”：我们自己管用户（sys_user 表），它只会在日志里打一个没用的随机密码
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    # 默认激活 local，会叠加读取 application-local.yaml（不进 git，放真实连接信息）
    # 部署时用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # 真实值在 application-local.yaml 里，这里只放占位，提交到 git 的文件里不能出现密码
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5          # 开发阶段够用，连的是远程库，连接数别开大
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB          # 单个上传文件最大 10MB，超过返回 400
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}      # 开发用 0 号库；生产用另一个库号
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true      # 列 create_time -> 字段 createTime
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发阶段把 SQL 打到控制台，上线要删
  global-config:
    banner: false
    db-config:
      id-type: auto                         # 主键由数据库 IDENTITY 生成
      logic-delete-field: deleted           # 逻辑删除：所有查询自动加 deleted = false
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

lingmao:
  jwt:
    secret: ${JWT_SECRET}          # 签名密钥，真实值在 application-local.yaml（服务器上在 .env），不进 git
    ttl: 2h                        # token 有效期
  init-admin-password: ${INIT_ADMIN_PASSWORD:}
  upload:
    dir: ${UPLOAD_DIR:./uploads}   # 上传文件存放目录；开发时在项目下的 uploads/（不进 git），生产挂载到容器外   # 初始管理员密码；库里已有 admin 时不用