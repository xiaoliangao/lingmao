spring:
  application:
    name: scm
  autoconfigure:
    # 不要 Spring Security 自动建的那个“默认用户”：我们自己管用户（sys_user 表），它只会在日志里打一个没用的随机密码
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    # 默认激活 local，会叠加读取 application-local.yaml（不进 git，放真实连接信息）
    # 部署时用环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # 真实值在 application-local.yaml 里，这里只放占位，提交到 git 的文件里不能出现密码
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5          # 开发阶段够用，连的是远程库，连接数别开大
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 100MB         # 单个上传文件最大 100MB（AI、PSD 设计源文件），超过返回 400；别的类型 FileServiceImpl 再卡 10MB
      max-request-size: 101MB      # 比文件大一点：multipart 的分隔行、表单头也算在请求里
  lifecycle:
    timeout-per-shutdown-phase: 35s
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}      # 开发用 0 号库；生产用另一个库号
      connect-timeout: 1s
      timeout: 1s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    time-zone: Asia/Shanghai
    date-format: "yyyy-MM-dd'T'HH:mm:ssXXX"

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true      # 列 create_time -> 字段 createTime
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl   # 所有环境只记录安全 SQL 耗时，禁止参数落日志
  global-config:
    banner: false
    db-config:
      id-type: auto                         # 主键由数据库 IDENTITY 生成
      logic-delete-field: deleted           # 逻辑删除：所有查询自动加 deleted = false
      logic-delete-value: true
      logic-not-delete-value: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  # 列表的查询条件对象（OrderQuery 这种）拆成一个个查询参数，和真实请求一样，每个参数带字段上的中文注释（RFC 009 §10）
  default-flat-param-object: true

lingmao:
  jwt:
    secret: ${JWT_SECRET}          # 签名密钥，真实值在 application-local.yaml（服务器上在 .env），不进 git
    ttl: 2h                        # token 有效期
  init-admin-password: ${INIT_ADMIN_PASSWORD:}   # 初始管理员密码；库里已有 admin 时不用
  upload:
    dir: ${UPLOAD_DIR:./uploads}   # 上传文件存放目录；开发时在项目下的 uploads/（不进 git），生产挂载到容器外
    # 文件地址的签名密钥，和 Nginx 共用（架构 §8）。没配置启动失败（FileUrlSigner）；真实值在 application-local.yaml（服务器上在 .env）
    sign-key: ${FILE_SIGN_KEY:}
  backup:
    dir: ${BACKUP_DIR:}            # 备份目录（部署包里只读挂载），管理后台据此显示最近备份；开发环境不配

scm:
  # 系统给用户打开的地址（如 https://scm.example.com），钉钉消息里的"打开"按钮用它拼链接；空着消息不带按钮
  public-url: ${SCM_PUBLIC_URL:}
  # 钉钉推送（RFC 019 §4）：企业内部应用的 AppKey、AppSecret、AgentId，三个都有才发；开发环境不配，什么都不发
  dingtalk:
    app-key: ${SCM_DINGTALK_APP_KEY:}
    app-secret: ${SCM_DINGTALK_APP_SECRET:}
    agent-id: ${SCM_DINGTALK_AGENT_ID:}
