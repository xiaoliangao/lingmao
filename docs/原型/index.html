        <Tbl inset flat :rows="sups" empty="还没有采购入库" :cols="[{ k: 'c', t: '供应商', f: x => supName(x.c) }, { k: 'n', t: '到货行', c: 'num' }, { k: 'ok', t: '准时', c: 'num' }, { k: 'rate', t: '准时率' }, { k: 'late', t: '现逾期行', c: 'num' }]">
          <template #rate="{ r }"><span v-if="r.rate != null" class="hbar" :title="costRate(r.rate)"><b :style="{ width: r.rate * W + 'px' }"></b>{{ costRate(r.rate) }}</span><span v-else class="dim">—</span></template>
          <template #late="{ r }"><span :class="{ red: r.late }">{{ r.late || '—' }}</span></template>
        </Tbl>
      </div>

        <Tbl inset flat :rows="facs" empty="没有加工单" :cols="[{ k: 'c', t: '加工厂', f: x => supName(x.c) }, { k: 'n', t: '在制单', c: 'num' }, { k: 'wip', t: '在制件数' }, { k: 'late', t: '逾期单', c: 'num' }, { k: 'rate', t: '次品率', c: 'num' }]">
          <template #wip="{ r }"><span class="hbar" :title="r.wip + ' 件'"><b :style="{ width: r.wip / maxWip * W + 'px' }"></b>{{ r.wip }}</span></template>
          <template #late="{ r }"><span :class="{ red: r.late }">{{ r.late || '—' }}</span></template>
          <template #rate="{ r }">{{ r.rate == null ? '—' : costRate(r.rate) }}</template>
        </Tbl>
      </div>
      <div class="h2">单款毛利</div>
      <div data-c="单款毛利">
        <Tbl inset flat :rows="margins" link @row="x => go('/costing/' + x.s.code)" empty="还没有能算成本的款" :cols="[
          { k: 'code', t: '款式' }, { k: 'total', t: '总成本', c: 'num', f: x => fm(x.c.total) }, { k: 'quote', t: '报价', c: 'num', f: x => fm(x.c.quote) }, { k: 'rate', t: '毛利率' }]">
          <template #code="{ r }"><span class="row"><Thumb :code="r.s.code" :s="22"/><span class="code">{{ r.s.code }}</span><span class="mut">{{ r.s.name }}</span></span></template>
          <template #rate="{ r }"><span v-if="r.c.rate > 0" class="hbar" :title="costRate(r.c.rate)"><b :style="{ width: Math.min(1, r.c.rate) * W + 'px' }"></b>{{ costRate(r.c.rate) }}</span><span v-else class="red">{{ costRate(r.c.rate) }}</span></template>

expose({

<script>/* 7-pages-master.js */
/* ============================================================
 * 资料：供应商、客户、物料、基础（颜色尺码、品类、仓库、主体、字典）；系统：设置
 * 改数据的函数在上面，页面在下面。供应商的准入 / 停用 / 拉黑走 2-store.js 的 FLOWS.supplier。
 * ============================================================ */

/* ---------- 供应商 ---------- */
// 证照：最早到期的那份；过期红、30 天内黄
function certInfo(s) {
  if (!s.certs.length) return { t: '—', tone: 'dim' }
  const left = Math.min(...s.certs.filter((c) => c.until).map((c) => daysLeft(c.until)))
  if (left < 0) return { t: '有证照已过期', tone: 'red' }
  if (left <= 30) return { t: left + ' 天后到期', tone: 'amber' }
  return { t: s.certs.length + ' 份', tone: 'dim' }
}
function addCert(s, f) {
  if (!f.type || !f.until) fail('类型、有效期都要填')
  s.certs.push({ type: f.type, until: f.until })
  act(s, '上传' + f.type + '，有效期至 ' + f.until)
}
function unblockSupplier(s, reason) {
  if (!reason) fail('要写解除原因')
  move('supplier', s, '解除黑名单', reason)
  s.blackReason = ''
}
function supplierDocs(code) {
  return [
    ...db.purchases.filter((p) => p.supplier === code).map((p) => ({ no: p.no, k: '采购单', date: p.date, qty: fq(poQty(p)), amt: poAmt(p), status: p.status, to: '/purchases/' + p.no })),
    ...db.productions.filter((p) => p.factory === code).map((p) => ({ no: p.no, k: '加工单', date: p.date, qty: prodQty(p) + ' 件', amt: prodAmt(p), status: p.status, to: '/production/' + p.no })),
    ...db.stockDocs.filter((d) => d.partner === code).map((d) => ({ no: d.no, k: d.type, date: d.date, qty: d.lines.length + ' 行', amt: null, status: d.status, to: '/stock-docs/' + d.no })),
    ...db.returns.filter((r) => r.factory === code).map((r) => ({ no: r.no, k: '回货', date: r.date, qty: sum(r.lines, (x) => x.qty) + ' 件', amt: null, status: '', to: '/production/' + r.prod })),
  ].sort((a, b) => b.date.localeCompare(a.date))
}
// 绩效（12.04 待定）：准时 = 入库 / 回货日期不晚于交期
function supplierPerf(code) {
  const ins = db.stockDocs.filter((d) => d.type === '采购入库' && d.partner === code && d.status === '已审核')
  const insOk = ins.filter((d) => { const p = purchase(d.src); return !p || d.date <= p.due })
  const rets = db.returns.filter((r) => r.factory === code)
  const retsOk = rets.filter((r) => r.date <= (production(r.prod)?.due || r.date))
  const n = ins.length + rets.length
  const prods = db.productions.filter((p) => p.factory === code && p.status !== '已作废')
  const pos = db.purchases.filter((p) => p.supplier === code && p.status !== '已作废')
  const ret = sum(prods, prodRet), def = sum(prods, prodDef)
  return {
    n, onTime: n ? fpct(insOk.length + retsOk.length, n) : null,
    late: arrivals().filter((a) => a.p.supplier === code && a.risk === 'late').length + prods.filter((p) => prodRisk(p).late).length,
    ret, def, defRate: ret ? rnd((def / ret) * 100, 1) : null,
    amt: rnd(sum(pos, poAmt) + sum(prods, prodAmt), 2), docs: pos.length + prods.length,
    issues: sum(prods, (p) => p.issues.length),
  }
}
// 询价记录（12.06 待定）：先用采购单上的成交价
const priceHistory = (code) => db.purchases.filter((p) => p.supplier === code && p.status !== '已作废')
  .flatMap((p) => p.lines.map((l) => ({ date: p.date, no: p.no, sku: l.sku, price: l.price, qty: l.qty, unit: matOfSku(l.sku)?.purUnit })))
  .sort((a, b) => b.date.localeCompare(a.date))

/* ---------- 客户 ---------- */
function createCustomer(f) {
  if (!f.name || !f.short) fail('全称、简称都要填')
  const code = 'KH' + String(db.customers.length + 1).padStart(4, '0')
  const c = add(db.customers, { contact: '', phone: '', settle: '月结', term: 30, ...f, code, status: '启用', terms: { price: '', deduct: '', rebate: '' }, log: [] })
  act(c, '新建')
  return c
}
const customerStock = (code) => Object.entries(db.stock).map(([k, q]) => { const [w, sku, o] = k.split('|'); return { w, sku, o, q } }).filter((x) => x.o === code && x.q > 0)

/* ---------- 物料 ---------- */
const MAT_TYPES = ['面料', '里料', '辅料', '包材', '标签吊牌']
const matCat = (c) => db.materialCategories.find((x) => x.code === c) || { code: c, name: c, parent: '' }
const nextMatCode = (cat) => cat + String(Math.max(0, ...db.materials.filter((m) => m.code.startsWith(cat)).map((m) => +m.code.slice(cat.length) || 0)) + 1).padStart(4, '0')
const dupMaterial = (f) => db.materials.find((m) => m.cat === f.cat && m.name.trim() === f.name.trim())
function createMaterial(f) {
  if (!f.name) fail('物料名称要填')
  if (!(f.factor > 0)) fail('换算系数要大于 0')
  const code = nextMatCode(f.cat)
  const m = add(db.materials, { purUnit: f.unit, factor: 1, pack: 1, moq: 0, lead: 7, status: '启用', ...f, code, colors: undefined, skus: [], log: [] })
  if (f.colors?.length) addMaterialSkus(m, f.colors, '', true)
  else m.skus.push({ code })
  act(m, '新建，' + m.skus.length + ' 个 SKU')
  return m
}
function addMaterialSkus(m, colors, spec, silent) {
  const made = []
  colors.forEach((c) => {
    const code = [m.code, c, spec].filter(Boolean).join('-')
    if (m.skus.some((k) => k.code === code)) return
    m.skus.push({ code, color: c, spec: spec || undefined })
    made.push(code)
  })
  if (!made.length) fail('这些颜色的 SKU 已经有了')
  if (!silent) act(m, '加 SKU ' + made.join('、'))
  return made
}
function setMaterialStatus(m, st) { m.status = st; act(m, st) }
// 库存：type 不传 = 所有仓
const skuStock = (sku, type) => rnd(sum(Object.entries(db.stock).filter(([k]) => { const [w, s] = k.split('|'); return s === sku && (!type || wh(w)?.type === type) }), ([, v]) => v), 3)
const matStock = (m) => rnd(sum(m.skus, (k) => skuStock(k.code)), 3)
const matUsedBy = (code) => db.techpacks.filter((t) => t.status === '已生效').flatMap((t) => t.bom.filter((r) => r.mat === code).map((r) => ({ style: t.style, ver: t.ver, part: r.part, src: r.src })))

/* ---------- 基础 ---------- */
function addColor(f) {
  const code = (f.code || '').trim().toUpperCase()
  if (!/^[A-Z0-9]{2,3}$/.test(code)) fail('颜色编码是 2-3 位字母或数字')
  if (!f.name) fail('颜色名称要填')
  if (db.colors.some((c) => c.code === code)) fail('编码 ' + code + ' 已经有了')
  if (db.colors.some((c) => c.name === f.name)) fail('颜色 ' + f.name + ' 已经有了')
  db.colors.push({ code, name: f.name, family: f.family, hex: f.hex })
}
const sizeGroupUsed = (id) => db.styles.filter((s) => s.sizeGroup === id).length
function appendSize(g, z) {
  z = (z || '').trim().toUpperCase()
  if (!z) fail('尺码要填')
  if (g.sizes.includes(z)) fail(g.name + ' 里已经有 ' + z)
  g.sizes.push(z)
}
function removeSize(g, z) {
  if (sizeGroupUsed(g.id)) fail('已经有款式用这个尺码组，只能在末尾追加尺码')
  g.sizes.splice(g.sizes.indexOf(z), 1)
}

/* ---------- 设置 ---------- */
const ROLES = ['开发', '业务', '生产跟单', '采购', '仓管', '财务', '管理层']
const PERM_CYCLE = ['—', '看', '改', '审']
Object.assign(db, {
  // PRD §3.1 预置角色模板：模块 × 角色
  perms: [
    { m: '基础资料', v: ['改', '看', '看', '改', '看', '看', '看'] },
    { m: '供应商', v: ['看', '看', '看', '改', '看', '看', '审'] },
    { m: '款式、资料包', v: ['审', '看', '看', '看', '看', '看', '看'] },
    { m: '订单', v: ['看', '改', '看', '看', '—', '看', '审'] },
    { m: '排单、加工单', v: ['看', '看', '改', '看', '看', '看', '审'] },
    { m: '算料、采购单', v: ['—', '看', '看', '改', '看', '看', '审'] },
    { m: '出入库、库存', v: ['—', '—', '看', '看', '审', '看', '看'] },
    { m: '进度、异常、回货', v: ['—', '看', '改', '看', '看', '—', '看'] },
  ],

// 操作日志：各单据的记录汇总，按时间倒序
function allLogs() {
  const src = [
    ['订单', db.orders, (d) => d.no, (d) => '/orders/' + d.no],
    ['变更', db.changes, (d) => d.no, (d) => '/orders/' + d.order],
    ['算料', db.mrps, (d) => d.no, (d) => '/mrp/' + d.no],
    ['采购', db.purchases, (d) => d.no, (d) => '/purchases/' + d.no],
    ['出入库', db.stockDocs, (d) => d.no, (d) => '/stock-docs/' + d.no],
    ['加工单', db.productions, (d) => d.no, (d) => '/production/' + d.no],
    ['回货', db.returns, (d) => d.no, (d) => '/production/' + d.prod],
    ['供应商', db.suppliers, (d) => d.code, (d) => '/suppliers/' + d.code],
    ['客户', db.customers, (d) => d.code, (d) => '/customers/' + d.code],
    ['物料', db.materials, (d) => d.code, (d) => '/materials/' + d.code],
    ['款式', db.styles, (d) => d.code, (d) => '/styles/' + d.code],
    ['资料包', db.techpacks, (d) => d.style + ' V' + d.ver, (d) => '/styles/' + d.style],
  ]
  let n = 0
  return src.flatMap(([k, list, id, to]) => list.flatMap((d) => (d.log || []).map((x) => ({ ...x, k, id: id(d), to: to(d), n: n++ }))))
    .sort((a, b) => b.at.localeCompare(a.at) || b.n - a.n)
}

comp('MaterialNew', {
  props: { cat: String },
  emits: ['close'],
  setup(p, { emit }) {

    const code = computed(() => nextMatCode(f.cat))
    const sups = computed(() => db.suppliers.filter((s) => s.status === '合作中'))
    const toggle = (c) => { const i = f.colors.indexOf(c); i >= 0 ? f.colors.splice(i, 1) : f.colors.push(c) }
    watch(() => f.unit, (u) => { f.purUnit = u; f.factor = 1 })

      const d = dupMaterial(f)

      const m = run(() => createMaterial({ ...f, colors: [...f.colors] }))
      if (m) { emit('close'); go('/materials/' + m.code); toast(m.code + ' 已建，生成 ' + m.skus.length + ' 个 SKU') }

comp('SkuAdd', {
  props: { m: Object },
  emits: ['close'],
  setup(p, { emit }) {
    const f = reactive({ colors: [], spec: '' })
    const toggle = (c) => { const i = f.colors.indexOf(c); i >= 0 ? f.colors.splice(i, 1) : f.colors.push(c) }
    function ok() {
      if (!f.colors.length) return toast('至少选一个颜色', null, true)
      const made = run(() => addMaterialSkus(p.m, f.colors, f.spec.trim()))
      if (made) { emit('close'); toast('加了 ' + made.length + ' 个 SKU') }
    }
    return { f, toggle, ok }
  },
  template: `<Modal t="批量加 SKU" :w="520" @close="$emit('close')">

      <div class="f full">颜色<div class="chips"><button v-for="c in db.colors" :key="c.code" class="chip" :class="{ on: f.colors.includes(c.code) }" @click="toggle(c.code)"><Sw :c="c.code"/></button></div></div>

  </Modal>`,
})

<script>/* 9-app.js */

  ] },

  ] },
]

comp('Palette', {
  emits: ['close'],
  setup(_, { emit }) {
    useEsc(() => emit('close'))
    const q = ref(''), i = ref(0), inp = ref(null)
    const all = computed(() => [...NAV.flatMap((g) => g.items.map((it) => ({ t: it.t, sub: g.g || '', to: it.to, i: it.i }))), ...SEARCH.flatMap((f) => f())])
    const items = computed(() => {
      const ks = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean)
      return all.value.filter((x) => ks.every((k) => (x.t + ' ' + (x.sub || '')).toLowerCase().includes(k))).slice(0, 60)
    })
    watch(q, () => { i.value = 0 })
    onMounted(() => inp.value.focus())
    function pick(x) { if (x) { go(x.to); emit('close') } }
    function key(e) {
      if (e.key === 'ArrowDown') { i.value = Math.min(i.value + 1, items.value.length - 1); e.preventDefault() }
      if (e.key === 'ArrowUp') { i.value = Math.max(i.value - 1, 0); e.preventDefault() }
      if (e.key === 'Enter') pick(items.value[i.value])
    }
    return { q, i, inp, items, pick, key }
  },
  template: `<div class="mask" @mousedown.self="$emit('close')"><div class="pal">
    <input ref="inp" v-model="q" @keydown="key" placeholder="跳到页面、单号、款号、供应商……">
    <ul><li v-for="(x, n) in items" :key="x.to + n" :class="{ on: n === i }" @mouseenter="i = n" @click="pick(x)"><Ico :n="x.i || 'file'" :s="15"/>{{ x.t }}<span>{{ x.sub }}</span></li>
      <li v-if="!items.length" class="dim">没有找到</li></ul>
  </div></div>`,
})

comp('Toasts', { template: `<div class="toasts"><div v-for="t in ui.toasts" :key="t.id" class="toast" :class="{ err: t.err }">{{ t.msg }}<a v-if="t.link" @click="go(t.link[1])">{{ t.link[0] }}</a></div></div>` })
comp('ErrBox', {
  template: `<Modal v-if="ui.err" :t="ui.err.msg" :w="480" @close="ui.err = null"><ul class="errs"><li v-for="x in ui.err.list" :key="x">{{ x }}</li></ul>
    <template #foot><button class="btn pri" @click="ui.err = null">知道了</button></template></Modal>`,
})
comp('AskBox', {
  setup() { const done = (v) => { ui.ask.resolve(v); ui.ask = null }; return { done } },
  template: `<Modal v-if="ui.ask" :t="ui.ask.title" :w="440" @close="done(false)"><p class="mut">{{ ui.ask.text }}</p>
    <template #foot><button class="btn" @click="done(false)">取消</button><button class="btn pri" :style="ui.ask.danger ? 'background:var(--red);border-color:var(--red)' : ''" @click="done(true)">{{ ui.ask.ok }}</button></template></Modal>`,
})
comp('NotFound', {
  template: `<div><Head t="没有这个页面"/><div class="empty">链接不对，或者这张单是刷新前新建的（原型刷新后数据回到初始）。<p style="margin-top:16px"><a class="btn" href="#/">回首页</a></p></div></div>`,
})

const navOf = (k) => NAV.flatMap((g) => g.items).find((x) => x.k === k)

const Shell = {
  setup() {
    const pal = reactive({ open: false })
    const main = ref(null)
    const mod = computed(() => nav.r?.mod)
    const closed = reactive(JSON.parse((() => { try { return localStorage.getItem('scm-proto-nav') } catch { return null } })() || '{}'))
    const toggle = (g) => { closed[g] = !closed[g]; try { localStorage.setItem('scm-proto-nav', JSON.stringify(closed)) } catch { /* 无痕模式 */ } }
    const typing = (e) => /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable
    function onKey(e) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.open = !pal.open }
      else if (!typing(e) && !e.metaKey && !e.ctrlKey && e.key.toLowerCase() === 'c' && !escStack.length) fbUi.open = !fbUi.open
    }
    onMounted(() => window.addEventListener('keydown', onKey))
    // 页签：一个模块一个，记住这个模块最后停在哪一页
    const tabs = reactive([{ k: 'home', to: '/' }])
    watch(() => nav.seq, () => {
      if (main.value) main.value.scrollTop = 0
      fbUi.focus = null
      const k = mod.value
      if (!k) return
      const qs = new URLSearchParams(nav.query).toString(), to = nav.path + (qs ? '?' + qs : '')
      const t = tabs.find((x) => x.k === k)
      t ? (t.to = to) : tabs.push({ k, to })
      if (tabs.length > 10) tabs.splice(tabs.findIndex((x, i) => i && x.k !== k), 1)
    }, { immediate: true })
    function closeTab(i) { const [t] = tabs.splice(i, 1); if (t.k === mod.value) go(tabs[Math.max(0, i - 1)].to) }
    const tabTitle = (k) => (k === 'feedback' ? '意见汇总' : navOf(k)?.t || k)
    const fbCount = computed(() => fb.items.length || '')
    const todoCount = computed(() => sum(TODOS.flatMap((f) => f()), (x) => x.n))
    return { pal, main, mod, closed, toggle, fbCount, tabs, closeTab, tabTitle, todoCount }
  },
  template: `<div class="app">
    <aside class="side" data-c="侧边栏">
      <div class="ws"><b>SCM</b><span>织间服饰</span></div>
      <button class="find" @click="pal.open = true"><Ico n="search" :s="14"/><span>搜菜单、单号、款号</span><kbd>⌘K</kbd></button>
      <nav><div v-for="g in NAV" :key="g.g || 'top'" class="grp">
        <b v-if="g.g" :class="{ shut: closed[g.g] }" @click="toggle(g.g)">{{ g.g }}<Ico n="down" :s="13"/></b>
        <template v-if="!closed[g.g]"><a v-for="it in g.items" :key="it.k" class="nav-i" :class="{ on: it.k === mod }" :href="'#' + it.to"><Ico :n="it.i"/><span>{{ it.t }}</span></a></template>
      </div></nav>
      <div class="side-foot">
        <a class="nav-i" :class="{ on: fbUi.open }" @click="fbUi.open = !fbUi.open"><Ico n="msg"/><span>意见</span><span class="n">{{ fbCount }}</span></a>
        <a class="nav-i" :class="{ on: mod === 'feedback' }" href="#/feedback"><Ico n="list"/><span>意见汇总</span></a>
      </div>
    </aside>
    <div class="work">
      <header class="topbar">
        <div class="ptabs"><a v-for="(t, i) in tabs" :key="t.k" class="ptab" :class="{ on: t.k === mod }" :href="'#' + t.to">{{ tabTitle(t.k) }}<span v-if="i" class="x" @click.prevent.stop="closeTab(i)"><Ico n="x" :s="12"/></span></a></div>
        <div class="tb-right">
          <button class="btn ghost icon" title="搜索 ⌘K" @click="pal.open = true"><Ico n="search"/></button>
          <a class="btn ghost icon" title="待办" href="#/"><Ico n="bell"/><span v-if="todoCount" class="dot">{{ todoCount > 99 ? '99+' : todoCount }}</span></a>
          <div class="me"><i>{{ me().name[0] }}</i><span>{{ me().name }}</span><small>{{ me().role }}</small></div>
        </div>
      </header>
      <main class="main" ref="main"><component v-if="nav.r" :is="nav.r.comp" :key="nav.seq" v-bind="nav.params" class="sheet"/><NotFound v-else class="sheet"/></main>
    </div>
    <FeedbackPanel v-if="fbUi.open"/>
    <Pins v-if="fbUi.open"/>
    <Picker v-if="fbUi.picking"/>
    <Palette v-if="pal.open" @close="pal.open = false"/>
    <ErrBox/><AskBox/><Toasts/>
  </div>`,
}

const app = Vue.createApp(Shell)
Object.entries(COMPONENTS).forEach(([n, c]) => app.component(n, c))
Object.assign(app.config.globalProperties, G, { NAV, me, fb, fbUi })

  el.textContent = `自检 ${pass}/${r.length}\n` + r.map((x) => (x.ok ? '✓ ' : '✗ ') + x.name + (x.ok ? '' : '  → ' + JSON.stringify(x.got))).join('\n')
  document.body.appendChild(el)
}
