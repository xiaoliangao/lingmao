    <div v-if="colors && colors.length > 1" class="row g4" style="margin-top:8px;flex-wrap:wrap"><button v-for="x in colors" :key="x" class="gthumb" :class="{ on: x === c }" :title="colorName(x)" @click="c = x"><Thumb :code="code" :color="x" :s="42"/></button></div></div>`,
})
</script>
<script>/* 4-feedback.js */
/* ============================================================
 * 意见：每个模块可以表态（保留 / 不需要 / 要改）、写意见、圈出页面上的位置。
 * 存在浏览器 localStorage（只在这台电脑这个浏览器里）；「意见汇总」页导出 Markdown / JSON 发回来，
 * JSON 可以再导入合并多个人的意见。页面上的区块用 data-c="名字" 标出来，圈位置时吸附到最近的区块。
 * ============================================================ */
const FB_KEY = 'scm-proto-feedback-v1'
const VERDICTS = ['保留', '不需要', '要改']
function loadFb() {
  const empty = { name: '', items: [], verdicts: {} }
  try { return { ...empty, ...JSON.parse(localStorage.getItem(FB_KEY) || '{}') } } catch { return empty }
}
const fb = reactive(loadFb())
watch(fb, () => { try { localStorage.setItem(FB_KEY, JSON.stringify(fb)) } catch { /* 隐私模式存不了，只在本次打开有效 */ } }, { deep: true })
const fbUi = reactive({ open: false, picking: false, draft: null, focus: null })

const navItem = (k) => NAV.flatMap((g) => g.items.map((it) => ({ ...it, g: g.g }))).find((it) => it.k === k)
const curMod = () => nav.r?.mod || 'home'
const nowStamp = () => new Date().toISOString()
const fmtStamp = (s) => { const d = new Date(s); return `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` }
const pinsHere = () => fb.items.filter((x) => x.anchor && x.pat === nav.r?.pat)
const verdictCount = (mod, v) => Object.values(fb.verdicts[mod] || {}).filter((x) => x === v).length

function addComment(text) {
  const t = text.trim()
  if (!t) return false
  fb.items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), mod: curMod(), pat: nav.r?.pat || nav.path, path: nav.path, title: routeTitle(), anchor: fbUi.draft?.anchor || '', rx: fbUi.draft?.rx ?? 0, ry: fbUi.draft?.ry ?? 0, text: t, author: fb.name, at: nowStamp() })
  fbUi.draft = null
  return true
}
function setVerdict(mod, v) {
  const m = (fb.verdicts[mod] ||= {})
  if (m[fb.name] === v) delete m[fb.name]
  else m[fb.name] = v
}

/* ---------- 导出 / 导入 ---------- */
function download(name, text, type) {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([text], { type }))
  a.download = name
  a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}
function fbMarkdown() {
  const lines = [`# SCM 原型意见`, ``, `导出：${fmtStamp(nowStamp())}${fb.name ? ' · ' + fb.name : ''}`, ``]
  NAV.forEach((g) => g.items.forEach((it) => {
    const items = fb.items.filter((x) => x.mod === it.k)
    const vs = VERDICTS.map((v) => [v, verdictCount(it.k, v)]).filter(([, n]) => n)
    if (!items.length && !vs.length) return
    lines.push(`## ${g.g ? g.g + ' / ' : ''}${it.t}（${it.ph}）`, ``)
    if (vs.length) lines.push(`结论：${vs.map(([v, n]) => `${v} ${n}`).join(' · ')}（${Object.entries(fb.verdicts[it.k] || {}).map(([a, v]) => `${a || '未署名'}：${v}`).join('，')}）`, ``)
    items.forEach((x) => lines.push(`- 【${x.title}${x.anchor ? ' · ' + x.anchor : ''}】${x.text.replace(/\n/g, ' ')} —— ${x.author || '未署名'} ${fmtStamp(x.at)}（#${x.path}）`))
    lines.push(``)
  }))
  return lines.join('\n')
}
const fbJson = () => JSON.stringify({ version: 1, exportedAt: nowStamp(), by: fb.name, items: fb.items, verdicts: fb.verdicts }, null, 2)
function fbImport(text) {
  const d = JSON.parse(text)
  if (!Array.isArray(d.items)) throw new Error('不是导出的意见文件')
  const have = new Set(fb.items.map((x) => x.id))
  const added = d.items.filter((x) => !have.has(x.id))
  fb.items.push(...added)
  Object.entries(d.verdicts || {}).forEach(([mod, m]) => Object.assign((fb.verdicts[mod] ||= {}), m))
  return added.length
}

/* ---------- 右侧意见面板 ---------- */
comp('FeedbackPanel', {
  setup() {
    useEsc(() => { if (!fbUi.picking) fbUi.open = false })
    const text = ref(''), nameDraft = ref(fb.name), box = ref(null)
    const mod = computed(curMod)
    const meta = computed(() => navItem(mod.value) || { t: routeTitle(), ph: '' })
    const items = computed(() => fb.items.filter((x) => x.mod === mod.value).slice().reverse())
    const pinNo = (x) => pinsHere().indexOf(x) + 1
    const mine = computed(() => fb.verdicts[mod.value]?.[fb.name])
    watch(() => fbUi.draft, (d) => { if (d) nextTick(() => box.value?.focus()) })
    function ensureName() {
      if (fb.name) return true
      if (!nameDraft.value.trim()) { toast('先写上你的名字'); return false }
      fb.name = nameDraft.value.trim()
      return true
    }
    function send() { if (ensureName() && addComment(text.value)) { text.value = ''; toast('意见已记下') } }
    function verdict(v) { if (ensureName()) setVerdict(mod.value, v) }
    function remove(x) { fb.items.splice(fb.items.indexOf(x), 1) }
    function open(x) { if (x.path !== nav.path) go(x.path); fbUi.focus = x.id }
    return { fb, fbUi, VERDICTS, text, nameDraft, box, mod, meta, items, pinNo, mine, send, verdict, remove, open, verdictCount, fmtStamp }
  },
  template: `<aside class="fb">
    <header><span>{{ meta.t }}</span><span v-if="meta.ph" class="pill" :class="{ amber: meta.ph === '待定', blue: meta.ph === '二期' }">{{ meta.ph }}</span>
      <button class="btn ghost icon" @click="fbUi.open = false"><Ico n="x"/></button></header>
    <div class="compose">
      <input v-if="!fb.name" class="inp" v-model="nameDraft" placeholder="你的名字">
      <div class="verdict"><button v-for="v in VERDICTS" :key="v" :class="{ on: mine === v }" @click="verdict(v)">{{ v }}<i v-if="verdictCount(mod, v)">{{ verdictCount(mod, v) }}</i></button></div>
      <textarea ref="box" class="inp" v-model="text" placeholder="这里怎么样？" @keydown.meta.enter="send" @keydown.ctrl.enter="send"></textarea>
      <div class="row">
        <span v-if="fbUi.draft" class="anchor-chip"><Ico n="pin" :s="14"/>{{ fbUi.draft.anchor || '页面' }}<button class="btn ghost icon sm" @click="fbUi.draft = null"><Ico n="x" :s="12"/></button></span>
        <button v-else class="btn ghost" @click="fbUi.picking = true"><Ico n="pin" :s="14"/>圈位置</button>
        <span style="flex:1"></span>
        <button class="btn pri" @click="send">发送</button>
      </div>
    </div>
    <div class="items">
      <div v-for="x in items" :key="x.id" class="item" :class="{ hl: fbUi.focus === x.id }">
        <div class="who"><i v-if="pinNo(x)" class="pin-no">{{ pinNo(x) }}</i><b>{{ x.author || '未署名' }}</b><span>{{ fmtStamp(x.at) }}</span>
          <button v-if="x.author === fb.name" @click="remove(x)"><Ico n="trash" :s="13"/></button></div>
        <p>{{ x.text }}</p>
        <a v-if="x.anchor || x.path !== nav.path" class="dim" style="font-size:12px;cursor:pointer" @click="open(x)">{{ x.title }}{{ x.anchor ? ' · ' + x.anchor : '' }}</a>
      </div>
      <div v-if="!items.length" class="empty" style="padding:40px 0">这个模块还没有意见</div>
    </div>
  </aside>`,
})

/* 当前页面上的意见编号点 */
comp('Pins', {
  setup() {
    const pos = ref([])
    const find = (label) => (label === '页面' ? document.querySelector('.main') : [...document.querySelectorAll('[data-c]')].find((e) => e.dataset.c === label))
    const tick = () => {
      pos.value = pinsHere().map((x, i) => {
        const el = find(x.anchor)
        if (!el) return null
        const r = el.getBoundingClientRect()
        if (!r.width) return null
        return { id: x.id, n: i + 1, left: r.left + x.rx * r.width, top: r.top + x.ry * r.height }
      }).filter(Boolean)
    }
    let t
    onMounted(() => { tick(); t = setInterval(tick, 200) })
    onUnmounted(() => clearInterval(t))
    return { pos, fbUi }
  },
  template: `<div class="pins"><i v-for="p in pos" :key="p.id" class="pin-no" :style="{ left: p.left + 'px', top: p.top + 'px' }" @click="fbUi.focus = p.id">{{ p.n }}</i></div>`,
})

/* 圈位置：鼠标移到哪个区块就高亮哪个，点一下记下来 */
comp('Picker', {
  setup() {
    const hl = ref(null)
    useEsc(() => { fbUi.picking = false })
    const target = (e) => {
      const el = document.elementsFromPoint(e.clientX, e.clientY).find((x) => !x.closest('.picking') && !x.closest('.fb'))
      if (!el) return null
      const a = el.closest('[data-c]')
      const box = a || document.querySelector('.main')
      return { label: a ? a.dataset.c : '页面', r: box.getBoundingClientRect() }
    }
    function move(e) { hl.value = target(e) }
    function pick(e) {
      const t = target(e)
      fbUi.picking = false
      if (!t) return
      fbUi.draft = { anchor: t.label, rx: (e.clientX - t.r.left) / t.r.width, ry: (e.clientY - t.r.top) / t.r.height }
    }
    return { hl, move, pick }
  },
  template: `<div class="picking" @mousemove="move" @click="pick"><div v-if="hl" class="hl" :style="{ left: hl.r.left + 'px', top: hl.r.top + 'px', width: hl.r.width + 'px', height: hl.r.height + 'px' }"><span>{{ hl.label }}</span></div></div>`,
})

/* 意见汇总 */
route('/feedback', {
  setup() {
    const file = ref(null)
    const groups = computed(() => NAV.map((g) => ({ g: g.g, items: g.items.map((it) => ({ ...it, list: fb.items.filter((x) => x.mod === it.k), vs: VERDICTS.map((v) => [v, verdictCount(it.k, v)]) })) })))
    const total = computed(() => fb.items.length)
    function imp(e) {
      const f = e.target.files[0]
      if (!f) return
      f.text().then((t) => { try { toast(`导入 ${fbImport(t)} 条意见`) } catch (err) { toast(err.message, null, true) } })
      e.target.value = ''
    }
    async function clear() { if (await ask('清空意见', '这台电脑上记的意见会全部删掉，删了找不回来。先导出备份。', '清空', true)) { fb.items.splice(0); Object.keys(fb.verdicts).forEach((k) => delete fb.verdicts[k]) } }
    const exportMd = () => download('SCM原型意见.md', fbMarkdown(), 'text/markdown')
    const exportJson = () => download('SCM原型意见.json', fbJson(), 'application/json')
    return { groups, total, file, imp, clear, exportMd, exportJson, fmtStamp, fb }
  },
  template: `<div>
    <Head t="意见汇总">
      <input ref="file" type="file" accept=".json" hidden @change="imp">
      <button class="btn ghost" @click="file.click()"><Ico n="upload" :s="14"/>导入</button>
      <button class="btn" @click="exportJson">导出 JSON</button>
      <button class="btn pri" @click="exportMd"><Ico n="download" :s="14"/>导出 Markdown</button>
      <More :items="[{ t: '清空意见', danger: true, fn: clear }]"/>
    </Head>
    <div class="page narrow" data-c="意见汇总">
      <template v-for="g in groups" :key="g.g">
        <div class="h2">{{ g.g || '首页' }}</div>
        <div class="list">
          <div v-for="it in g.items" :key="it.k" style="border-bottom:1px solid var(--line);padding:10px 4px">
            <div class="row"><Ico :n="it.i" :s="15"/><a :href="'#' + it.to" style="font-weight:500">{{ it.t }}</a>
              <span class="pill" :class="{ amber: it.ph === '待定', blue: it.ph === '二期' }">{{ it.ph }}</span>
              <span class="dim" style="font-size:12px">{{ it.ref }}</span>
              <span style="flex:1"></span>
              <span v-for="[v, n] in it.vs.filter(x => x[1])" :key="v" class="pill" :class="{ green: v === '保留', red: v === '不需要', amber: v === '要改' }">{{ v }} {{ n }}</span>
              <span v-if="it.list.length" class="dim" style="font-size:12px">{{ it.list.length }} 条</span>
            </div>
            <div v-for="x in it.list" :key="x.id" style="padding:8px 0 0 25px">
              <div>{{ x.text }}</div>
              <div class="dim" style="font-size:12px">{{ x.author || '未署名' }} · {{ fmtStamp(x.at) }} · <a :href="'#' + x.path">{{ x.title }}{{ x.anchor ? ' · ' + x.anchor : '' }}</a></div>
            </div>
          </div>

      <p v-if="!total" class="empty">还没有意见。在任何页面点左下角「意见」写。</p>
    </div>
  </div>`,
}, { mod: 'feedback', t: '意见汇总' })
</script>

// 首页：按角色看的仪表盘。数字卡片点进去就是筛好的列表；图表的前几周是演示用的历史数
const HIST_ORDER = [1180, 860, 1420, 990, 1630, 1210, 1880, 1350, 1560, 2120, 1740]
const HIST_RET = [640, 920, 780, 1150, 1020, 1310, 990, 1460, 1280, 1390, 1610]
const CAT_COLORS = ['#2d4e8c', '#d9a23a', '#2e7350', '#b4392b', '#6c83ae', '#8a909c', '#b49a6a', '#5b6475', '#96b9a8', '#c9b37e']
function weekly(rows, dateOf, qtyOf, hist) {
  const end = toD(clock.today), weeks = hist.length + 1
  const out = hist.map((v) => v), lbl = []
  for (let i = 0; i < weeks; i++) { const d = new Date(end); d.setDate(d.getDate() - (weeks - 1 - i) * 7); lbl.push(`${d.getMonth() + 1}/${d.getDate()}`) }
  out.push(0)
  rows.forEach((r) => { const k = weeks - 1 - Math.floor(diffDays(clock.today, dateOf(r)) / 7); if (k >= 0 && k < weeks) out[k] += qtyOf(r) })
  return { lbl, out }
}

      const audit = [
        ...db.orders.filter((o) => o.status === '待审核').map((o) => ({ t: '订单 ' + o.no, sub: `${custOrDash(o)} · ${fq(orderQty(o))} 件 · 交期 ${o.due}`, to: '/orders/' + o.no, img: orderStyles(o)[0] })),
        ...db.purchases.filter((p) => p.status === '待审核').map((p) => ({ t: '采购单 ' + p.no, sub: `${supName(p.supplier)} · ¥${fm(poAmt(p)).replace('¥', '')}`, to: '/purchases/' + p.no, img: p.lines[0]?.sku })),
        ...db.productions.filter((p) => p.status === '待审核').map((p) => ({ t: '加工单 ' + p.no, sub: `${supName(p.factory)} · ${fq(prodQty(p))} 件`, to: '/production/' + p.no, img: p.style })),
        ...db.changes.filter((c) => c.status === '待审核').map((c) => ({ t: '变更单 ' + c.no, sub: `订单 ${c.order}`, to: '/orders/' + c.order + '?tab=changes', img: order(c.order) && orderStyles(order(c.order))[0] })),
      ]
      if (audit.length) g.push({ tag: '待审核', tone: 'pending', items: audit })
      const late = risk.value.filter((x) => x.r.late || x.r.node).map(({ p, r }) => ({ t: `${p.no} ${styleName(p.style)}`, sub: `${supName(p.factory)} · ${r.late ? '交期 ' + fd(expectDue(p)) + ' 已过' : '节点「' + (curNode(p)?.name || '') + '」延期'}`, to: '/production/' + p.no, img: p.style }))
      if (late.length) g.push({ tag: '生产延期', tone: 'bad', items: late })
      const arr = arrivals().filter((a) => a.risk === 'late').map((a) => ({ t: `${skuName(a.l.sku)} 还差 ${fq(rnd(a.l.qty - a.l.received, 3))} ${unitOf(a.l.sku)}`, sub: `${a.p.no} · ${supName(a.p.supplier)} · 应到 ${fd(a.date)}`, to: '/purchases/' + a.p.no, img: a.l.sku }))

      const sch = db.orders.filter((o) => orderLive(o) && orderSched(o) === 0).map((o) => ({ t: '订单 ' + o.no, sub: `${custOrDash(o)} · ${fq(orderQty(o))} 件 · 交期 ${o.due}`, to: '/orders/' + o.no, img: orderStyles(o)[0] }))
      if (sch.length) g.push({ tag: '待排单', tone: 'pending', items: sch })
      const iss = live.value.flatMap((p) => (p.issues || []).filter((x) => x.status === '待处理').map((x) => ({ t: `${x.type}：${x.desc}`, sub: `${p.no} · ${userName(x.by)} 上报于 ${fd(x.at)}`, to: '/production/' + p.no, img: p.style })))
      if (iss.length) g.push({ tag: '异常待处理', tone: 'ring', items: iss })
      return g
    })
    const others = computed(() => TODOS.flatMap((f) => f()).filter((x) => x.n > 0))
    const doing = computed(() => live.value.slice().sort((a, b) => expectDue(a).localeCompare(expectDue(b))).slice(0, 6))

comp('BomRowNew', {
  props: { tp: Object },
  emits: ['close'],
  setup(p, { emit }) {
    const s = style(p.tp.style)
    const sizes = sizesOf(s.sizeGroup)
    const f = reactive({ part: '大身', mat: 'ML0012', mode: '随款色', sku: '', map: {}, um: '统一', use: 1, uses: Object.fromEntries(sizes.map((z) => [z, null])), loss: 3, src: '我方采购', note: '' })
    const m = computed(() => mat(f.mat))
    watch(() => f.mat, () => {
      const skus = m.value.skus
      f.sku = skus[0].code
      f.map = Object.fromEntries(s.colors.map((c) => [c, skus.find((k) => k.color === c)?.code]).filter(([, v]) => v))
      f.mode = skus.length > 1 ? '随款色' : '固定'
    }, { immediate: true })
    function save() {
      const r = { ...JSON.parse(JSON.stringify(f)), supplier: m.value.supplier }
      if (r.mode === '固定') delete r.map; else delete r.sku
      p.tp.bom.push(r)
      emit('close')
    }
    return { s, sizes, f, m, save }
  },
  template: `<Modal t="加一行物料" :w="620" @close="$emit('close')">
    <div class="form">
      <label class="f">部位<select class="sel" v-model="f.part"><option v-for="x in db.dicts.BOM部位" :key="x">{{ x }}</option></select></label>
      <label class="f">物料<select class="sel" v-model="f.mat"><option v-for="x in db.materials.filter(x => x.status === '启用')" :key="x.code" :value="x.code">{{ x.code }} {{ x.name }}</option></select></label>
      <div class="f">配色<Seg v-model="f.mode" :items="['固定', '随款色']"/></div>
      <label v-if="f.mode === '固定'" class="f">物料 SKU<select class="sel" v-model="f.sku"><option v-for="k in m.skus" :key="k.code" :value="k.code">{{ skuName(k.code) }}</option></select></label>
      <div v-else class="f full">款色 → 物料颜色<div class="chips"><label v-for="c in s.colors" :key="c" class="row g4"><Sw :c="c"/><select class="sel" style="height:26px" v-model="f.map[c]"><option :value="undefined">未配</option><option v-for="k in m.skus" :key="k.code" :value="k.code">{{ skuName(k.code) }}</option></select></label></div></div>
      <div class="f">用量<Seg v-model="f.um" :items="['统一', '分码']"/></div>
      <label v-if="f.um === '统一'" class="f">单件用量（{{ m.unit }}）<input class="inp num" v-model.number="f.use"></label>
      <div v-else class="f full">分码用量（{{ m.unit }}/件）<div class="row"><label v-for="z in sizes" :key="z" class="f" style="width:72px">{{ z }}<input class="inp num" v-model.number="f.uses[z]"></label></div></div>
      <label class="f">损耗 %<input class="inp num" v-model.number="f.loss"></label>
      <label class="f">来源<select class="sel" v-model="f.src"><option>我方采购</option><option>客供</option><option>工厂自备</option></select></label>
      <label class="f full">备注<input class="inp" v-model="f.note"></label>
    </div>
    <template #foot><button class="btn" @click="$emit('close')">取消</button><button class="btn pri" @click="save">加上</button></template>
  </Modal>`,
})

</script>
<script>/* 5b-order.js */
/* ============================================================
 * 订单（M06）：列表、颜色 × 尺码矩阵录单、审核即评审、排单、订单变更

SEARCH.push(() => db.orders.map((o) => ({ t: o.no + ' ' + (o.customer ? custName(o.customer) : o.type), sub: '订单 ' + orderStyles(o).join(' ') + (o.custNo ? ' ' + o.custNo : ''), to: '/orders/' + o.no, i: 'file' })))
const custOrDash = (o) => (o.customer ? custName(o.customer) : o.type)
const merchants = () => db.users

route('/orders', {
  setup() {
    const s = reactive({ tab: nav.query.s || '全部', f: nav.query.f || '', q: '', add: nav.query.new || null })
    const tabs = computed(() => ['全部', '草稿', '待审核', '已审核', '生产中', '已完成'].map((k) => [k, k, k === '全部' ? db.orders.length : db.orders.filter((o) => o.status === k).length]))
    const rows = computed(() => {
      const ks = s.q.trim().toLowerCase().split(/\s+/).filter(Boolean)
      return db.orders.filter((o) => (s.tab === '全部' || o.status === s.tab) && (s.f !== '待排单' || (orderLive(o) && orderSched(o) === 0))
        && (!ks.length || ks.some((k) => [o.no, o.custNo, custOrDash(o), ...orderStyles(o)].join(' ').toLowerCase().includes(k)))).slice().reverse()
    })
    return { s, tabs, rows, custOrDash }
  },
  template: `<div>
    <Head t="订单"><button class="btn pri" @click="s.add = true"><Ico n="plus" :s="14"/>新建订单</button></Head>
    <div class="bar" data-c="筛选"><Seg v-model="s.tab" :items="tabs"/><button v-if="s.f" class="chip on" @click="s.f = ''">{{ s.f }}<Ico n="x" :s="12"/></button><span class="sp"></span><Search v-model="s.q"/></div>
    <div data-c="订单列表">
      <Tbl :rows="rows" link @row="o => go('/orders/' + o.no)" empty="没有符合条件的订单" :cols="[
        { k: 'no', t: '订单号', c: 'code' }, { k: 'cust', t: '客户', f: custOrDash }, { k: 'styles', t: '款式' },
        { k: 'qty', t: '数量', c: 'num', f: o => orderQty(o).toLocaleString() }, { k: 'amt', t: '金额', c: 'num', f: o => orderAmt(o) ? fm(orderAmt(o)) : '—' },
        { k: 'due', t: '交期', f: o => fd(o.commit || o.due) }, { k: 'sched', t: '排产' }, { k: 'ret', t: '回货' }, { k: 'kit', t: '齐料' },
        { k: 'merch', t: '跟单', f: o => userName(o.merch) }, { k: 'status', t: '状态' }]">
        <template #styles="{ r }"><span class="row g4"><Thumb v-for="c in orderStyles(r)" :key="c" :code="c" :s="22"/><span class="code mut">{{ orderStyles(r).join(' ') }}</span></span></template>
        <template #sched="{ r }"><Prog v-if="r.status !== '草稿' && r.status !== '待审核'" :a="orderSched(r)" :b="orderQty(r)"/><span v-else class="dim">—</span></template>
        <template #ret="{ r }"><Prog v-if="orderSched(r)" :a="orderRet(r)" :b="orderQty(r)"/><span v-else class="dim">—</span></template>
        <template #kit="{ r }"><St v-if="orderLive(r) || r.status === '已完成'" :s="kitState(r).k === 'ok' ? '齐料' : kitState(r).k === 'part' ? '部分到货' : '未到料'" :t="kitState(r).t"/><span v-else class="dim">—</span></template>
        <template #status="{ r }"><St :s="r.status"/></template>
      </Tbl>
    </div>
    <OrderNew v-if="s.add" :st="typeof s.add === 'string' ? s.add : null" :customer="nav.query.customer" @close="s.add = null"/>
  </div>`,
}, { mod: 'orders', t: '订单' })

/* ---------- 新建订单：一个款一张颜色 × 尺码矩阵 ---------- */
comp('OrderNew', {
  props: { st: String, customer: String },
  emits: ['close'],
  setup(p, { emit }) {
    const f = reactive({ type: '客户订单', customer: p.customer || 'KH0001', custNo: '', due: addDays(clock.today, 60), sales: 'u3', merch: 'u1', ship: '' })
    const blocks = reactive([])
    const pickable = computed(() => db.styles.filter((s) => s.status === '启用' && !blocks.some((b) => b.style === s.code)))
    const pick = ref('')
    const addBlock = (code) => { if (code) blocks.push({ style: code, price: null, qty: {} }); pick.value = '' }
    if (style(p.st)) addBlock(p.st)
    const total = computed(() => sum(blocks, (b) => sum(Object.values(b.qty))))
    const amount = computed(() => sum(blocks, (b) => sum(Object.values(b.qty)) * (b.price || 0)))
    function save(submit) {
      const o = run(() => createOrder({ ...f, customer: f.type === '自营备货' ? null : f.customer, lines: blocks.flatMap((b) => Object.entries(b.qty).map(([k, n]) => { const [color, size] = k.split('|'); return { style: b.style, color, size, qty: n, price: b.price } })) }))
      if (!o?.no) return
      if (submit && !run(() => submitOrder(o))) { emit('close'); go('/orders/' + o.no); return }
      emit('close'); go('/orders/' + o.no); toast(submit ? `${o.no} 已提交，等审核` : `${o.no} 已存草稿`)
    }
    return { f, blocks, pickable, pick, addBlock, total, amount, save }
  },
  template: `<Modal t="新建订单" :w="780" @close="$emit('close')">
    <div class="form" style="grid-template-columns:repeat(3,1fr)">
      <label class="f">类型<select class="sel" v-model="f.type"><option v-for="x in db.dicts.订单类型" :key="x">{{ x }}</option></select></label>
      <label class="f" v-if="f.type !== '自营备货'">客户<select class="sel" v-model="f.customer"><option v-for="c in db.customers" :key="c.code" :value="c.code">{{ c.short }}</option></select></label>
      <label class="f" v-if="f.type !== '自营备货'">客户订单号<input class="inp" v-model="f.custNo"></label>
      <label class="f">客户交期<input class="inp" type="date" v-model="f.due"></label>
      <label class="f">业务员<select class="sel" v-model="f.sales"><option v-for="u in db.users" :key="u.id" :value="u.id">{{ u.name }}</option></select></label>
      <label class="f">跟单员<select class="sel" v-model="f.merch"><option v-for="u in db.users" :key="u.id" :value="u.id">{{ u.name }}</option></select></label>
    </div>
    <div v-for="(b, i) in blocks" :key="b.style" class="sec" style="margin-top:20px" data-c="录单矩阵">
      <h3><Thumb :code="b.style" :s="24"/><span class="code">{{ b.style }}</span>{{ styleName(b.style) }}
        <span class="acts"><label class="row g4 mut">单价<input class="inp num" style="width:90px;height:26px" type="number" v-model.number="b.price"></label><button class="btn ghost icon sm" @click="blocks.splice(i, 1)"><Ico n="x" :s="13"/></button></span></h3>
      <Matrix :st="b.style" v-model="b.qty"/>
    </div>
    <div class="row" style="margin-top:16px"><select class="sel" v-model="pick" @change="addBlock(pick)" style="width:260px"><option value="">加一个款……</option><option v-for="s in pickable" :key="s.code" :value="s.code">{{ s.code }} {{ s.name }}{{ activeTp(s.code) ? '' : '（资料包未生效）' }}</option></select></div>
    <template #foot><span class="mut">{{ total }} 件<template v-if="amount"> · {{ fm(amount) }}</template></span><span class="sp"></span>
      <button class="btn" @click="save(false)">存草稿</button><button class="btn pri" @click="save(true)">提交审核</button></template>
  </Modal>`,
})

/* ---------- 订单详情 ---------- */
route('/orders/:no', {
  props: ['no'],
  setup(p) {
    const o = computed(() => order(p.no))
    const tab = ref(nav.query.tab || 'lines')
    const dlg = ref('')
    const lineMap = (st) => Object.fromEntries(o.value.lines.filter((l) => l.style === st).map((l) => [l.color + '|' + l.size, l.qty]))
    const cellSub = (st) => (c, z) => {
      const l = o.value.lines.find((x) => x.style === st && x.color === c && x.size === z)
      if (!l || !orderLive(o.value) && o.value.status !== '已完成') return ''
      return `排 ${scheduledQty(o.value, l)} · 回 ${returnedQty(o.value, l)}`
    }
    const stylePrice = (st) => o.value.lines.find((l) => l.style === st)?.price
    const lockedVer = (st) => o.value.lines.find((l) => l.style === st)?.ver
    const down = computed(() => {
      const ms = mrpsOf(o.value)
      return [
        ...prodsOf(o.value).map((x) => ({ type: '加工单', no: x.no, to: '/production/' + x.no, who: supName(x.factory), qty: prodQty(x), status: x.status, p: x })),
        ...ms.map((x) => ({ type: '算料单', no: x.no, to: '/mrp/' + x.no, who: '', qty: null, status: x.status })),
        ...db.purchases.filter((x) => x.lines.some((l) => ms.some((m) => m.no === l.src?.mrp))).map((x) => ({ type: '采购单', no: x.no, to: '/purchases/' + x.no, who: supName(x.supplier), qty: null, status: x.status })),
        ...db.returns.filter((x) => x.order === o.value.no).map((x) => ({ type: '回货单', no: x.no, to: '/production/' + x.prod, who: supName(x.factory), qty: sum(x.lines, (l) => l.qty), status: '已完成' })),
      ]
    })
    const changes = computed(() => db.changes.filter((c) => c.order === p.no).slice().reverse())
    const pendingChange = computed(() => changes.value.find((c) => c.status === '待审核'))
    function act(a) { if (run(() => doAction('order', o.value, a))) toast(`${o.value.no} ${a}了`) }
    function doMrp() { const m = run(() => createMrp([o.value.no])); if (m?.no) { go('/mrp/' + m.no); toast(`${m.no} 算好了，勾选要买的行生成采购单`) } }
    async function remove() { if (await ask('删除订单', `${o.value.no} 删除后找不回来。`, '删除', true)) { db.orders.splice(db.orders.indexOf(o.value), 1); go('/orders') } }
    const more = computed(() => [
      can('order', o.value, '撤回') && { t: '撤回', fn: () => act('撤回') },
      can('order', o.value, '反审核') && { t: '反审核', fn: () => act('反审核') },
      can('order', o.value, '结案') && { t: '结案', fn: () => act('结案') },
      can('order', o.value, '作废') && { t: '作废', danger: true, fn: () => act('作废') },
      o.value.status === '草稿' && { t: '删除', danger: true, fn: remove },
    ].filter(Boolean))
    return { o, tab, dlg, lineMap, cellSub, stylePrice, lockedVer, down, changes, pendingChange, act, doMrp, more }
  },
  template: `<div v-if="o">
    <Head :t="o.no" :back="['订单', '/orders']">

/* ---------- 审核即评审：资料包、齐料参考、在手负荷，填承诺交期 ---------- */
comp('OrderAudit', {
  props: { o: Object },
  emits: ['close'],
  setup(p, { emit }) {
    const info = computed(() => reviewInfo(p.o))
    const commit = ref(p.o.due)

/* ---------- 排单：每个款一块，可以拆给几个工厂；一块生成一张加工单 ---------- */
comp('OrderSchedule', {
  props: { o: Object },
  emits: ['close', 'done'],
  setup(p, { emit }) {
    const factories = computed(() => db.suppliers.filter(isFactory))
    const remain = (st) => Object.fromEntries(p.o.lines.filter((l) => l.style === st).map((l) => [l.color + '|' + l.size, Math.max(0, l.qty - scheduledQty(p.o, l))]))
    const due = addDays(p.o.commit || p.o.due, -10)
    const mk = (st, qty) => ({ style: st, factory: style(st).factory, mode: '清加工', price: activeTp(st) ? tpLabor(activeTp(st)) : null, due, qty })
    const blocks = reactive(orderStyles(p.o).filter((st) => sum(Object.values(remain(st)))).map((st) => mk(st, remain(st))))
    const more = (st) => blocks.splice(blocks.map((b) => b.style).lastIndexOf(st) + 1, 0, mk(st, {}))
    const colorsOf = (st) => [...new Set(p.o.lines.filter((l) => l.style === st).map((l) => l.color))]
    const sub = (st) => (c, z) => '余 ' + (remain(st)[c + '|' + z] ?? 0)
    function ok() {
      const ps = run(() => scheduleOrder(p.o, blocks))
      if (!ps?.length) return
      emit('close'); emit('done')
      toast(`生成 ${ps.length} 张加工单草稿`, ['打开 ' + ps[0].no, '/production/' + ps[0].no])
    }
    return { factories, blocks, more, colorsOf, sub, ok }
  },
  template: `<Modal :t="'排单 ' + o.no" :w="820" @close="$emit('close')">
    <div v-if="!blocks.length" class="empty">订单的数量都已经排完了</div>
    <div v-for="(b, i) in blocks" :key="i" class="sec" :style="i ? '' : 'margin-top:0'" data-c="排单块">
      <h3><Thumb :code="b.style" :s="24"/><span class="code">{{ b.style }}</span>{{ styleName(b.style) }}<span class="acts"><button class="btn ghost sm" @click="more(b.style)"><Ico n="plus" :s="12"/>再加一个工厂</button><button v-if="blocks.filter(x => x.style === b.style).length > 1" class="btn ghost icon sm" @click="blocks.splice(i, 1)"><Ico n="x" :s="12"/></button></span></h3>
      <div class="form" style="grid-template-columns:2fr 1fr 1fr 1.3fr;margin-bottom:10px">
        <label class="f">加工厂<select class="sel" v-model="b.factory"><option v-for="s in factories" :key="s.code" :value="s.code" :disabled="s.status !== '合作中'">{{ s.short }}{{ s.status !== '合作中' ? '（' + s.status + '）' : '' }}</option></select></label>
        <label class="f">加工方式<select class="sel" v-model="b.mode"><option v-for="x in db.dicts.加工方式" :key="x">{{ x }}</option></select></label>
        <label class="f">单价（元/件）<input class="inp num" type="number" v-model.number="b.price"></label>
        <label class="f">交期<input class="inp" type="date" v-model="b.due"></label>
      </div>
      <Matrix :st="b.style" v-model="b.qty" :colors="colorsOf(b.style)" :sub="sub(b.style)"/>
    </div>
    <template #foot><button class="btn" @click="$emit('close')">取消</button><button class="btn pri" :disabled="!blocks.length" @click="ok">生成加工单</button></template>
  </Modal>`,
})

/* ---------- 提变更：改数量（矩阵）、改交期 ---------- */
comp('OrderChange', {
  props: { o: Object },
  emits: ['close', 'done'],
  setup(p, { emit }) {
    const qty = reactive(Object.fromEntries(orderStyles(p.o).map((st) => [st, Object.fromEntries(p.o.lines.filter((l) => l.style === st).map((l) => [l.color + '|' + l.size, l.qty]))])))
    const f = reactive({ due: p.o.due, reason: '', party: '客户', fee: '' })
    const colorsOf = (st) => [...new Set(p.o.lines.filter((l) => l.style === st).map((l) => l.color))]
    const sub = (st) => (c, z) => { const l = p.o.lines.find((x) => x.style === st && x.color === c && x.size === z); return l ? '原 ' + l.qty + ' · 已排 ' + scheduledQty(p.o, l) : '' }
    function ok() {
      const items = Object.entries(qty).flatMap(([st, m]) => Object.entries(m).map(([k, n]) => ({ k: st + '|' + k, to: n })))
      const c = run(() => createChange(p.o, { ...f, items }))
      if (c?.no) { emit('close'); emit('done'); toast(`${c.no} 已提交，审核后写回订单`) }
    }
    return { qty, f, colorsOf, sub, ok }
  },
  template: `<Modal :t="'变更 ' + o.no" :w="780" @close="$emit('close')">
    <div v-for="st in Object.keys(qty)" :key="st" style="margin-bottom:18px" data-c="变更矩阵"><div class="row" style="margin-bottom:6px"><Thumb :code="st" :s="22"/><span class="code">{{ st }}</span>{{ styleName(st) }}</div>
      <Matrix :st="st" v-model="qty[st]" :colors="colorsOf(st)" :sub="sub(st)"/></div>
    <div class="form">
      <label class="f">客户交期<input class="inp" type="date" v-model="f.due"></label>
      <label class="f">责任方<select class="sel" v-model="f.party"><option>客户</option><option>我方</option><option>工厂</option><option>供应商</option></select></label>
      <label class="f full">原因<input class="inp" v-model="f.reason"></label>
      <label class="f full">费用说明<input class="inp" v-model="f.fee" placeholder="如：客户承担已裁片损失"></label>
    </div>
    <template #foot><button class="btn" @click="$emit('close')">取消</button><button class="btn pri" @click="ok">提交变更</button></template>
  </Modal>`,
})

/* ---------- 变更单列表 ---------- */
route('/changes', {

    const tabs = computed(() => ['全部', '待审核', '已审核', '已驳回'].map((k) => [k, k, k === '全部' ? db.changes.length : db.changes.filter((c) => c.status === k).length]))

    <div data-c="变更列表">
      <Tbl :rows="rows" link @row="c => go('/orders/' + c.order + '?tab=changes')" empty="没有变更单。已审核的订单在详情页「提变更」" :cols="[
        { k: 'no', t: '变更单号', c: 'code' }, { k: 'order', t: '订单', c: 'code' }, { k: 'text', t: '改了什么' }, { k: 'reason', t: '原因' },
        { k: 'party', t: '责任方' }, { k: 'by', t: '提交人', f: c => userName(c.by) }, { k: 'date', t: '日期', f: c => fd(c.date) }, { k: 'status', t: '状态' }]">
        <template #text="{ r }"><span class="wrap">{{ describeChange(r) }}</span></template>
        <template #status="{ r }"><span class="row" @click.stop><St :s="r.status"/><template v-if="r.status === '待审核'"><button class="btn sm" @click="run(() => doAction('change', r, '驳回'))">驳回</button><button class="btn sm pri" @click="run(() => doAction('change', r, '审核')) && toast('变更已写回订单，下游单据已提示')">审核</button></template></span></template>
      </Tbl>
    </div>
  </div>`,
}, { mod: 'changes', t: '变更' })

expose({ createMrp, submitOrder, custOrDash })
</script>
<script>/* 5c-material.js */
/* ============================================================
 * 物料（M07）：算料、采购单、到料跟踪、出入库单、库存与库存日志
 * ============================================================ */
SEARCH.push(() => [
  ...db.mrps.map((m) => ({ t: m.no, sub: '算料单 ' + m.orders.join(' '), to: '/mrp/' + m.no, i: 'sigma' })),
  ...db.purchases.map((p) => ({ t: p.no + ' ' + supName(p.supplier), sub: '采购单', to: '/purchases/' + p.no, i: 'cart' })),
  ...db.stockDocs.map((d) => ({ t: d.no + ' ' + d.type, sub: '出入库单', to: '/stock-docs/' + d.no, i: 'swap' })),
])
const purUnit = (sku) => matOfSku(sku)?.purUnit || ''
const srcText = (l) => (l.src ? [...(l.src.orders || []), ...(l.src.styles || [])].join(' ') : '—')

/* ---------- 算料 ---------- */
route('/mrp', {
  setup() {
    const s = reactive({ tab: '全部', add: false })
    const tabs = computed(() => ['全部', '草稿', '已确认', '已关闭'].map((k) => [k, k, k === '全部' ? db.mrps.length : db.mrps.filter((m) => m.status === k).length]))
    const rows = computed(() => db.mrps.filter((m) => s.tab === '全部' || m.status === s.tab).slice().reverse())
    const buyRows = (m) => m.rows.filter((r) => r.src === '我方采购' && r.purQty > 0)
    return { s, tabs, rows, buyRows }
  },
  template: `<div>
    <Head t="算料"><button class="btn pri" @click="s.add = true"><Ico n="plus" :s="14"/>选订单算料</button></Head>
    <div class="bar" data-c="筛选"><Seg v-model="s.tab" :items="tabs"/></div>
    <div data-c="算料单列表">
      <Tbl :rows="rows" link @row="m => go('/mrp/' + m.no)" empty="还没有算料单" :cols="[
        { k: 'no', t: '算料单号', c: 'code' }, { k: 'orders', t: '订单', c: 'code', f: m => m.orders.join(' ') },
        { k: 'styles', t: '款式', f: m => [...new Set(m.orders.flatMap(o => orderStyles(order(o))))].join(' ') },
        { k: 'buy', t: '要买', c: 'num', f: m => buyRows(m).length + ' 种' }, { k: 'conv', t: '转采购' },
        { k: 'date', t: '日期', f: m => fd(m.date) }, { k: 'status', t: '状态' }]">
        <template #conv="{ r }"><Prog v-if="buyRows(r).length" :a="buyRows(r).filter(x => x.converted >= x.purQty).length" :b="buyRows(r).length"/><span v-else class="dim">不用买</span></template>
        <template #status="{ r }"><St :s="r.status"/></template>
      </Tbl>
    </div>
    <MrpNew v-if="s.add" @close="s.add = false"/>
  </div>`,
}, { mod: 'mrp', t: '算料' })

comp('MrpNew', {
  emits: ['close'],
  setup(_, { emit }) {
    const live = computed(() => db.orders.filter(orderLive))
    const picked = reactive([])
    const toggle = (no) => { const i = picked.indexOf(no); i >= 0 ? picked.splice(i, 1) : picked.push(no) }
    function ok() { const m = run(() => createMrp([...picked])); if (m?.no) { emit('close'); go('/mrp/' + m.no) } }
    return { live, picked, toggle, ok }
  },
  template: `<Modal t="选订单算料" :w="640" @close="$emit('close')">
    <Tbl inset flat :rows="live" :sel="o => picked.includes(o.no)" link @row="o => toggle(o.no)" empty="没有已审核的订单" :cols="[
      { k: 'ck', t: '', w: '28px' }, { k: 'no', t: '订单号', c: 'code' }, { k: 'cust', t: '客户', f: custOrDash }, { k: 'styles', t: '款式', c: 'code', f: o => orderStyles(o).join(' ') },
      { k: 'qty', t: '数量', c: 'num', f: o => orderQty(o) }, { k: 'mrp', t: '算过', f: o => mrpsOf(o).map(m => m.no).join(' ') || '—' }]">
      <template #ck="{ r }"><input type="checkbox" :checked="picked.includes(r.no)" style="accent-color:var(--accent)"></template>
    </Tbl>
    <template #foot><button class="btn" @click="$emit('close')">取消</button><button class="btn pri" :disabled="!picked.length" @click="ok">算料</button></template>
  </Modal>`,
})

route('/mrp/:no', {
  props: ['no'],
  setup(p) {
    const m = computed(() => mrp(p.no))
    const idx = (src) => m.value.rows.map((r, i) => (r.src === src ? i : -1)).filter((i) => i >= 0)
    const buy = computed(() => idx('我方采购'))
    const picked = reactive(buy.value.filter((i) => m.value.rows[i].purQty > m.value.rows[i].converted))
    const toggle = (i) => { const k = picked.indexOf(i); k >= 0 ? picked.splice(k, 1) : picked.push(i) }
    const open = computed(() => m.value.status !== '已关闭')
    const edit = computed(() => m.value.status === '草稿')
    const left = computed(() => buy.value.some((i) => m.value.rows[i].purQty > m.value.rows[i].converted))
    const suppliersFor = () => db.suppliers.filter((s) => s.cats.some((c) => ['面料商', '辅料商', '包材商'].includes(c)))
    function toPo() {
      const pos = run(() => mrpToPurchases(m.value, [...picked]))
      if (pos?.length) { picked.splice(0); toast(`按供应商拆成 ${pos.length} 张采购单草稿`, ['打开 ' + pos[0].no, '/purchases/' + pos[0].no]) }
    }
    function redo() {
      const n = run(() => createMrp(m.value.orders))
      if (!n?.no) return
      const diff = n.rows.map((r) => { const old = m.value.rows.find((x) => x.sku === r.sku && x.owner === r.owner && x.src === r.src); return { r, d: rnd(r.need - (old?.need || 0), 3) } }).filter((x) => x.d)
      if (m.value.status !== '已关闭') doAction('mrp', m.value, '关闭')
      go('/mrp/' + n.no)
      toast(diff.length ? '重新算好了：' + diff.slice(0, 3).map((x) => skuName(x.r.sku) + ' ' + (x.d > 0 ? '+' : '') + fq(x.d)).join('，') : '重新算好了，需求没变')
    }
    const more = computed(() => [{ t: '重新算料', fn: redo }, open.value && { t: '关闭', fn: () => run(() => doAction('mrp', m.value, '关闭')) }].filter(Boolean))
    return { m, idx, buy, picked, toggle, open, edit, left, suppliersFor, toPo, more, updateMrpRow }

function returnPurchase(p, lines) {
  if (!['已审核', '部分到货', '已到齐'].includes(p.status)) fail('采购单入库后才能退货')
  const ls = lines.filter((x) => x.qty > 0)
  if (!ls.length) fail('至少退一行')
  const errs = ls.filter((x) => x.qty > p.lines[x.i].received - p.lines[x.i].returned + 0.0005).map((x) => `${skuName(p.lines[x.i].sku)}：最多能退 ${fq(p.lines[x.i].received - p.lines[x.i].returned)}`)
  if (errs.length) fail('退货数超过已入库', errs)
  const d = createStockDoc({ type: '采购退货', src: p.no, partner: p.supplier, from: p.wh, reason: lines.reason || '', lines: ls.map((x) => { const l = p.lines[x.i]; return { sku: l.sku, owner: l.owner, qty: rnd(x.qty * matOfSku(l.sku).factor, 3), price: l.price } }) })
  postStockDoc(d)
  ls.forEach((x) => { p.lines[x.i].returned = rnd(p.lines[x.i].returned + x.qty, 3) })
  act(p, '退货 ' + d.no)
  return d
}

comp('PurchaseReceive', {
  props: { po: Object, mode: String },
  emits: ['close'],
  setup(p, { emit }) {
    const recv = p.mode === 'recv'
    const lines = reactive(p.po.lines.map((l, i) => ({ i, qty: recv ? rnd(Math.max(0, l.qty - l.received), 3) : 0, lot: '' })))
    const f = reactive({ wh: p.po.wh, supNo: '', reason: '' })
    const whs = computed(() => db.warehouses.filter((w) => w.type !== '成品仓'))
    function ok() {
      const d = run(() => (recv ? receivePurchase(p.po, { lines, wh: f.wh, supNo: f.supNo }) : returnPurchase(p.po, Object.assign([...lines], { reason: f.reason }))))
      if (d?.no) { emit('close'); toast(`${d.no} 已过账，库存已更新`, ['打开', '/stock-docs/' + d.no]) }
    }
    return { recv, lines, f, whs, ok, purUnit }
  },
  template: `<Modal :t="(recv ? '到货入库 ' : '退货 ') + po.no" :w="720" @close="$emit('close')">

const partnerName = (d) => (!d.partner ? '—' : d.partner.startsWith('KH') ? custName(d.partner) : supName(d.partner))
route('/stock-docs', {
  setup() {
    const s = reactive({ tab: '全部', q: '', add: '' })
    const tabs = computed(() => [['全部', '全部', db.stockDocs.length], ...Object.entries(DOC_GROUPS).map(([k, ts]) => [k, k, db.stockDocs.filter((d) => ts.includes(d.type)).length])])
    const rows = computed(() => db.stockDocs.filter((d) => (s.tab === '全部' || DOC_GROUPS[s.tab].includes(d.type)) && (!s.q || (d.no + d.type + d.src + d.lines.map((l) => skuName(l.sku)).join(' ')).includes(s.q))).slice().reverse())
    const news = ['客供入库', '其他入库', '调拨', '退料', '其他出库'].map((t) => ({ t, fn: () => { s.add = t } }))
    return { s, tabs, rows, news, partnerName }
  },
  template: `<div>
    <Head t="出入库"><button class="btn pri" @click="s.add = '客供入库'"><Ico n="plus" :s="14"/>客供入库</button><More :items="news"/></Head>
    <div class="bar" data-c="筛选"><Seg v-model="s.tab" :items="tabs"/><span class="sp"></span><Search v-model="s.q"/></div>
    <div data-c="出入库列表">
      <Tbl :rows="rows" link @row="d => go('/stock-docs/' + d.no)" empty="没有符合条件的单据" :cols="[
        { k: 'no', t: '单号', c: 'code' }, { k: 'type', t: '类型' }, { k: 'flow', t: '出仓 → 入仓' }, { k: 'partner', t: '往来', f: partnerName },
        { k: 'src', t: '源单', c: 'code', f: d => d.src || '—' }, { k: 'mat', t: '物料', f: d => skuName(d.lines[0].sku) + (d.lines.length > 1 ? ' 等 ' + d.lines.length + ' 种' : ''), img: d => d.lines[0].sku },
        { k: 'date', t: '日期', f: d => fd(d.date) }, { k: 'status', t: '状态' }]">
        <template #flow="{ r }"><span class="mut">{{ r.from ? whName(r.from) : '' }}<template v-if="r.from && r.to"> → </template>{{ r.to ? whName(r.to) : '' }}</span></template>
        <template #status="{ r }"><St :s="r.status"/></template>
      </Tbl>
    </div>
    <StockDocNew v-if="s.add" :type="s.add" @close="s.add = ''"/>
  </div>`,
}, { mod: 'stockdocs', t: '出入库' })

comp('StockDocNew', {
  props: { type: String },
  emits: ['close'],
  setup(p, { emit }) {
    const t = p.type
    const f = reactive({ type: t, partner: t === '客供入库' ? 'KH0001' : '', from: ['调拨', '其他出库'].includes(t) ? 'WL01' : t === '退料' ? 'GC0004' : null, to: ['客供入库', '其他入库', '退料'].includes(t) ? 'WL01' : t === '调拨' ? 'GC0005' : null, reason: '', lines: [{ sku: '', owner: '自有', qty: null, lot: '' }] })
    const skus = computed(() => db.materials.flatMap((m) => m.skus.map((k) => ({ code: k.code, t: skuName(k.code) }))))
    const owners = computed(() => ['自有', ...db.customers.map((c) => c.code)])
    const have = (l) => (f.from && l.sku ? stockQty(f.from, l.sku, l.owner) : null)
    function ok() { const d = run(() => createStockDoc({ ...f, lines: f.lines.map((l) => ({ ...l })) })); if (d?.no) { emit('close'); go('/stock-docs/' + d.no); toast(`${d.no} 存了草稿，审核后才改库存`) } }
    return { t, f, skus, owners, have, ok }
  },
  template: `<Modal :t="'新建' + t" :w="700" @close="$emit('close')">
    <div class="form" style="grid-template-columns:repeat(3,1fr)">
      <label v-if="t === '客供入库'" class="f">客户<select class="sel" v-model="f.partner"><option v-for="c in db.customers" :key="c.code" :value="c.code">{{ c.short }}</option></select></label>
      <label v-if="f.from !== null" class="f">出仓<select class="sel" v-model="f.from"><option v-for="w in db.warehouses.filter(w => w.type !== '成品仓')" :key="w.code" :value="w.code">{{ w.name }}</option></select></label>
      <label v-if="f.to !== null" class="f">入仓<select class="sel" v-model="f.to"><option v-for="w in db.warehouses.filter(w => w.type !== '成品仓')" :key="w.code" :value="w.code">{{ w.name }}</option></select></label>
      <label v-if="['其他入库', '其他出库', '调拨', '退料'].includes(t)" class="f">原因<input class="inp" v-model="f.reason" :placeholder="t === '其他入库' ? '期初 / 盘盈 / 样品' : t === '其他出库' ? '报废 / 盘亏 / 卖余料' : ''"></label>
    </div>
    <table class="tbl inset flat" style="margin-top:14px" data-c="出入库明细"><thead><tr><th>物料</th><th v-if="t !== '客供入库'" style="width:130px">物权</th><th v-if="f.from" class="num">库存</th><th class="num" style="width:100px">数量</th><th style="width:100px">缸号</th><th style="width:32px"></th></tr></thead>
      <tbody><tr v-for="(l, i) in f.lines" :key="i">
        <td><select class="sel" style="width:100%;height:28px" v-model="l.sku"><option value="">选物料</option><option v-for="k in skus" :key="k.code" :value="k.code">{{ k.t }}</option></select></td>
        <td v-if="t !== '客供入库'"><select class="sel" style="width:100%;height:28px" v-model="l.owner"><option v-for="o in owners" :key="o" :value="o">{{ ownerName(o) }}</option></select></td>
        <td v-if="f.from" class="num dim">{{ have(l) == null ? '—' : fq(have(l)) }}</td>
        <td><input class="inp cell num" type="number" v-model.number="l.qty"></td><td><input class="inp cell" v-model="l.lot"></td>
        <td><button class="btn ghost icon sm" @click="f.lines.splice(i, 1)"><Ico n="x" :s="12"/></button></td></tr></tbody></table>
    <button class="btn ghost" style="margin-top:8px" @click="f.lines.push({ sku: '', owner: '自有', qty: null, lot: '' })"><Ico n="plus" :s="14"/>加一行</button>
    <template #foot><button class="btn" @click="$emit('close')">取消</button><button class="btn pri" @click="ok">存草稿</button></template>
  </Modal>`,
})

route('/stock-docs/:no', {
  props: ['no'],
  setup(p) {
    const d = computed(() => stockDoc(p.no))
    const a = (x) => { if (run(() => doAction('stock', d.value, x))) toast(x === '审核' ? `${d.value.no} 已过账，库存已更新` : `${d.value.no} ${x}了`) }
    const more = computed(() => [can('stock', d.value, '反审核') && { t: '反审核（库存改回去）', fn: () => a('反审核') }, can('stock', d.value, '作废') && { t: '作废', danger: true, fn: () => a('作废') }].filter(Boolean))
    return { d, a, more, srcLink, partnerName }
  },
  template: `<div v-if="d">
    <Head :t="d.no" :back="['出入库', '/stock-docs']"><button v-if="can('stock', d, '审核')" class="btn pri" @click="a('审核')">审核过账</button><More :items="more"/></Head>
    <div class="detail">
      <div class="body">
        <div class="title">{{ d.type }}<St :s="d.status"/></div>
        <div class="sub"><span v-if="d.from || d.to">{{ d.from ? whName(d.from) : partnerName(d) }} → {{ d.to ? whName(d.to) : partnerName(d) }}</span><span>{{ fd(d.date) }}</span></div>
        <section data-c="出入库明细">
          <Tbl inset flat :rows="d.lines" :cols="[{ k: 'sku', t: '物料', f: l => skuName(l.sku), img: l => l.sku }, { k: 'code', t: 'SKU', c: 'code', f: l => l.sku }, { k: 'owner', t: '物权', f: l => ownerName(l.owner) },
            { k: 'qty', t: '数量', c: 'num', f: l => fq(l.qty) + ' ' + unitOf(l.sku) }, { k: 'pq', t: '采购单位', c: 'num', f: l => l.purQty != null && matOfSku(l.sku).factor !== 1 ? fq(l.purQty) + ' ' + matOfSku(l.sku).purUnit : '' },
            { k: 'lot', t: '缸号', f: l => l.lot || '—' }, { k: 'have', t: '出仓库存', c: 'num', f: l => d.from && d.status === '草稿' ? fq(stockQty(d.from, l.sku, l.owner)) : '' }]"/>
        </section>
      </div>
      <aside class="aside" data-c="单据属性">
        <dl class="props">
          <dt>类型</dt><dd>{{ d.type }}</dd>
          <dt v-if="d.from">出仓</dt><dd v-if="d.from">{{ whName(d.from) }}</dd>
          <dt v-if="d.to">入仓</dt><dd v-if="d.to">{{ whName(d.to) }}</dd>
          <dt v-if="d.partner">往来</dt><dd v-if="d.partner">{{ partnerName(d) }}</dd>
          <dt v-if="d.src">源单</dt><dd v-if="d.src"><a class="code" :href="'#' + srcLink(d)">{{ d.src }}</a></dd>
          <dt v-if="d.supNo">送货单号</dt><dd v-if="d.supNo" class="code">{{ d.supNo }}</dd>
          <dt v-if="d.reason">原因</dt><dd v-if="d.reason">{{ d.reason }}</dd>
          <dt>审核人</dt><dd>{{ d.auditor ? userName(d.auditor) : '—' }}</dd>
        </dl>
        <h4>操作记录</h4><Log :items="d.log"/>
      </aside>
    </div>
  </div><NotFound v-else/>`,
}, { mod: 'stockdocs', t: (p) => '出入库单 ' + p.no })

/* ---------- 库存与日志 ---------- */
route('/stock', {
  setup() {
    const s = reactive({ tab: nav.query.wh ? '全部' : '物料仓', wh: nav.query.wh || '', view: '明细', owner: '', q: '', log: null })
    const rows = computed(() => Object.entries(db.stock).filter(([, q]) => Math.abs(q) > 0.0005).map(([k, qty]) => { const [w, sku, owner] = k.split('|'); return { k, w, sku, owner, qty, last: db.stockLogs.find((x) => x.wh === w && x.sku === sku && x.owner === owner)?.at } })
      .filter((r) => (s.tab === '全部' || wh(r.w).type === s.tab) && (!s.wh || r.w === s.wh) && (!s.owner || r.owner === s.owner) && (!s.q || (r.sku + skuName(r.sku) + whName(r.w)).includes(s.q)))
      .sort((a, b) => a.sku.localeCompare(b.sku)))
    const summary = computed(() => {
      const m = {}
      rows.value.forEach((r) => { const x = (m[r.sku + '|' + r.owner] ||= { sku: r.sku, owner: r.owner, mat: 0, fac: 0 }); wh(r.w).type === '工厂仓' ? (x.fac += r.qty) : (x.mat += r.qty) })
      return Object.values(m)
    })
    const owners = computed(() => [...new Set(Object.keys(db.stock).map((k) => k.split('|')[2]))])
    const logs = computed(() => (s.log ? db.stockLogs.filter((x) => x.wh === s.log.w && x.sku === s.log.sku && x.owner === s.log.owner) : db.stockLogs).filter((x) => s.log || !s.q || (x.no + x.sku + skuName(x.sku)).includes(s.q)))
    const safety = (sku) => skuOf(sku)?.safety
    return { s, rows, summary, owners, logs, safety }
  },
  template: `<div>
    <Head t="库存"/>
    <div class="bar" data-c="筛选">
      <Seg v-model="s.tab" :items="['物料仓', '工厂仓', '全部']"/>
      <button v-if="s.wh" class="chip on" @click="s.wh = ''">{{ whName(s.wh) }}<Ico n="x" :s="12"/></button>
      <select class="sel" style="height:28px" v-model="s.owner"><option value="">全部物权</option><option v-for="o in owners" :key="o" :value="o">{{ ownerName(o) }}</option></select>
      <span class="sp"></span><Seg v-model="s.view" :items="['明细', '按物料', '日志']"/><Search v-model="s.q"/>
    </div>
    <div v-if="s.view === '明细'" data-c="库存明细">
      <Tbl :rows="rows" link @row="r => s.log = r" empty="没有库存" :cols="[
        { k: 'w', t: '仓库', f: r => whName(r.w) }, { k: 'sku', t: 'SKU', c: 'code' }, { k: 'name', t: '物料', f: r => skuName(r.sku), img: r => r.sku },
        { k: 'owner', t: '物权' }, { k: 'qty', t: '数量', c: 'num' }, { k: 'safety', t: '安全库存', c: 'num', f: r => safety(r.sku) ? fq(safety(r.sku)) : '—' }, { k: 'last', t: '最近变动', f: r => fd(r.last) }]">
        <template #owner="{ r }"><span :class="{ amber: r.owner !== '自有' }">{{ ownerName(r.owner) }}</span></template>
        <template #qty="{ r }"><span :class="{ red: safety(r.sku) && r.qty < safety(r.sku) }">{{ fq(r.qty) }}</span> <span class="dim">{{ unitOf(r.sku) }}</span></template>
      </Tbl>
    </div>
    <div v-if="s.view === '按物料'" data-c="库存汇总">
      <Tbl :rows="summary" empty="没有库存" :cols="[{ k: 'sku', t: 'SKU', c: 'code' }, { k: 'name', t: '物料', f: r => skuName(r.sku), img: r => r.sku }, { k: 'owner', t: '物权', f: r => ownerName(r.owner) },
        { k: 'mat', t: '物料仓', c: 'num', f: r => fq(r.mat) }, { k: 'fac', t: '工厂仓', c: 'num', f: r => fq(r.fac) }, { k: 'all', t: '合计', c: 'num', f: r => fq(r.mat + r.fac) + ' ' + unitOf(r.sku) }]"/>
    </div>
    <div v-if="s.view === '日志'" data-c="库存日志"><StockLogTable :rows="logs"/></div>
    <Modal v-if="s.log" :t="whName(s.log.w) + ' · ' + skuName(s.log.sku)" :w="820" @close="s.log = null"><StockLogTable :rows="logs" inset/></Modal>
  </div>`,
}, { mod: 'stock', t: '库存' })

comp('StockLogTable', {
  props: { rows: Array, inset: Boolean },
  template: `<Tbl :inset="inset" :flat="inset" :rows="rows" empty="没有变动" :cols="[{ k: 'at', t: '日期', f: x => fd(x.at) }, { k: 'type', t: '类型' }, { k: 'no', t: '单号', c: 'code' },
    { k: 'wh', t: '仓库', f: x => whName(x.wh) }, { k: 'sku', t: '物料', f: x => skuName(x.sku) }, { k: 'owner', t: '物权', f: x => ownerName(x.owner) },
    { k: 'delta', t: '变动', c: 'num' }, { k: 'bal', t: '结存', c: 'num', f: x => fq(x.bal) }, { k: 'lot', t: '缸号', f: x => x.lot || '—' }, { k: 'who', t: '操作人', f: x => userName(x.who) }]">
    <template #no="{ r }"><a :href="'#/stock-docs/' + r.no">{{ r.no }}</a></template>
    <template #delta="{ r }"><span :class="r.delta > 0 ? 'green' : 'red'">{{ r.delta > 0 ? '+' : '' }}{{ fq(r.delta) }}</span></template>
  </Tbl>`,
})

expose({ updateMrpRow, srcText, purUnit, partnerName })
</script>
<script>/* 5d-production.js */
/* ============================================================
 * 生产与外发（M08）：加工单（进度节点、领料、异常、回货）、生产看板、手机报工
 * ============================================================ */
SEARCH.push(() => db.productions.map((p) => ({ t: p.no + ' ' + p.style + ' ' + supName(p.factory), sub: '加工单', to: '/production/' + p.no, i: 'factory' })))
const RISK_F = { late: '已逾期', node: '节点延期', near: '7 天内交货', issue: '有异常', upstream: '上游已变更' }
const riskMatch = (p, f) => (f === 'upstream' ? p.upstream && !p.upstream.done : prodRisk(p)[f])
const byRisk = (a, b) => prodRisk(b).score - prodRisk(a).score || expectDue(a).localeCompare(expectDue(b))

route('/production', {
  setup() {
    const s = reactive({ tab: nav.query.s || '全部', f: nav.query.f || '', q: '' })
    const tabs = computed(() => ['全部', '草稿', '待审核', '已下单', '生产中', '部分回货', '已完成'].map((k) => [k, k, k === '全部' ? db.productions.length : db.productions.filter((p) => p.status === k).length]))
    const rows = computed(() => db.productions.filter((p) => (s.tab === '全部' || p.status === s.tab) && (!s.f || riskMatch(p, s.f)) && (!s.q || (p.no + p.style + supName(p.factory) + p.order).toLowerCase().includes(s.q.toLowerCase()))).slice().sort(byRisk))
    return { s, tabs, rows, RISK_F }
  },
  template: `<div>
    <Head t="加工单"/>
    <div class="bar" data-c="筛选"><Seg v-model="s.tab" :items="tabs"/>
      <select class="sel" style="height:28px" v-model="s.f"><option value="">全部风险</option><option v-for="(t, k) in RISK_F" :key="k" :value="k">{{ t }}</option></select>
      <span class="sp"></span><Search v-model="s.q"/></div>
    <div data-c="加工单列表"><ProdTable :rows="rows"/></div>
  </div>`,
}, { mod: 'production', t: '加工单' })

comp('ProdTable', {
  props: { rows: Array },
  template: `<Tbl :rows="rows" link @row="p => go('/production/' + p.no)" empty="没有符合条件的加工单。订单审核后在订单里「排单」生成" :cols="[
    { k: 'no', t: '加工单号', c: 'code' }, { k: 'style', t: '款式' }, { k: 'factory', t: '加工厂', f: p => supName(p.factory) }, { k: 'mode', t: '方式' },
    { k: 'qty', t: '数量', c: 'num', f: p => prodQty(p) }, { k: 'due', t: '交期' }, { k: 'left', t: '' }, { k: 'nodes', t: '节点' },
    { k: 'issue', t: '领料', f: p => prodLive(p) ? issueState(p) : '—' }, { k: 'ret', t: '回货' }, { k: 'status', t: '状态' }]">
    <template #style="{ r }"><span class="row"><Thumb :code="r.style" :s="24"/><span class="code">{{ r.style }}</span></span></template>
    <template #due="{ r }">{{ fd(expectDue(r)) }}<span v-if="r.expect" class="dim" style="text-decoration:line-through;margin-left:4px">{{ fd(r.due) }}</span></template>
    <template #left="{ r }"><Days :d="expectDue(r)" :warn="7" :done="!prodLive(r)"/></template>
    <template #nodes="{ r }"><Nodes :p="r"/></template>
    <template #ret="{ r }"><Prog v-if="prodLive(r) || r.status === '已完成'" :a="prodRet(r)" :b="prodQty(r)"/><span v-else class="dim">—</span></template>
    <template #status="{ r }"><span class="row"><St :s="r.status"/><Ico v-if="prodRisk(r).issue" n="alert" :s="14" class="amber"/><Ico v-if="r.upstream && !r.upstream.done" n="diff" :s="14" class="amber"/></span></template>
  </Tbl>`,
})

/* ---------- 加工单详情 ---------- */
route('/production/:no', {
  props: ['no'],
  setup(p) {
    const x = computed(() => production(p.no))
    const tab = ref('nodes'), dlg = ref(''), node = ref(null), closing = ref(null)
    const docs = computed(() => db.stockDocs.filter((d) => d.src === p.no))
    const rets = computed(() => db.returns.filter((r) => r.prod === p.no))
    const openIssues = computed(() => x.value.issues.filter((i) => i.status !== '已关闭'))
    const qtyMap = computed(() => Object.fromEntries(x.value.lines.map((l) => [l.color + '|' + l.size, l.qty])))
    const sub = (c, z) => { const l = x.value.lines.find((y) => y.color === c && y.size === z); return l && (l.ret || l.def) ? `回 ${l.ret}${l.def ? ' · 次 ' + l.def : ''}` : '' }
    const a = (n) => { if (run(() => doAction('production', x.value, n))) toast(n === '审核' ? `${x.value.no} 已下单，按交期倒排了 ${x.value.nodes.length} 个节点` : `${x.value.no} ${n}了`) }
    const report = (i) => { if (prodLive(x.value)) { node.value = i; dlg.value = 'report' } }
    const more = computed(() => [
      prodLive(x.value) && { t: '上报异常', fn: () => { dlg.value = 'issue' } },
      can('production', x.value, '撤回') && { t: '撤回', fn: () => a('撤回') },
      { t: '打印加工单和资料包', fn: () => toast('原型：这里会出加工单 + 资料包（按颜色展开的 BOM、工艺单），可存 PDF 发工厂') },
      can('production', x.value, '结案') && { t: '结案', fn: () => a('结案') },
      can('production', x.value, '作废') && { t: '作废', danger: true, fn: () => a('作废') },
    ].filter(Boolean))
    const nodeCls = (n) => nodeState(n)
    return { x, tab, dlg, node, closing, docs, rets, openIssues, qtyMap, sub, a, report, more, nodeCls }
  },
  template: `<div v-if="x">
    <Head :t="x.no" :back="['加工单', '/production']">
      <button v-if="can('production', x, '提交')" class="btn pri" @click="a('提交')">提交审核</button>
      <template v-if="can('production', x, '审核')"><button class="btn" @click="a('驳回')">驳回</button><button class="btn pri" @click="a('审核')">审核下单</button></template>
      <template v-if="prodLive(x)"><button class="btn" @click="dlg = 'issueMat'">领料</button><button class="btn" @click="dlg = 'return'">登记回货</button><button class="btn pri" @click="report(null)">报进度</button></template>
      <More :items="more"/>
    </Head>
    <div class="detail">
      <div class="body">
        <Upstream :d="x"/>

comp('ProdReport', {
  props: { p: Object, i: Number },
  emits: ['close'],
  setup(props, { emit }) {
    const cur = props.i ?? Math.max(0, props.p.nodes.findIndex((n) => !n.af))
    const f = reactive({ i: cur, as: '', af: '', qty: null, note: '' })
    watch(() => f.i, (i) => { const n = props.p.nodes[i]; Object.assign(f, { as: n.as || clock.today, af: n.af || clock.today, qty: n.qty, note: n.note }) }, { immediate: true })
    function ok() {
      const w = run(() => reportNode(props.p, f.i, { ...f }))
      if (w) { emit('close'); toast(typeof w === 'string' ? `已报，${w}` : `${props.p.nodes[f.i].name}已报`) }
    }
    return { f, ok }
  },
  template: `<Modal :t="'报进度 ' + p.no" :w="520" @close="$emit('close')">
    <div class="chips" style="margin-bottom:14px" data-c="选节点"><button v-for="(n, k) in p.nodes" :key="n.name" class="chip" :class="{ on: f.i === k }" @click="f.i = k"><Ico v-if="n.af" n="check" :s="12" class="green"/>{{ n.name }}</button></div>
    <div class="form">
      <label class="f">实际开始<input class="inp" type="date" v-model="f.as"></label>
      <label class="f">实际完成<input class="inp" type="date" v-model="f.af"></label>

  </Modal>`,
})

comp('ProdIssueMat', {
  props: { p: Object },
  emits: ['close', 'done'],
  setup(props, { emit }) {
    const rows = reactive(issuePlan(props.p).map((r) => ({ ...r, qty: Math.min(r.suggest, Math.max(0, r.avail)) }))) // 默认有多少领多少
    const reason = ref('')
    const over = computed(() => rows.some((r) => r.qty > r.suggest + 0.0005))
    function ok() {
      if (over.value && !reason.value) return toast('超领要写原因', null, true)
      const d = run(() => issueMaterials(props.p, rows.map((r) => ({ sku: r.sku, owner: r.owner, qty: +r.qty || 0, reason: reason.value }))))
      if (d?.no) { emit('close'); emit('done'); toast(`${d.no} 已过账：主料仓 → ${whName(d.to)}`, ['打开', '/stock-docs/' + d.no]) }
    }
    return { rows, reason, over, ok }
  },
  template: `<Modal :t="'领料 ' + p.no" :w="720" @close="$emit('close')">
    <p class="mut" style="margin-bottom:10px">主料仓 → {{ whName(factoryWh(p.factory)?.code) }}</p>
    <table class="tbl inset flat" data-c="领料明细"><thead><tr><th>物料</th><th>物权</th><th class="num">还差</th><th class="num">主料仓库存</th><th class="num" style="width:120px">本次领</th></tr></thead>
      <tbody><tr v-for="r in rows" :key="r.sku + r.owner"><td><span class="row"><Thumb :code="r.sku" :s="30"/>{{ skuName(r.sku) }}</span></td><td :class="{ amber: r.owner !== '自有' }">{{ ownerName(r.owner) }}</td><td class="num">{{ fq(r.suggest) }} <span class="dim">{{ unitOf(r.sku) }}</span></td>
        <td class="num" :class="{ red: r.avail < r.qty }">{{ fq(r.avail) }}</td><td><input class="inp cell num" type="number" v-model.number="r.qty"></td></tr>
        <tr v-if="!rows.length"><td colspan="5" class="empty">资料包里没有要发给工厂的料</td></tr></tbody></table>
    <label v-if="over" class="f" style="margin-top:12px">超领原因<input class="inp" v-model="reason"></label>
    <template #foot><button class="btn" @click="$emit('close')">取消</button><button class="btn pri" @click="ok">领料并过账</button></template>
  </Modal>`,
})

comp('ProdException', {

comp('ProdReturn', {
  props: { p: Object },
  emits: ['close', 'done'],
  setup(props, { emit }) {
    const qty = ref(Object.fromEntries(props.p.lines.map((l) => [l.color + '|' + l.size, Math.max(0, l.qty - l.ret)])))
    const def = ref({})
    const f = reactive({ date: clock.today, logistics: '' })
    const colors = [...new Set(props.p.lines.map((l) => l.color))]
    const sub = (c, z) => { const l = props.p.lines.find((y) => y.color === c && y.size === z); return l ? `加工 ${l.qty} · 已回 ${l.ret}` : '' }
    function ok() {
      const lines = Object.fromEntries(Object.keys({ ...qty.value, ...def.value }).map((k) => [k, { qty: qty.value[k] || 0, def: def.value[k] || 0 }]))
      const r = run(() => registerReturn(props.p, { ...f, lines }))
      if (r?.no) { emit('close'); emit('done'); toast(`${r.no} 已登记：${sum(r.lines, (l) => l.qty)} 件${props.p.status === '已完成' ? '，加工单完成' : ''}`) }
    }
    return { qty, def, f, colors, sub, ok }
  },
  template: `<Modal :t="'登记回货 ' + p.no" :w="760" @close="$emit('close')">
    <div class="form" style="margin-bottom:14px"><label class="f">回货日期<input class="inp" type="date" v-model="f.date"></label><label class="f">物流单号<input class="inp" v-model="f.logistics"></label></div>
    <div class="sec" style="margin-top:0" data-c="回货数"><h3>回货数（含次品）</h3><Matrix :st="p.style" v-model="qty" :colors="colors" :sub="sub"/></div>
    <div class="sec" data-c="次品数"><h3>其中次品</h3><Matrix :st="p.style" v-model="def" :colors="colors"/></div>
    <template #foot><button class="btn" @click="$emit('close')">取消</button><button class="btn pri" @click="ok">登记</button></template>
  </Modal>`,
})

route('/board', {
  setup() {
    const s = reactive({ card: '', view: '按单', factory: '' })
    const live = computed(() => db.productions.filter(prodLive).filter((p) => !s.factory || p.factory === s.factory))
    const month = clock.today.slice(0, 7)
    const cards = computed(() => {
      const L = live.value
      const run = L.filter((p) => ['生产中', '部分回货'].includes(p.status))
      return [
        { k: 'run', t: '在制', n: run.length, m: sum(run, (p) => prodQty(p) - prodRet(p)) + ' 件', f: (p) => ['生产中', '部分回货'].includes(p.status) },
        { k: 'wait', t: '待开工', n: L.filter((p) => p.status === '已下单').length, f: (p) => p.status === '已下单' },
        { k: 'near', t: '7 天内交货', n: L.filter((p) => prodRisk(p).near).length, f: (p) => prodRisk(p).near },
        { k: 'late', t: '已逾期', n: L.filter((p) => prodRisk(p).late).length, f: (p) => prodRisk(p).late },
        { k: 'node', t: '节点延期', n: L.filter((p) => prodRisk(p).node).length, f: (p) => prodRisk(p).node },
        { k: 'done', t: '本月回货', n: sum(db.returns.filter((r) => r.date.startsWith(month)), (r) => sum(r.lines, (l) => l.qty)), m: '件', f: null },
      ]
    })
    const rows = computed(() => { const c = cards.value.find((x) => x.k === s.card); return live.value.filter((p) => !c?.f || c.f(p)).slice().sort(byRisk) })
    const factories = computed(() => db.suppliers.filter(isFactory).map((f) => { const ps = db.productions.filter((p) => p.factory === f.code && prodLive(p)); return { f, n: ps.length, qty: sum(ps, (p) => prodQty(p) - prodRet(p)), late: ps.filter((p) => prodRisk(p).late).length } }).filter((x) => x.n || x.f.status === '合作中'))
    const maxQty = computed(() => Math.max(1, ...factories.value.map((x) => x.qty)))
    return { s, cards, rows, factories, maxQty }
  },
  template: `<div>
    <Head t="看板"><select class="sel" style="height:28px" v-model="s.factory"><option value="">全部工厂</option><option v-for="f in db.suppliers.filter(isFactory)" :key="f.code" :value="f.code">{{ f.short }}</option></select></Head>
    <div class="stats" data-c="数字卡">
      <div v-for="c in cards" :key="c.k" class="stat" :class="{ on: s.card === c.k }" @click="c.f && (s.card = s.card === c.k ? '' : c.k)"><span>{{ c.t }}</span><b :class="{ red: c.k === 'late' && c.n, amber: (c.k === 'near' || c.k === 'node') && c.n }">{{ c.n.toLocaleString() }}<small v-if="c.m">{{ c.m }}</small></b></div>
    </div>
    <div class="bar"><Seg v-model="s.view" :items="['按单', '按工厂']"/></div>
    <div v-if="s.view === '按单'" data-c="看板列表"><ProdTable :rows="rows"/></div>
    <div v-else data-c="按工厂">
      <Tbl :rows="factories" link @row="x => { s.factory = x.f.code; s.view = '按单' }" :cols="[{ k: 'f', t: '加工厂', f: x => x.f.short }, { k: 'cat', t: '类型', f: x => x.f.cats.join(' ') }, { k: 'n', t: '在制单数', c: 'num' }, { k: 'qty', t: '在制件数', c: 'num' }, { k: 'bar', t: '', w: '30%' }, { k: 'late', t: '逾期单', c: 'num' }]">
        <template #bar="{ r }"><span class="hbar"><b :style="{ width: (r.qty / maxQty * 100) + '%' }"></b></span></template>
        <template #late="{ r }"><span :class="{ red: r.late }">{{ r.late }}</span></template>
      </Tbl>
    </div>
  </div>`,
}, { mod: 'board', t: '看板' })

function smpPlan(need) {

  return SMP_NODES.slice().reverse().map(([name, days]) => { const plan = end; end = addDays(plan, -days); return { name, plan, done: null } }).reverse()

function smpNodeState(n) {

  if (clock.today > n.plan) return 'late'

function smpDispatch(s, f) {
  const v = smpCur(s)
  if (v.status !== '待派单') fail('这一版已经派过了')

// 每款的费率和报价：包装运杂（元/件）、管理费率（% × 料工）、税率（报价含税）、对客报价
db.costCfg = {}

  { id: 'BJ01', mat: 'ML0012', sup: 'GYS0001', price: 18.5, lead: 20, moq: 100, at: '2026-08-12', chosen: true },

db.priceLog = [
  { mat: 'ML0012', from: 19.2, to: 18.5, fromSup: 'GYS0001', sup: 'GYS0001', at: '2026-08-12', by: 'u2' },
  { mat: 'FK0021', from: 0.38, to: 0.35, fromSup: 'GYS0002', sup: 'GYS0002', at: '2026-07-30', by: 'u2' },
]
const costTp = (code) => activeTp(code) || tpsOf(code)[0]
function costDefaults(code) {
  const s = style(code)
  const prices = db.orders.filter((o) => o.status !== '已取消').flatMap((o) => o.lines).filter((l) => l.style === code && l.price).map((l) => l.price)
  return { pack: 3, mgmt: 8, tax: 13, quote: prices.length ? prices[prices.length - 1] : Math.round((s?.tagPrice || 0) * 0.45) }
}
const costCfgOf = (code) => db.costCfg[code] || costDefaults(code)
function costEnsure(code) { if (!db.costCfg[code]) db.costCfg[code] = costDefaults(code); return db.costCfg[code] }
// 总成本 = 物料 + 加工 + 包装运杂 + 管理费；毛利 = 不含税报价 − 总成本
function costOf(code) {
  const tp = costTp(code)
  if (!tp) return null
  const c = costCfgOf(code)
  const matC = tpMaterialCost(tp), labor = tpLabor(tp)
  const mgmt = rnd((matC + labor) * (c.mgmt || 0) / 100, 2)
  const total = rnd(matC + labor + (+c.pack || 0) + mgmt, 2)
  const net = rnd((+c.quote || 0) / (1 + (c.tax || 0) / 100), 2)
  const margin = rnd(net - total, 2)
  return { tp, mat: matC, labor, pack: +c.pack || 0, mgmt, other: rnd((+c.pack || 0) + mgmt, 2), total, quote: +c.quote || 0, net, margin, rate: net ? margin / net : 0 }
}
const costRate = (x) => (x == null ? '—' : Math.round(x * 1000) / 10 + '%')
function quoteChoose(q) {
  if (!canUseSupplier(q.sup, '采购')) fail(`${supName(q.sup)} 现在是「${sup(q.sup).status}」，不能选`)
  db.quotes.filter((x) => x.mat === q.mat).forEach((x) => { x.chosen = false })
  q.chosen = true
  const m = mat(q.mat)
  if (m.price !== q.price || m.supplier !== q.sup) {
    db.priceLog.unshift({ mat: q.mat, from: m.price, to: q.price, fromSup: m.supplier, sup: q.sup, at: clock.today, by: db.me })
    m.price = q.price
    m.supplier = q.sup
  }
}
function quoteAdd(f) {
  if (!f.mat || !f.sup) fail('物料、供应商都要选')
  if (!(f.price > 0)) fail('报价要填')
  return add(db.quotes, { id: 'BJ' + String(db.quotes.length + 1).padStart(2, '0'), lead: null, moq: null, at: clock.today, chosen: false, ...f })
}

/* ============================== 质检 ============================== */
// AQL 2.5，一般检验水平 II：批量上限 → [抽检数, 允收数]
const QC_AQL = [[8, 2, 0], [15, 3, 0], [25, 5, 0], [50, 8, 0], [90, 13, 1], [150, 20, 1], [280, 32, 2], [500, 50, 3], [1200, 80, 5], [3200, 125, 7], [10000, 200, 10], [Infinity, 315, 14]]
const qcAql = (lot) => { const [, n, ac] = QC_AQL.find(([max]) => lot <= max); return { n: Math.min(n, Math.max(1, Math.round(lot))), ac } }
db.qcs = []
function qcPending() {
  const done = new Set(db.qcs.map((q) => q.src))
  return [
    ...db.returns.filter((r) => !done.has(r.no)).map((r) => ({ kind: '尾期验货', src: r.no, date: r.date, party: r.factory, what: `${r.style} ${styleName(r.style)}`, lot: sum(r.lines, (l) => l.qty), unit: '件', to: '/production/' + r.prod })),
    ...db.stockDocs.filter((d) => d.type === '采购入库' && d.status === '已审核' && !done.has(d.no)).map((d) => ({ kind: '来料检验', src: d.no, date: d.date, party: d.partner, what: d.lines.map((l) => skuName(l.sku)).join('、'), lot: rnd(sum(d.lines, (l) => l.purQty ?? l.qty), 3), unit: matOfSku(d.lines[0].sku)?.purUnit || '', to: '/stock-docs/' + d.no })),
  ].sort((a, b) => b.date.localeCompare(a.date))
}
function qcInspect(item, f) {
  if (!(f.sample > 0)) fail('抽检数要填')
  if (f.bad > f.sample) fail('不合格数不能大于抽检数')
  if (!f.result) fail('选一个结论')
  if (f.result !== '合格' && !f.note) fail('不合格、让步接收要写问题')
  return add(db.qcs, { no: nextNo('QC'), kind: item.kind, src: item.src, party: item.party, what: item.what, lot: item.lot, unit: item.unit, to: item.to, date: clock.today, sample: f.sample, bad: f.bad || 0, ac: qcAql(item.lot).ac, result: f.result, note: f.note || '', by: db.me })
}
const qcOf = (src) => db.qcs.find((q) => q.src === src)
function qcSupplierStats() {
  const codes = [...new Set([...db.productions.map((p) => p.factory), ...db.qcs.map((q) => q.party)])]
  return codes.map((c) => {
    const ps = db.productions.filter((p) => p.factory === c)
    const ret = sum(ps, prodRet), def = sum(ps, prodDef), qs = db.qcs.filter((q) => q.party === c)
    return { c, ret, def, rate: ret ? def / ret : null, n: qs.length, bad: qs.filter((q) => q.result === '不合格').length, soft: qs.filter((q) => q.result === '让步接收').length }
  }).filter((x) => x.ret || x.n)
}
// 种子：第一批回货验过（合格），两张面料入库验过（一张合格、一张让步接收）
as('u1', '2026-11-02', () => { const r = db.returns[0]; if (r) qcInspect(qcPending().find((x) => x.src === r.no), { sample: 50, bad: 2, result: '合格' }) })
as('u5', '2026-10-08', () => { const d = db.stockDocs.find((x) => x.type === '采购入库' && x.partner === 'GYS0009'); if (d) qcInspect(qcPending().find((x) => x.src === d.no), { sample: 20, bad: 0, result: '合格' }) })

comp('QcInspect', {

/* ============================== 成品仓 ============================== */
// 回货 → 良品入成品仓（库存按款 × 色 × 码）→ 按订单发货；入库、发货都推聚水潭（这里只模拟状态）
db.fgIn = []
db.fgStock = {}
db.shipments = []
const fgKey = (st, c, z) => `${st}|${c}|${z}`
const fgQty = (st, c, z) => db.fgStock[fgKey(st, c, z)] || 0
const fgPending = () => { const done = new Set(db.fgIn.map((x) => x.ret)); return db.returns.filter((r) => !done.has(r.no)).map((r) => ({ r, qc: qcOf(r.no) })) }
function fgReceive(r) {
  const qc = qcOf(r.no)
  if (qc?.result === '不合格') fail('验货不合格，不能入成品仓', ['先返修，或者改成让步接收'])
  if (db.fgIn.some((x) => x.ret === r.no)) fail('这批回货已经入过库')
  const lines = r.lines.map((l) => ({ color: l.color, size: l.size, qty: l.qty - l.def })).filter((l) => l.qty > 0)
  lines.forEach((l) => { const k = fgKey(r.style, l.color, l.size); db.fgStock[k] = (db.fgStock[k] || 0) + l.qty })
  const d = add(db.fgIn, { no: nextNo('CR'), ret: r.no, prod: r.prod, style: r.style, order: r.order, factory: r.factory, date: clock.today, wh: r.wh || 'CP01', lines, jst: '待推送', log: [] })
  act(d, `良品入库 ${sum(lines, (l) => l.qty)} 件`)
  return d
}
const fgShipped = (o, l) => sum(db.shipments.filter((s) => s.order === o.no).flatMap((s) => s.lines).filter((x) => x.style === l.style && x.color === l.color && x.size === l.size), (x) => x.qty)
// qty = { '27CF001|KQ|M': 100 }
function fgShip(o, f) {
  const errs = [], lines = []
  Object.entries(f.qty).forEach(([k, n]) => {
    if (!(n > 0)) return
    const [st, c, z] = k.split('|')
    const l = o.lines.find((x) => x.style === st && x.color === c && x.size === z)
    if (!l) return
    if (n > fgQty(st, c, z)) errs.push(`${st}-${c}-${z}：成品库存 ${fgQty(st, c, z)}，不够 ${n}`)
    const cap = Math.floor(l.qty * (1 + OVER)) - fgShipped(o, l)
    if (n > cap) errs.push(`${st}-${c}-${z}：订单 ${l.qty} 件，最多还能发 ${Math.max(0, cap)} 件`)
    lines.push({ style: st, color: c, size: z, qty: n, price: l.price })
  })
  if (!lines.length) errs.push('至少发一件')
  if (errs.length) fail('发货没成', errs)
  lines.forEach((l) => { db.fgStock[fgKey(l.style, l.color, l.size)] -= l.qty })
  const s = add(db.shipments, { no: nextNo('FH'), order: o.no, customer: o.customer, date: clock.today, logistics: f.logistics || '', lines, jst: '待推送', log: [] })
  act(s, `发货 ${sum(lines, (l) => l.qty)} 件`)
  act(o, `发货 ${s.no}：${sum(lines, (l) => l.qty)} 件`)
  return s
}
function fgPush(d) { if (d.jst === '已推送') return; d.jst = '已推送'; d.pushedAt = clock.today; act(d, '推送聚水潭') }

/* ============================== 对账 ============================== */
// 供应商对账单：已审核的采购入库（采购单位数量 × 单价）+ 回货（件数 × 加工单价，次品按加工单价扣）
db.statements = []
db.receipts = []
db.invoices = []
Object.assign(FLOWS, { statement: { 发送: ['草稿', '已发送'], 确认: ['已发送', '已确认'], 付款: ['已确认', '已付款'], 作废: ['草稿', '已作废'] } })
const finMonth = (d) => d.slice(0, 7)
function finPayables() {
  const billed = new Set(db.statements.filter((s) => s.status !== '已作废').flatMap((s) => s.items.map((i) => i.no)))
  const rk = db.stockDocs.filter((d) => d.type === '采购入库' && d.status === '已审核' && !billed.has(d.no)).map((d) => ({
    type: '采购入库', no: d.no, sup: d.partner, date: d.date, desc: d.lines.map((l) => skuName(l.sku)).join('、'),
    qty: rnd(sum(d.lines, (l) => l.purQty ?? l.qty), 3), amt: rnd(sum(d.lines, (l) => (l.purQty ?? l.qty) * (l.price || 0)), 2), deduct: 0,
  }))
  const hh = db.returns.filter((r) => !billed.has(r.no)).map((r) => {
    const p = production(r.prod), q = sum(r.lines, (l) => l.qty), d = sum(r.lines, (l) => l.def)
    return { type: '回货', no: r.no, prod: r.prod, sup: r.factory, date: r.date, desc: `${r.style} ${styleName(r.style)}，次品 ${d}`, qty: q, amt: rnd(q * p.price, 2), deduct: rnd(d * p.price, 2) }
  })
  return [...rk, ...hh]
}
function finGroups() {
  const g = {}
  finPayables().forEach((x) => { const k = x.sup + '|' + finMonth(x.date); (g[k] ||= { sup: x.sup, month: finMonth(x.date), items: [] }).items.push(x) })
  return Object.values(g).map((x) => ({ ...x, amt: rnd(sum(x.items, (i) => i.amt - i.deduct), 2) })).sort((a, b) => a.month.localeCompare(b.month))
}
function finCreate(supCode, month) {
  const items = finPayables().filter((x) => x.sup === supCode && finMonth(x.date) === month)
  if (!items.length) fail('这个月没有要对的单据')
  const s = add(db.statements, { no: nextNo('DZ'), sup: supCode, month, items, date: clock.today, status: '草稿', paidAt: null, log: [] })
  act(s, `生成，${items.length} 张单据`)
  return s
}
const finAmt = (s) => rnd(sum(s.items, (i) => i.amt) - sum(s.items, (i) => i.deduct), 2)
const finDue = (s) => addDays(finMonthEnd(s.month), sup(s.sup)?.term || 0)
function finStmtAction(s, a) {
  doAction('statement', s, a)
  if (a === '付款') s.paidAt = clock.today
}
function finInvoice(f) {
  if (!(f.amt > 0)) fail('发票金额要填')
  const inv = add(db.invoices, { no: f.no || 'FP' + String(db.invoices.length + 1).padStart(8, '0'), dir: f.dir, party: f.party, ref: f.ref, amt: f.amt, rate: f.rate || '13%', date: clock.today, status: '未核销' })
  return inv
}
function finVerify(inv) {
  const ref = inv.dir === '收票' ? db.statements.find((s) => s.no === inv.ref) : db.shipments.find((s) => s.no === inv.ref)
  const due = ref ? (inv.dir === '收票' ? finAmt(ref) : finShipAmt(ref)) : null
  if (due != null && Math.abs(due - inv.amt) > 0.01) fail(`发票金额 ${fm(inv.amt)} 和单据金额 ${fm(due)} 对不上`)
  inv.status = '已核销'
}
// 客户应收：按发货 × 订单单价，到期日 = 发货日 + 客户账期
const finShipAmt = (sh) => rnd(sum(sh.lines, (l) => l.qty * (l.price || 0)), 2)
function finReceivables() {
  return db.shipments.map((sh) => {
    const amt = finShipAmt(sh), got = rnd(sum(db.receipts.filter((r) => r.ship === sh.no), (r) => r.amt), 2)
    return { sh, amt, got, due: addDays(sh.date, cust(sh.customer)?.term || 0), status: got >= amt - 0.005 ? '已收款' : got > 0 ? '部分收款' : '待收款', inv: db.invoices.find((i) => i.ref === sh.no) }
  })
}
function finReceive(sh, amt) {
  if (!(amt > 0)) fail('收款金额要填')
  add(db.receipts, { ship: sh.no, amt, at: clock.today, by: db.me })
  act(sh, `收款 ${fm(amt)}`)
}

/* ============================== 报表 ============================== */
// 单系列横条：一个颜色（主色），数值写在条旁边，鼠标悬停看原值
function rptOrders() {
  return db.orders.filter((o) => !['草稿', '待审核', '已取消'].includes(o.status)).map((o) => {
    const due = o.commit || o.due
    const lastRet = db.returns.filter((r) => r.order === o.no).map((r) => r.date).sort().pop()
    const res = o.status === '已完成' ? (lastRet && lastRet > due ? '延期完成' : '准时完成') : clock.today > due ? '已延期' : '进行中'
    return { o, due, res, qty: orderQty(o), ret: orderRet(o) }
  })
}
function rptSuppliers() {
  const by = {}
  db.stockDocs.filter((d) => d.type === '采购入库' && d.status === '已审核' && d.src).forEach((d) => {
    const p = purchase(d.src)
    const x = (by[d.partner] ||= { c: d.partner, n: 0, ok: 0, late: 0 })
    d.lines.forEach((l) => { const due = p.lines[l.poLine].due || p.due; x.n++; if (d.date <= due) x.ok++ })
  })
  arrivals().filter((a) => a.risk === 'late').forEach((a) => { (by[a.p.supplier] ||= { c: a.p.supplier, n: 0, ok: 0, late: 0 }).late++ })
  return Object.values(by).map((x) => ({ ...x, rate: x.n ? x.ok / x.n : null }))
}
function rptFactories() {
  const codes = [...new Set(db.productions.filter((p) => p.status !== '已作废').map((p) => p.factory))]
  return codes.map((c) => {
    const live = db.productions.filter((p) => p.factory === c && prodLive(p))
    const all = db.productions.filter((p) => p.factory === c)
    return { c, n: live.length, wip: sum(live, (p) => prodQty(p) - prodRet(p)), late: live.filter((p) => prodRisk(p).late).length, rate: sum(all, prodRet) ? sum(all, prodDef) / sum(all, prodRet) : null }
  })
}
route('/reports', {

          { k: 'qty', t: '数量', c: 'num' }, { k: 'ret', t: '回货' }, { k: 'due', t: '承诺交期', f: x => fd(x.due) }, { k: 'res', t: '交付' }]">
          <template #ret="{ r }"><Prog :a="r.ret" :b="r.qty"/></template>
          <template #res="{ r }"><span :class="{ red: r.res === '已延期' || r.res === '延期完成', green: r.res === '准时完成' }">{{ r.res }}</span></template>
