<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCM 原型</title>
<style>
/* 颜色和真页面 web/src/styles/tokens.css 同一套（植物染）：靛蓝主色、茜红危险、栀黄待处理、苔绿完成、坯布灰底。
   页面里只用变量，不写死颜色。 */
:root {
  --bg: #ffffff;
  --bg-page: #eef0eb;      /* 坯布灰：页面底 */
  --bg-sunken: #f6f7f3;    /* 表头、侧栏卡片 */
  --bg-hover: #f1f4f9;     /* 靛蓝 50：行悬停 */
  --bg-active: #e4e9f2;
  --line: #e3e5de;
  --line-strong: #cfd3ca;
  --fg: #1c2230;
  --fg-2: #5b6475;
  --fg-3: #8a909c;
  --accent: #2d4e8c;
  --accent-2: #243e70;
  --accent-fg: #ffffff;
  --accent-bg: #eaedf4;
  --red: #b4392b;
  --red-bg: #f8ebea;
  --red-line: #e3b9b3;
  --amber: #94660c;
  --amber-bg: #fbf1da;
  --amber-line: #d9a23a;
  --green: #2e7350;
  --green-bg: #e6f1ea;
  --green-line: #b9d6c5;
  --side: #1b2a4a;
  --side-2: #142038;
  --side-fg: #c3cde0;
  --side-dim: #8c9ab6;
  --stitch: #d9a23a;
  --twill: repeating-linear-gradient(135deg, rgb(255 255 255 / 3.5%) 0 1px, transparent 1px 5px);
  --shadow: 0 1px 2px rgba(28, 34, 48, 0.06), 0 10px 32px rgba(28, 34, 48, 0.16);
  --shadow-sm: 0 1px 2px rgba(28, 34, 48, 0.05), 0 2px 8px rgba(28, 34, 48, 0.05);
  --r: 4px;
  --mono: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg-page);
  color: var(--fg);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
svg { flex: none; }
::selection { background: var(--accent-bg); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #c9cdc3; border-radius: 5px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 外框：靛蓝斜纹侧栏 + 顶部页签 + 灰底上的白纸 ---------- */
.app { display: flex; height: 100vh; overflow: hidden; }
.side {
  width: 216px; flex: none; display: flex; flex-direction: column;
  background: var(--twill), var(--side); color: var(--side-fg);
}
.ws { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px; flex: none; }
.ws b { font: 700 18px/1 'Avenir Next', 'Helvetica Neue', sans-serif; letter-spacing: 0.06em; color: var(--stitch); }
.ws span { color: #fff; font-size: 13px; letter-spacing: 0.04em; }
.side .find {
  display: flex; align-items: center; gap: 8px; height: 30px; margin: 0 12px 6px; padding: 0 10px; flex: none;
  border: 1px solid rgb(255 255 255 / 8%); border-radius: var(--r); background: rgb(255 255 255 / 6%); color: var(--side-dim); cursor: pointer; text-align: left;
}
.side .find:hover { background: rgb(255 255 255 / 10%); }
.side .find span { flex: 1; }
kbd { font: 11px var(--mono); color: inherit; opacity: 0.8; }
.side nav { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 10px 10px; }
.side nav::-webkit-scrollbar { display: none; }
.grp { margin-top: 6px; }
.grp > b { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; font-size: 12px; font-weight: 500; color: var(--side-dim); cursor: pointer; user-select: none; }
.grp > b svg { margin-left: auto; transition: transform 0.15s; }
.grp > b.shut svg { transform: rotate(-90deg); }
.nav-i {
  display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--r);
  color: var(--side-fg); cursor: pointer; white-space: nowrap; border: 1px dashed transparent;
}
.nav-i svg { color: var(--side-dim); }
.nav-i:hover { background: rgb(255 255 255 / 6%); color: #fff; }
.nav-i.on { background: rgb(255 255 255 / 9%); color: #fff; font-weight: 600; border-color: var(--stitch); }
.nav-i.on svg { color: var(--stitch); }
.nav-i .n { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--stitch); color: var(--side-2); font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.nav-i .n:empty { display: none; }
.side-foot { padding: 8px 10px 12px; border-top: 1px solid rgb(255 255 255 / 8%); display: flex; flex-direction: column; gap: 2px; flex: none; }

.work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 44px; flex: none; display: flex; align-items: stretch; background: var(--bg); border-bottom: 1px solid var(--line); }
.ptabs { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab {
  position: relative; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 16px; border-right: 1px solid var(--line);
  color: var(--fg-2); white-space: nowrap; cursor: pointer; font-size: 13px;
}
.ptab:hover { color: var(--fg); background: var(--bg-sunken); }
.ptab.on { color: var(--fg); font-weight: 600; background: var(--bg); }
.ptab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.ptab .x { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 3px; color: var(--fg-3); visibility: hidden; }
.ptab:hover .x, .ptab.on .x { visibility: visible; }
.ptab .x:hover { background: var(--bg-active); color: var(--fg); }
.tb-right { display: flex; align-items: center; gap: 4px; padding: 0 14px; }
.tb-right .btn.ghost { position: relative; }
.tb-right .dot { position: absolute; top: 3px; right: 2px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--red); color: #fff; font-size: 10px; font-weight: 600; display: grid; place-items: center; }
.me { display: flex; align-items: center; gap: 8px; padding-left: 10px; margin-left: 6px; border-left: 1px solid var(--line); height: 24px; }
.me i { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 600; }
.me span { font-size: 12.5px; }
.me small { color: var(--fg-3); font-size: 12px; }

.main { flex: 1; min-height: 0; overflow-y: auto; position: relative; padding: 12px 14px 20px; }
.sheet { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; min-height: 100%; box-shadow: var(--shadow-sm); }
.sheet.dash { background: none; border: none; box-shadow: none; }

/* ---------- 页头 / 工具条 ---------- */
.head {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
  height: 52px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--line); background: var(--bg); border-radius: 6px 6px 0 0;
}
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 15px; }
.crumb a { color: var(--fg-3); font-size: 13px; }
.crumb a:hover { color: var(--accent); }
.crumb b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb svg { color: var(--fg-3); }
.head .acts { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.bar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar .sp { flex: 1; }
.page { padding: 20px; }
.narrow { max-width: 920px; margin: 0 auto; }

/* ---------- 按钮 / 输入 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); color: var(--fg);
  cursor: pointer; white-space: nowrap; transition: border-color 0.12s, color 0.12s, background 0.12s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.pri:hover { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--bg-sunken); color: var(--fg); }
.btn.danger { color: var(--red); }
.btn.danger:hover { border-color: var(--red); }
.btn.icon { width: 30px; padding: 0; }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn.sm.icon { width: 24px; }
.btn:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
.inp, .sel, textarea.inp {
  height: 30px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: var(--r);
  background: var(--bg); outline: none; min-width: 0;
}
textarea.inp { height: auto; min-height: 72px; padding: 8px 9px; resize: vertical; line-height: 1.5; }
.inp:hover, .sel:hover { border-color: #b9beb3; }
.inp:focus, .sel:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
.inp:disabled { background: var(--bg-sunken); color: var(--fg-2); }
.inp.num { text-align: right; font-variant-numeric: tabular-nums; }
.inp.cell { height: 26px; width: 100%; padding: 0 6px; }
.inp.ghost { border-color: transparent; background: transparent; }
.inp.ghost:hover { border-color: var(--line-strong); }
.inp.ghost:focus { border-color: var(--accent); background: var(--bg); }
.sel { padding-right: 26px; appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
  background-position: calc(100% - 14px) 13px, calc(100% - 10px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }
.search { position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 9px; color: var(--fg-3); pointer-events: none; }
.search .inp { padding-left: 30px; width: 240px; }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }

/* 分段：状态筛选、视图切换 */
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; background: var(--bg); }
.seg button {
  height: 28px; padding: 0 12px; border: none; border-left: 1px solid var(--line-strong); background: none;
  color: var(--fg-2); cursor: pointer; white-space: nowrap;
}
.seg button:first-child { border-left: none; }
.seg button:hover { color: var(--accent); }
.seg button.on { color: #fff; background: var(--accent); }
.seg button i { font-style: normal; opacity: 0.7; margin-left: 5px; font-variant-numeric: tabular-nums; }

/* 页签 */
.tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { height: 40px; padding: 0; border: none; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--fg-2); cursor: pointer; font-size: 13.5px; }
.tabs button:hover { color: var(--accent); }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button i { font-style: normal; color: var(--fg-3); margin-left: 4px; font-weight: 400; }

/* ---------- 表格 ---------- */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  height: 38px; padding: 0 10px; text-align: left; font-weight: 500; font-size: 12.5px; color: var(--fg-2);
  background: var(--bg-sunken); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 52px; z-index: 1;
}
.tbl.flat th { position: static; }
.tbl td { height: 46px; padding: 0 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { padding-left: 20px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 20px; }
.tbl.inset th:first-child, .tbl.inset td:first-child { padding-left: 10px; }
.tbl.inset th:last-child, .tbl.inset td:last-child { padding-right: 10px; }
.tbl.inset { border: 1px solid var(--line); border-bottom: none; }
.tbl tbody tr.link { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--bg-hover); }
.tbl tr.link td:first-child .code, .tbl tr.link td.code:first-child { color: var(--accent); }
.tbl tr.sel td { background: var(--accent-bg); }
.tbl tfoot td { font-weight: 600; background: var(--bg-sunken); }
.tbl caption { caption-side: bottom; text-align: right; padding: 12px 20px; color: var(--fg-3); font-size: 12.5px; }
.tbl caption b { color: var(--fg-2); font-weight: 500; margin: 0 2px; }
.num { text-align: right !important; font-variant-numeric: tabular-nums; }
.code { font-family: var(--mono); font-size: 12px; letter-spacing: -0.01em; }
.mut { color: var(--fg-2); }
.dim { color: var(--fg-3); }
.red { color: var(--red); }
.amber { color: var(--amber); }
.green { color: var(--green); }
.wrap { white-space: normal; }
.empty { padding: 56px 24px; text-align: center; color: var(--fg-3); }
.row { display: flex; align-items: center; gap: 8px; }
.row.g4 { gap: 4px; }
.col { display: flex; flex-direction: column; gap: 2px; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 状态标签：实线 = 定了，虚线 = 等人处理 ---------- */
.st {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid; border-radius: 3px;
  font-size: 12px; font-weight: 400; white-space: nowrap; line-height: 1; vertical-align: middle;
}
.st.k-dashed { color: var(--fg-2); border-color: #b9beb3; border-style: dashed; background: var(--bg); }
.st.k-pending { color: var(--amber); border-color: var(--amber-line); border-style: dashed; background: var(--amber-bg); }
.st.k-ring { color: var(--accent); border-color: #c0cadc; background: var(--accent-bg); }
.st.k-half { color: #fff; border-color: var(--accent); background: var(--accent); }
.st.k-done { color: var(--green); border-color: var(--green-line); background: var(--green-bg); }
.st.k-closed { color: var(--fg-2); border-color: var(--line-strong); background: var(--bg-sunken); }
.st.k-x { color: var(--fg-3); border-color: var(--line-strong); background: var(--bg-sunken); text-decoration: line-through; }
.st.k-bad { color: var(--red); border-color: var(--red-line); background: var(--red-bg); }
.st.dot { width: 8px; height: 8px; padding: 0; border-radius: 50%; }
.flag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
.flag.red { color: var(--red); font-weight: 500; }
.flag.amber { color: var(--amber); font-weight: 500; }
.pill { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 3px; font-size: 11.5px; background: var(--bg-sunken); border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.pill.red { background: var(--red-bg); border-color: var(--red-line); color: var(--red); }
.pill.amber { background: var(--amber-bg); border-color: #ecd29a; color: var(--amber); }
.pill.green { background: var(--green-bg); border-color: var(--green-line); color: var(--green); }
.pill.blue { background: var(--accent-bg); border-color: #c0cadc; color: var(--accent); }

/* 色块、款图 */
.sw { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sw i { width: 12px; height: 12px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); display: inline-block; }
.thumb { display: inline-grid; place-items: center; border-radius: 4px; flex: none; overflow: hidden; vertical-align: middle;
  background: radial-gradient(circle at 50% 38%, #fbfbf8, #e6e8e1); box-shadow: inset 0 0 0 1px rgba(28,34,48,.06); }

/* 进度 */
.prog { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.prog b { width: 64px; height: 6px; border-radius: 3px; background: var(--bg-active); overflow: hidden; display: inline-block; }
.prog b i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.prog.done b i { background: var(--green); }
.nodes { display: inline-flex; gap: 3px; }
.nodes i { width: 16px; height: 6px; border-radius: 1px; background: var(--bg-active); }
.nodes i.done { background: var(--green); }
.nodes i.run { background: var(--accent); }
.nodes i.late { background: var(--red); }
.nodes i.warn { background: var(--amber-line); }

/* ---------- 详情页 ---------- */
.detail { display: flex; min-height: calc(100vh - 44px - 32px - 52px); }
.detail > .body { flex: 1; min-width: 0; padding: 20px 24px 40px; }
.detail > .aside { width: 300px; flex: none; border-left: 1px solid var(--line); padding: 20px 20px 40px; background: #fbfbf9; border-radius: 0 0 6px 0; }
.title { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.title .st { font-size: 12px; }
.sub { color: var(--fg-2); margin-bottom: 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.props { display: grid; grid-template-columns: 76px 1fr; gap: 10px 10px; margin: 0; font-size: 12.5px; }
.props dt { color: var(--fg-3); }
.props dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.aside h4 { margin: 24px 0 10px; font-size: 12.5px; font-weight: 600; color: var(--fg); padding-left: 8px; border-left: 3px solid var(--accent); line-height: 1.1; }
.aside h4:first-child { margin-top: 0; }
.sec { margin-top: 28px; }
.sec > h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; padding-left: 9px; border-left: 3px solid var(--accent); line-height: 1.2; }
.sec > h3 .acts { margin-left: auto; display: flex; gap: 6px; font-weight: 400; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r); background: var(--amber-bg); border: 1px solid #ecd29a; color: var(--fg); margin-bottom: 16px; }
.banner > svg { color: var(--amber); }
.banner.red { background: var(--red-bg); border-color: var(--red-line); }
.banner.red > svg { color: var(--red); }
.banner .btn { margin-left: auto; }
.log { list-style: none; padding: 0; margin: 0; position: relative; }
.log li { display: flex; gap: 10px; padding: 6px 0; font-size: 12.5px; color: var(--fg-2); }
.log li span { color: var(--fg-3); width: 44px; flex: none; font-variant-numeric: tabular-nums; }

/* 时间线（进度节点） */
.tl { list-style: none; padding: 0; margin: 0; }
.tl li { display: grid; grid-template-columns: 18px 72px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tl li:last-child { border-bottom: none; }
.tl .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); justify-self: center; background: var(--bg); }
.tl .done .dot { background: var(--green); border-color: var(--green); }
.tl .run .dot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.tl .late .dot { border-color: var(--red); background: var(--red); }
.tl .warn .dot { border-color: var(--amber-line); }
.tl b { font-weight: 600; }
.tl small { color: var(--fg-3); font-size: 12px; font-variant-numeric: tabular-nums; }

/* 卡片网格（款式图卡） */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding: 20px; }
.card { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; background: var(--bg); transition: box-shadow 0.15s, border-color 0.15s; }
.card:hover { border-color: #c0cadc; box-shadow: var(--shadow-sm), 0 6px 18px rgba(28,34,48,.08); }
.card .pic { aspect-ratio: 1; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #fbfbf8, #e6e8e1); position: relative; }
.card .pic .thumb { background: none; box-shadow: none; }
.card .pic .st { position: absolute; top: 10px; right: 10px; }
.card .meta { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); }

/* 数字卡片（看板筛选、首页） */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.stat { padding: 14px 16px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: var(--bg); transition: border-color 0.12s, box-shadow 0.12s; }
.stat:hover { border-color: #c0cadc; }
.stat.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-bg); }
.stat span { font-size: 12.5px; color: var(--fg-2); }
.stat b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; line-height: 1.2; }
.stat b small { font-size: 12px; font-weight: 400; color: var(--fg-3); margin-left: 4px; }

/* 待办列表 */
.list { border-top: 1px solid var(--line); }
.list > a, .list > .li { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.list > a:hover { background: var(--bg-hover); }
.list .n { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
.h2 { font-size: 14px; font-weight: 600; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
.h1 { font-size: 22px; font-weight: 600; margin: 4px 0 4px; }

/* ---------- 首页仪表盘 ---------- */
.dash-hi { display: flex; align-items: flex-end; gap: 16px; padding: 6px 4px 14px; }
.dash-hi h1 { font-size: 20px; font-weight: 600; }
.dash-hi p { color: var(--fg-2); margin-top: 4px; }
.dash-hi .acts { margin-left: auto; display: flex; gap: 8px; }
.dgrid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
.panel { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow-sm); min-width: 0; display: flex; flex-direction: column; }
.panel > h3 { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--line); flex: none; }
.panel > h3 .ico { width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); }
.panel > h3 .acts { margin-left: auto; font-weight: 400; display: flex; gap: 6px; align-items: center; }
.panel > .pb { padding: 14px 16px; flex: 1; min-height: 0; }
.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
.kpi .big { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 6px; }
.kpi .big b { font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .big small { color: var(--fg-2); }
.kpi .big em { font-style: normal; font-size: 12px; margin-left: 6px; }
.kpi a > b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi a > span { font-size: 12px; color: var(--fg-3); }
.kpi .big > b { display: inline; font-size: 30px; }
.kpi a:hover b { color: var(--accent); }
.todo-g { margin-bottom: 14px; }
.todo-g:last-child { margin-bottom: 0; }
.todo-g > header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12.5px; color: var(--fg-2); }
.todo-i { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 5px; margin-bottom: 6px; background: var(--bg); }
.todo-i:hover { border-color: #c0cadc; background: var(--bg-hover); }
.todo-i .col { flex: 1; min-width: 0; }
.todo-i small { color: var(--fg-3); font-size: 12px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 6px; color: var(--fg-2); font-size: 12.5px; }
.quick a:hover { background: var(--bg-hover); color: var(--accent); }
.quick a i { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); }
.chart text { font-size: 10.5px; fill: var(--fg-3); font-family: inherit; }
.legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--fg-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* 颜色 × 尺码矩阵 */
.mx { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.mx th, .mx td { height: 34px; padding: 0 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.mx th { font-weight: 500; font-size: 12px; color: var(--fg-2); background: var(--bg-sunken); }
.mx th:first-child, .mx td:first-child { text-align: left; padding-left: 10px; }
.mx td.tot, .mx th.tot { color: var(--fg); font-weight: 600; }
.mx tfoot td { background: var(--bg-sunken); }
.mx .inp.cell { width: 64px; text-align: right; }
.mx small { display: block; font-size: 11px; color: var(--fg-3); line-height: 1.2; }

/* ---------- 弹窗 / 菜单 / 提示 ---------- */
.mask { position: fixed; inset: 0; z-index: 40; background: rgba(20, 32, 56, 0.38); display: grid; place-items: start center; padding: 8vh 16px 16px; overflow-y: auto; }
.modal { width: 560px; max-width: 100%; background: var(--bg); border-radius: 6px; box-shadow: var(--shadow); }
.modal > header { display: flex; align-items: center; height: 52px; padding: 0 12px 0 20px; font-size: 15px; font-weight: 600; border-bottom: 1px solid var(--line); }
.modal > header .btn { margin-left: auto; }
.modal > section { padding: 16px 20px 12px; max-height: 66vh; overflow-y: auto; }
.modal > footer { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: #fbfbf9; border-radius: 0 0 6px 6px; }
.modal > footer .sp { flex: 1; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.form .full { grid-column: 1 / -1; }
.f { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--fg-2); min-width: 0; }
.f > .inp, .f > .sel { width: 100%; font-size: 13px; color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); cursor: pointer; font-size: 12.5px; color: var(--fg-2); }
.chip:hover { color: var(--accent); border-color: var(--accent); }
.chip.on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
.errs { margin: 0; padding: 10px 12px 10px 28px; border-radius: var(--r); background: var(--red-bg); border: 1px solid var(--red-line); color: var(--fg); font-size: 12.5px; }
.pop { position: absolute; z-index: 30; min-width: 160px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }
.pop button { display: flex; width: 100%; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: none; background: none; border-radius: 4px; cursor: pointer; text-align: left; white-space: nowrap; }
.pop button:hover { background: var(--bg-hover); color: var(--accent); }
.pop button.danger { color: var(--red); }
.toasts { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 5px; background: var(--bg); color: var(--fg); border: 1px solid var(--green-line); border-left: 4px solid var(--green); box-shadow: var(--shadow); font-size: 13px; max-width: 560px; }
.toast.err { border-color: var(--red-line); border-left-color: var(--red); }
.toast a { color: var(--accent); font-weight: 600; cursor: pointer; }

/* 命令面板 */
.pal { width: 600px; max-width: 100%; background: var(--bg); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.pal input { width: 100%; height: 50px; padding: 0 18px; border: none; border-bottom: 1px solid var(--line); outline: none; background: none; font-size: 15px; }
.pal ul { list-style: none; margin: 0; padding: 6px; max-height: 52vh; overflow-y: auto; }
.pal li { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 5px; cursor: pointer; }
.pal li.on { background: var(--accent-bg); color: var(--accent); }
.pal li span { color: var(--fg-3); margin-left: auto; font-size: 12px; }

/* ---------- 意见 ---------- */
.fb { width: 340px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--bg); }
.fb > header { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); font-weight: 600; flex: none; }
.fb > header .pill { font-weight: 400; }
.fb > header .btn { margin-left: auto; }
.fb .compose { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; background: #fbfbf9; }
.fb .compose textarea { width: 100%; }
.fb .verdict { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fb .verdict button { height: 30px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--bg); cursor: pointer; color: var(--fg-2); }
.fb .verdict button.on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.fb .verdict button i { font-style: normal; color: var(--fg-3); margin-left: 4px; font-size: 11.5px; }
.fb .items { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
.fb .item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.fb .item .who { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-3); margin-bottom: 4px; }
.fb .item .who b { color: var(--fg); font-weight: 600; }
.fb .item .who button { margin-left: auto; border: none; background: none; color: var(--fg-3); cursor: pointer; padding: 0; }
.fb .item p { white-space: pre-wrap; overflow-wrap: anywhere; }
.fb .item.hl { background: var(--accent-bg); margin: 0 -16px; padding: 12px 16px; }
.pin-no { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--stitch); color: var(--side-2); font-size: 11px; font-weight: 700; font-style: normal; }
.pins { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
.pins .pin-no { position: absolute; pointer-events: auto; cursor: pointer; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.25); }
.picking { position: fixed; inset: 0; z-index: 35; cursor: crosshair; }
.picking .hl { position: fixed; border: 2px dashed var(--stitch); border-radius: 6px; background: rgba(217, 162, 58, 0.1); pointer-events: none; }
.picking .hl span { position: absolute; top: -26px; left: -2px; padding: 2px 8px; border-radius: 4px; background: var(--side); color: #fff; font-size: 12px; white-space: nowrap; }
.anchor-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); }

/* 手机报工：手机外框 */
.phone { width: 375px; height: 740px; margin: 24px auto; border-radius: 40px; padding: 12px; background: var(--side); box-shadow: var(--shadow); }
.phone .scr { height: 100%; border-radius: 30px; background: var(--bg-page); overflow-y: auto; position: relative; }
.phone .ph { position: sticky; top: 0; background: var(--accent); color: #fff; padding: 16px 16px 12px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; z-index: 2; }
.phone .ph .btn { color: #fff; }
.phone .pi { display: flex; gap: 12px; padding: 12px 14px; margin: 8px 10px 0; border-radius: 8px; background: var(--bg); cursor: pointer; box-shadow: var(--shadow-sm); }
.phone .pi:active { background: var(--bg-hover); }
.phone .nodes-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 16px; }
.phone .nodes-big button { height: 60px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; }
.phone .nodes-big button small { font-size: 11px; color: var(--fg-3); }
.phone .nodes-big button.done { border-color: var(--green-line); background: var(--green-bg); color: var(--green); }
.phone .nodes-big button.on { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
.phone .nodes-big button.late { border-color: var(--red-line); background: var(--red-bg); color: var(--red); }

/* 看板 / 企划小方块 */
.kanban { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 16px; padding: 20px; }
.kanban > div { background: var(--bg-sunken); border: 1px solid var(--line); border-radius: 6px; padding: 10px; min-height: 120px; }
.kanban h4 { margin: 2px 4px 10px; font-size: 13px; font-weight: 600; color: var(--fg); }
.kcard { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow-sm); }
.kcard:hover { border-color: #c0cadc; }
.hbar { display: flex; align-items: center; gap: 8px; }
.hbar b { height: 8px; border-radius: 2px; background: var(--accent); display: inline-block; min-width: 2px; }
.hbar.muted b { background: var(--line-strong); }

/* 意见面板开着、屏幕又不够宽时，右侧属性栏挪到下面，表格不挤 */
@media (max-width: 1720px) {
  .app:has(> .fb) .detail { flex-direction: column; }
  .app:has(> .fb) .detail > .aside { width: auto; border-left: none; border-top: 1px solid var(--line); }
}
/* 首页窄了（小屏或意见面板开着）：数字卡片两个一行，其余占满 */
@media (max-width: 1280px) {
  .dgrid > :nth-child(-n+4) { grid-column: span 6 !important; }
  .dgrid > :nth-child(n+5) { grid-column: span 12 !important; }
}
@media (max-width: 1720px) {
  .app:has(> .fb) .dgrid > :nth-child(-n+4) { grid-column: span 6 !important; }
  .app:has(> .fb) .dgrid > :nth-child(n+5) { grid-column: span 12 !important; }
}
@media (max-width: 900px) {
  .side { width: 64px; }
  .side .nav-i span, .side .grp > b, .side .find span, .side kbd, .ws span, .nav-i .n { display: none; }
  .ws { padding: 0; justify-content: center; }
  .detail { flex-direction: column; }
  .detail > .aside { width: auto; border-left: none; border-top: 1px solid var(--line); }
  .fb { position: fixed; right: 0; top: 0; bottom: 0; z-index: 30; box-shadow: var(--shadow); max-width: 100%; }
  .me span, .me small { display: none; }
}
@media print {
  .side, .fb, .topbar, .head .acts, .bar { display: none !important; }
  .main { overflow: visible; padding: 0; }
  .sheet { border: none; box-shadow: none; }
}

/* 页面里的分类树（物料分类等）：借侧栏的结构，换成浅色 */
.sheet .grp > b { height: 28px; padding: 0 10px; color: var(--fg-3); cursor: default; }
.sheet .nav-i { height: 32px; color: var(--fg); border: none; gap: 8px; }
.sheet .nav-i svg { color: var(--fg-3); }
.sheet .nav-i:hover { background: var(--bg-hover); color: var(--accent); }
.sheet .nav-i.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.sheet .nav-i .n { background: none; color: var(--fg-3); font-weight: 400; }

.gallery { margin-bottom: 20px; }
.gallery > .thumb { border-radius: 6px; }
.gthumb { padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; line-height: 0; }
.gthumb.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
</style>
</head>

  production: { 提交: ['草稿', '待审核'], 撤回: ['待审核', '草稿'], 驳回: ['待审核', '草稿'], 审核: ['待审核', '已下单'], 结案: [['已下单', '生产中', '部分回货'], '已结案'], 作废: [['草稿', '待审核'], '已作废'] },
  techpack: { 生效: ['草稿', '已生效'] },
  supplier: { 准入: ['待准入', '合作中'], 停用: ['合作中', '停用'], 启用: ['停用', '合作中'], 拉黑: [['待准入', '合作中', '停用'], '黑名单'], 解除黑名单: ['黑名单', '停用'] },
  style: { 启用: ['草稿', '启用'], 停用: ['启用', '停用'], 恢复: ['停用', '启用'] },
}
const can = (kind, doc, a) => { const f = FLOWS[kind]?.[a]; return !!f && [].concat(f[0]).includes(doc.status) }
const actionsOf = (kind, doc) => Object.keys(FLOWS[kind]).filter((a) => can(kind, doc, a))
function move(kind, doc, a, note) {
  if (!can(kind, doc, a)) fail(`${doc.no || doc.code || ''} 现在是「${doc.status}」，不能${a}`)
  doc.status = FLOWS[kind][a][1]
  act(doc, a + (note ? '：' + note : ''))
}
/* 带额外规则的动作；没列在这里的直接 move */
const RULES = {
  order: { 提交: submitOrder, 反审核: unauditOrder },
  purchase: { 反审核: unauditPurchase },
  production: { 审核: auditProduction },
  stock: { 审核: postStockDoc, 反审核: unpostStockDoc },
  techpack: { 生效: publishTp },
  change: { 审核: auditChange },
  supplier: { 准入: admitSupplier },
}
function doAction(kind, doc, a, ...args) {
  const f = RULES[kind]?.[a]
  return f ? f(doc, ...args) : move(kind, doc, a)
}

/* ---------- 供应商 ---------- */
// purpose：采购 / 生产 只能用合作中的；打样 待准入也行
function canUseSupplier(code, purpose) {
  const s = sup(code)
  if (!s) return false
  return purpose === '打样' ? ['待准入', '合作中'].includes(s.status) : s.status === '合作中'
}
const isFactory = (s) => s.cats.some((c) => c === '成衣厂' || c === '加工厂')
function createSupplier(f) {

  if (isFactory(s) && !factoryWh(code)) add(db.warehouses, { code: 'GC' + code.slice(3), name: s.short + '仓', type: '工厂仓', factory: code, status: '启用' })

}
function admitSupplier(s) {

}
function openDocsOfSupplier(code) {

    ...db.productions.filter((p) => p.factory === code && ['草稿', '待审核', '已下单', '生产中', '部分回货'].includes(p.status)).map((p) => p.no),
  ]
}
function blacklistSupplier(s, reason) {
  if (!reason) fail('要写拉黑原因')
  move('supplier', s, '拉黑', reason)
  s.blackReason = reason
}
const expiringCerts = () => db.suppliers.flatMap((s) => s.certs.filter((c) => c.until && daysLeft(c.until) <= 30 && daysLeft(c.until) >= 0).map((c) => ({ s, c })))

/* ---------- 款式 ---------- */
function createStyle(f) {
  if (!f.name) fail('款式名称要填')
  if (!f.colors?.length) fail('至少选一个颜色')
  const prefix = String(f.year).slice(2) + f.season + f.cat
  const code = f.code || prefix + String(db.styles.filter((s) => s.code.startsWith(prefix)).length + 1).padStart(3, '0')
  if (style(code)) fail(`款号 ${code} 已经有了`)
  const s = add(db.styles, { brand: '织间', gender: '女', source: '自主开发', wave: '第 1 波', tag: '通勤', designer: db.me, sizeGroup: 'W5', ...f, code, colors: [], skus: [], status: f.status || '草稿', log: [] })
  f.colors.forEach((c) => addStyleColor(s, c, true))
  act(s, '新建')
  return s
}
function addStyleColor(s, c, silent) {
  if (s.colors.includes(c)) return
  s.colors.push(c)
  sizesOf(s.sizeGroup).forEach((z) => s.skus.push({ code: `${s.code}-${c}-${z}`, color: c, size: z, status: '启用' }))
  if (!silent) act(s, '加颜色 ' + colorName(c) + '，新增 ' + sizesOf(s.sizeGroup).length + ' 个 SKU')
}
const tpsOf = (code) => db.techpacks.filter((t) => t.style === code).sort((a, b) => b.ver - a.ver)
const activeTp = (code) => db.techpacks.find((t) => t.style === code && t.status === '已生效')
const tpOf = (code, ver) => db.techpacks.find((t) => t.style === code && t.ver === ver)
const tpState = (code) => (activeTp(code) ? '已生效' : tpsOf(code).length ? '草稿' : '无')
// 资料包已生效、但有"随款色"行没给这个颜色配料
function unmatchedColors(s) {
  const tp = activeTp(s.code)
  if (!tp) return []
  return s.colors.filter((c) => tp.bom.some((r) => r.mode === '随款色' && !r.map[c]))
}

/* ---------- 资料包 ---------- */
const rowSku = (r, color) => (r.mode === '固定' ? r.sku : r.map[color])
const rowUse = (r, size) => (r.um === '统一' ? +r.use || 0 : +r.uses[size] || 0)
const rowMidUse = (r, sizes) => (r.um === '统一' ? +r.use || 0 : +r.uses[sizes[Math.floor((sizes.length - 1) / 2)]] || 0)
const unitPrice = (r) => { const m = mat(r.mat); return (r.price ?? m.price) / m.factor } // 折成库存单位
const rowCost = (r, sizes) => rnd(rowMidUse(r, sizes) * (1 + r.loss / 100) * unitPrice(r), 2)
// 只算我方采购的料：客供的料客户出，工厂自备的算在加工费里
const tpMaterialCost = (tp) => { const sz = sizesOf(style(tp.style).sizeGroup); return rnd(sum(tp.bom.filter((r) => r.src === '我方采购'), (r) => rowCost(r, sz)), 2) }
const tpLabor = (tp) => rnd(sum(tp.ops, (o) => o.price), 2)

function createTechpack(styleCode, bom, ops, note) {
  const ver = (tpsOf(styleCode)[0]?.ver || 0) + 1
  const tp = add(db.techpacks, { id: styleCode + '-V' + ver, style: styleCode, ver, status: '草稿', note: note || '', util: null, bom, ops, log: [] })
  act(tp, ver === 1 ? '新建' : '由 V' + (ver - 1) + ' 修订')
  return tp
}
function tpCheck(tp) {
  const s = style(tp.style), errs = []
  if (!tp.bom.length) errs.push('至少要有一行 BOM')
  if (tp.ver > 1 && !tp.note) errs.push('V2 起要写本版说明')
  tp.bom.forEach((r, i) => {
    if (r.mode === '随款色') s.colors.forEach((c) => { if (!r.map[c]) errs.push(`第 ${i + 1} 行（${r.part}）：${colorName(c)}未配料`) })
    if (r.um === '分码') sizesOf(s.sizeGroup).forEach((z) => { if (!(r.uses[z] > 0)) errs.push(`第 ${i + 1} 行（${r.part}）：${z} 码没有用量`) })
    if (r.um === '统一' && !(r.use > 0)) errs.push(`第 ${i + 1} 行（${r.part}）：没有用量`)
    if (mat(r.mat)?.status === '停用') errs.push(`第 ${i + 1} 行：${mat(r.mat).name} 已停用`)
  })
  return errs
}
function publishTp(tp) {
  const errs = tpCheck(tp)
  if (errs.length) fail('资料包还不能生效', errs)
  db.techpacks.filter((t) => t.style === tp.style && t.status === '已生效').forEach((t) => { t.status = '已作废'; act(t, '被 V' + tp.ver + ' 替代') })
  move('techpack', tp, '生效')
  tp.publishedAt = clock.today
  tp.publishedBy = db.me
}
function reviseTp(tp) {
  if (tpsOf(tp.style).some((t) => t.status === '草稿')) fail('已经有一个草稿版本，先把它改完')
  const copy = JSON.parse(JSON.stringify({ bom: tp.bom, ops: tp.ops }))
  return createTechpack(tp.style, copy.bom, copy.ops, '')
}

/* ---------- 订单 ---------- */
const lineKey = (l) => `${l.style}|${l.color}|${l.size}`
const orderQty = (o) => sum(o.lines, (l) => l.qty)
const orderAmt = (o) => rnd(sum(o.lines, (l) => l.qty * (l.price || 0)), 2)
const orderStyles = (o) => [...new Set(o.lines.map((l) => l.style))]
const prodsOf = (o) => db.productions.filter((p) => p.order === o.no && p.status !== '已作废')
const mrpsOf = (o) => db.mrps.filter((m) => m.orders.includes(o.no))
const sumProdLine = (o, l, f) => sum(prodsOf(o).filter((p) => p.style === l.style).flatMap((p) => p.lines.filter((x) => x.color === l.color && x.size === l.size)), f)
const scheduledQty = (o, l) => sumProdLine(o, l, (x) => x.qty)
const returnedQty = (o, l) => sumProdLine(o, l, (x) => x.ret)
const orderSched = (o) => sum(o.lines, (l) => scheduledQty(o, l))
const orderRet = (o) => sum(o.lines, (l) => returnedQty(o, l))
const orderLive = (o) => ['已审核', '生产中'].includes(o.status)

function createOrder(f) {
  const lines = (f.lines || []).filter((l) => l.qty > 0)
  if (!lines.length) fail('至少录一个数量')
  if (f.type === '客户订单' && !f.customer) fail('客户订单要选客户')
  if (!f.due) fail('客户交期要填')
  const o = add(db.orders, { no: nextNo('DD'), company: 'ZJ', currency: '人民币', date: clock.today, commit: null, sales: 'u3', merch: 'u1', ship: '', custNo: '', ...f, lines: lines.map((l) => ({ ver: null, price: null, ...l })), status: '草稿', log: [] })
  act(o, '新建')
  return o
}
function submitOrder(o) {
  const errs = []
  orderStyles(o).forEach((c) => {
    const s = style(c)
    if (s.status !== '启用') errs.push(`${c} 是「${s.status}」，不能下单`)
    else if (!activeTp(c)) errs.push(`${c} 的资料包还没生效`)
    else unmatchedColors(s).forEach((col) => { if (o.lines.some((l) => l.style === c && l.color === col)) errs.push(`${c} 的 ${colorName(col)} 还没配料`) })
  })
  if (errs.length) fail('订单还不能提交', errs)
  move('order', o, '提交')
}
function auditOrder(o, commit) {
  if (!commit) fail('要填承诺交期')
  const miss = orderStyles(o).filter((c) => !activeTp(c))
  if (miss.length) fail('资料包没生效的款不能审核', miss)
  move('order', o, '审核', '承诺交期 ' + commit)
  o.lines.forEach((l) => { l.ver = activeTp(l.style).ver })
  o.commit = commit
}
function unauditOrder(o) {
  const down = [...prodsOf(o).map((p) => p.no), ...mrpsOf(o).filter((m) => m.status !== '已关闭').map((m) => m.no)]
  if (down.length) fail('已经有下游单据，不能反审核', down)
  move('order', o, '反审核')
  o.lines.forEach((l) => { l.ver = null })
}
// 审核对话框：资料包、缺口最大的 5 种料、默认加工厂在手件数
function reviewInfo(o) {
  const rows = calcNeeds([o.no], true).filter((a) => a.src !== '工厂自备')
  const short = rows.map((a) => ({ ...a, avail: availFor(a.sku, a.owner), gap: 0 })).map((a) => ({ ...a, gap: rnd(a.need - a.avail, 3) }))
    .filter((a) => a.gap > 0).sort((a, b) => b.gap * unitPriceOfSku(b.sku) - a.gap * unitPriceOfSku(a.sku)).slice(0, 5)
  const loads = orderStyles(o).map((c) => style(c).factory).filter(Boolean)
  return {
    packs: orderStyles(o).map((c) => ({ style: c, tp: activeTp(c) })),
    short,
    loads: [...new Set(loads)].map((f) => ({ factory: f, qty: factoryLoad(f) })),
  }
}
const unitPriceOfSku = (s) => { const m = matOfSku(s); return m.price / m.factor }
const factoryLoad = (f) => sum(db.productions.filter((p) => p.factory === f && ['已下单', '生产中', '部分回货'].includes(p.status)), (p) => prodQty(p) - prodRet(p))

// 排单：blocks = [{ style, factory, mode, price, due, qty: { 'KQ|S': 80 } }]，一块生成一张加工单
const OVER = 0.03 // 溢装 / 短装比例（PRD Q09 默认 3%）
function scheduleOrder(o, blocks) {
  if (!orderLive(o)) fail('订单审核后才能排单')
  const errs = [], extra = {}
  blocks.forEach((b) => {
    const n = sum(Object.values(b.qty))
    if (!n) return
    if (!b.factory) errs.push(`${b.style}：要选加工厂`)
    else if (!canUseSupplier(b.factory, '生产')) errs.push(`${supName(b.factory)} 现在是「${sup(b.factory).status}」，不能下加工单`)
    if (!(b.price > 0)) errs.push(`${b.style}：加工单价要填`)
    Object.entries(b.qty).forEach(([k, q]) => { if (q > 0) extra[b.style + '|' + k] = (extra[b.style + '|' + k] || 0) + q })
  })
  if (!Object.keys(extra).length) errs.push('没有要排的数量')
  o.lines.forEach((l) => {
    const q = extra[lineKey(l)]
    if (!q) return
    const cap = Math.floor(l.qty * (1 + OVER)), done = scheduledQty(o, l)
    if (done + q > cap) errs.push(`${l.style}-${l.color}-${l.size}：订单 ${l.qty} 件，已排 ${done}，最多还能排 ${Math.max(0, cap - done)} 件`)
  })
  if (errs.length) fail('排单没通过', errs)
  return blocks.filter((b) => sum(Object.values(b.qty)) > 0).map((b) => createProduction(o, b))
}

// 订单变更：items = [{ k: '27CF001|KQ|M', to: 100 }]，due = 新客户交期
function createChange(o, f) {
  if (!orderLive(o)) fail('只有已审核的订单才走变更')
  if (!f.reason) fail('要写变更原因')
  const items = (f.items || []).map((i) => { const l = o.lines.find((x) => lineKey(x) === i.k); return { k: i.k, label: i.k.replace(/\|/g, '-'), from: l ? l.qty : 0, to: +i.to || 0 } }).filter((i) => i.to !== i.from)
  const due = f.due && f.due !== o.due ? { from: o.due, to: f.due } : null
  if (!items.length && !due) fail('没有改动')
  const errs = []
  items.forEach((i) => {
    const l = o.lines.find((x) => lineKey(x) === i.k)
    const done = l ? scheduledQty(o, l) : 0
    if (i.to < done) errs.push(`${i.label}：已排产 ${done} 件，先调整加工单 ${prodsOf(o).filter((p) => p.style === l.style).map((p) => p.no).join('、')}`)
  })
  if (errs.length) fail('变更不能提交', errs)
  const types = [items.length && '数量', due && '交期'].filter(Boolean)
  const c = add(db.changes, { no: nextNo('BG'), order: o.no, types, items, due, reason: f.reason, party: f.party || '客户', fee: f.fee || '', date: clock.today, by: db.me, status: '待审核', log: [] })
  act(c, '提交')
  act(o, '提交变更单 ' + c.no)
  return c
}
const describeChange = (c) => [...c.items.map((i) => `${i.label}：${i.from} → ${i.to}`), c.due && `客户交期：${fd(c.due.from)} → ${fd(c.due.to)}`].filter(Boolean).join('；')
function auditChange(c) {
  move('change', c, '审核')
  const o = order(c.order)
  c.items.forEach((i) => {
    const l = o.lines.find((x) => lineKey(x) === i.k)
    if (l) l.qty = i.to
    else { const [st, co, sz] = i.k.split('|'); const ref = o.lines.find((x) => x.style === st); o.lines.push({ style: st, color: co, size: sz, qty: i.to, price: ref?.price ?? null, ver: ref?.ver ?? null }) }
  })
  if (c.due) o.due = c.due.to
  const text = describeChange(c)
  act(o, `变更单 ${c.no} 生效：${text}`)
  const note = { no: c.no, order: o.no, at: clock.today, text }
  prodsOf(o).forEach((p) => { p.upstream = { ...note } })
  db.mrps.filter((m) => m.orders.includes(o.no) && m.status !== '已关闭').forEach((m) => { m.upstream = { ...note } })
  db.purchases.filter((p) => p.lines.some((l) => l.src?.orders?.includes(o.no)) && ['草稿', '待审核', '已审核', '部分到货'].includes(p.status)).forEach((p) => { p.upstream = { ...note } })
}
const upstreamPending = () => [...db.productions, ...db.mrps, ...db.purchases].filter((d) => d.upstream && !d.upstream.done)

/* ---------- 算料 ---------- */
// 毛需求 = Σ 订单 SKU 数 × 尺码用量；需求 = Σ 毛需求 ×（1 + 损耗）（备料比默认 0，PRD §4.3 的口径）。按 来源 + 物料 SKU + 物权 汇总
function calcNeeds(orderNos, useActive) {
  const acc = {}
  orderNos.map(order).forEach((o) => o.lines.forEach((l) => {
    const tp = useActive ? activeTp(l.style) : tpOf(l.style, l.ver)
    if (!tp) return
    tp.bom.forEach((r) => {
      const sku = rowSku(r, l.color)
      if (!sku) return
      const owner = r.src === '客供' ? o.customer || '自有' : '自有'
      const a = (acc[r.src + '|' + sku + '|' + owner] ||= { sku, owner, src: r.src, supplier: r.supplier || matOfSku(sku).supplier, price: r.price ?? matOfSku(sku).price, gross: 0, need: 0, orders: [], styles: [] })
      a.gross += l.qty * rowUse(r, l.size)
      a.need += l.qty * rowUse(r, l.size) * (1 + r.loss / 100)
      if (!a.orders.includes(o.no)) a.orders.push(o.no)
      if (!a.styles.includes(l.style)) a.styles.push(l.style)
    })
  }))
  return Object.values(acc).map((a) => ({ ...a, gross: rnd(a.gross, 3), need: rnd(a.need, 3) }))
}
const materialWhs = () => db.warehouses.filter((w) => w.type === '物料仓').map((w) => w.code)
// 可用库存 = 物料仓同物权库存 − 其他已确认算料单还没领走的"本次使用库存"
function availFor(sku, owner, exceptMrp) {
  const have = sum(materialWhs(), (w) => stockQty(w, sku, owner))
  const held = sum(db.mrps.filter((m) => m.status === '已确认' && m.no !== exceptMrp), (m) =>
    sum(m.rows.filter((r) => r.sku === sku && r.owner === owner), (r) => Math.max(0, (r.useStock || 0) - issuedFor(m.orders, sku, owner))))
  return Math.max(0, rnd(have - held, 3))
}
const issuedFor = (orderNos, sku, owner) => sum(db.stockDocs.filter((d) => d.status === '已审核' && (d.type === '领料' || d.type === '退料') && orderNos.includes(production(d.src)?.order))
  .flatMap((d) => d.lines.filter((l) => l.sku === sku && l.owner === owner).map((l) => (d.type === '退料' ? -l.qty : l.qty))))
// 在途 = 已审核采购单里还没入库的（换成库存单位），只做参考
const transitQty = (sku, owner) => rnd(sum(db.purchases.filter((p) => ['已审核', '部分到货'].includes(p.status)).flatMap((p) => p.lines).filter((l) => l.sku === sku && (l.owner || '自有') === owner), (l) => (l.qty - l.received) * matOfSku(sku).factor), 3)
// 建议采购量：净需求换成采购单位，向上取整到最小包装，不小于起订量
function suggestPur(sku, net) {
  if (net <= 0) return 0
  const m = matOfSku(sku)
  const q = Math.ceil(rnd(net / m.factor / m.pack, 6)) * m.pack
  return Math.max(rnd(q, 3), m.moq || 0)
}
function createMrp(orderNos) {
  if (!orderNos.length) fail('先选订单')
  orderNos.forEach((no) => { const o = order(no); if (!orderLive(o)) fail(`${no} 是「${o.status}」，只有已审核的订单能算料`) })
  const no = nextNo('SL')
  const rows = calcNeeds(orderNos).map((a) => {
    const need = a.need
    if (a.src === '工厂自备') return a
    const avail = availFor(a.sku, a.owner, no)
    const useStock = Math.min(avail, need)
    const net = rnd(need - useStock, 3)
    return { ...a, need, avail, useStock, transit: transitQty(a.sku, a.owner), useTransit: 0, net, purQty: a.src === '我方采购' ? suggestPur(a.sku, net) : 0, converted: 0 }
  })
  const m = add(db.mrps, { no, orders: [...orderNos], date: clock.today, status: '草稿', rows, upstream: null, log: [] })
  act(m, '算料：' + orderNos.join('、'))
  return m
}
function updateMrpRow(r, field, v) {
  v = Math.max(0, +v || 0)
  if (field === 'useStock') r.useStock = Math.min(v, r.avail, r.need)
  if (field === 'useTransit') r.useTransit = v
  r.net = rnd(r.need - r.useStock - (r.useTransit || 0), 3)
  if (r.src === '我方采购') r.purQty = Math.max(suggestPur(r.sku, r.net), r.converted)
}
function mrpToPurchases(m, idxs) {
  if (m.status === '已关闭') fail('算料单已关闭')
  const rows = idxs.map((i) => m.rows[i]).filter((r) => r && r.src === '我方采购' && r.purQty - r.converted > 0)
  if (!rows.length) fail('勾选的行没有要买的')
  const bad = [...new Set(rows.map((r) => r.supplier))].filter((s) => !canUseSupplier(s, '采购'))
  if (bad.length) fail('有供应商现在不能下单，先在行上换一家', bad.map((s) => `${supName(s)}：${sup(s)?.status || '未选'}`))
  if (m.status === '草稿') move('mrp', m, '确认')
  const bySup = {}
  rows.forEach((r) => (bySup[r.supplier] ||= []).push(r))
  const pos = Object.entries(bySup).map(([s, rs]) => createPurchase({
    supplier: s, type: '订单采购', wh: 'WL01',
    lines: rs.map((r) => ({ sku: r.sku, owner: r.owner, qty: rnd(r.purQty - r.converted, 3), price: r.price, src: { mrp: m.no, orders: r.orders, styles: r.styles } })),
  }))
  rows.forEach((r) => { r.converted = r.purQty })
  act(m, '生成采购单 ' + pos.map((p) => p.no).join('、'))
  return pos
}
// 齐料：订单关联算料单"我方采购"每一行，已入库 + 本次使用库存 ≥ 需求
function kitState(o) {
  const ms = mrpsOf(o)
  if (!ms.length) return { t: '未算料', k: 'none' }
  const rows = ms.flatMap((m) => m.rows.filter((r) => r.src === '我方采购').map((r) => ({ m, r })))
  const ok = rows.filter(({ m, r }) => {
    const recv = sum(db.purchases.flatMap((p) => p.lines).filter((l) => l.src?.mrp === m.no && l.sku === r.sku), (l) => l.received * matOfSku(r.sku).factor)
    return recv + r.useStock >= r.need - 0.001
  }).length
  if (ok === rows.length) return { t: '齐料', k: 'ok' }
  return ok ? { t: `部分到料 ${ok}/${rows.length}`, k: 'part' } : { t: '未到料', k: 'no' }
}

/* ---------- 采购 ---------- */
const poQty = (p) => rnd(sum(p.lines, (l) => l.qty), 3)
const poAmt = (p) => rnd(sum(p.lines, (l) => l.qty * l.price), 2)
const poRecv = (p) => rnd(sum(p.lines, (l) => l.received), 3)
function createPurchase(f) {
  if (!canUseSupplier(f.supplier, '采购')) fail(`${supName(f.supplier)} 现在是「${sup(f.supplier)?.status || '未选'}」，不能下采购单`)

  const s = sup(f.supplier)
  const p = add(db.purchases, {
    no: nextNo('CG'), company: 'ZJ', type: '订单采购', buyer: 'u2', wh: 'WL01', date: clock.today, due: addDays(clock.today, lead), settle: s.settle, tax: s.tax, upstream: null, ...f,
    lines: lines.map((l) => ({ owner: '自有', due: null, expect: null, note: '', received: 0, returned: 0, src: null, ...l })), status: '草稿', log: [],
  })
  act(p, '新建')

}
function unauditPurchase(p) {
  if (poRecv(p) > 0) fail('已经有入库，不能反审核')
  move('purchase', p, '反审核')
}
function refreshPoStatus(p) {
  if (!['已审核', '部分到货', '已到齐'].includes(p.status)) return
  const all = p.lines.every((l) => l.received >= l.qty - 0.0005)
  const any = p.lines.some((l) => l.received > 0)
  const ns = all ? '已到齐' : any ? '部分到货' : '已审核'
  if (ns !== p.status) { p.status = ns; act(p, ns) }
}
// lines = [{ i: 采购行号, qty: 采购单位数量, lot: 缸号 }]
function receivePurchase(p, f) {
  if (!['已审核', '部分到货'].includes(p.status)) fail('采购单审核后才能入库')
  const ls = (f.lines || []).filter((x) => x.qty > 0)
  if (!ls.length) fail('至少收一行')
  const errs = []
  ls.forEach((x) => {
    const l = p.lines[x.i], cap = rnd((l.qty - l.received) + l.qty * 0.05, 3)
    if (x.qty > cap) errs.push(`${skuName(l.sku)}：最多还能收 ${fq(cap)} ${matOfSku(l.sku).purUnit}`)
  })
  if (errs.length) fail('超过可收数量（溢收 5%）', errs)
  const d = createStockDoc({
    type: '采购入库', src: p.no, partner: p.supplier, to: f.wh || p.wh, supNo: f.supNo || '',
    lines: ls.map((x) => { const l = p.lines[x.i], m = matOfSku(l.sku); return { sku: l.sku, owner: l.owner, qty: rnd(x.qty * m.factor, 3), purQty: x.qty, price: l.price, lot: x.lot || '', poLine: x.i } }),
  })
  postStockDoc(d)
  return d
}
// 到料跟踪：未入齐的采购行
function arrivals() {
  return db.purchases.filter((p) => ['已审核', '部分到货'].includes(p.status)).flatMap((p) => p.lines.map((l, i) => ({ p, l, i })))
    .filter(({ l }) => l.received < l.qty - 0.0005)
    .map((x) => { const d = x.l.expect || x.l.due || x.p.due; const left = daysLeft(d); return { ...x, date: d, left, risk: left < 0 ? 'late' : left <= 3 ? 'near' : '' } })
}

/* ---------- 库存单据 ---------- */
const STOCK_TYPES = { 采购入库: 'RK', 客供入库: 'RK', 其他入库: 'RK', 领料: 'LL', 退料: 'LL', 调拨: 'DB', 采购退货: 'CK', 其他出库: 'CK' }
function createStockDoc(f) {
  const lines = (f.lines || []).filter((l) => l.sku && l.qty > 0)
  if (!lines.length) fail('至少一行物料')
  if (f.type === '客供入库' && !f.partner) fail('客供入库要选客户')
  if (['调拨', '领料', '退料'].includes(f.type) && (!f.from || !f.to)) fail('出仓、入仓都要选')
  if (f.from && f.from === f.to) fail('出仓和入仓不能是同一个')
  const owner = f.type === '客供入库' ? f.partner : null
  const d = add(db.stockDocs, {
    no: nextNo(STOCK_TYPES[f.type]), company: 'ZJ', src: '', from: null, to: null, partner: '', reason: '', date: clock.today, ...f,
    lines: lines.map((l) => ({ owner: owner || '自有', price: null, lot: '', ...l })), status: '草稿', log: [],
  })
  act(d, '新建')
  return d
}
function stockShortage(whCode, lines) {
  const need = {}
  lines.forEach((l) => { const k = stockKey(whCode, l.sku, l.owner); need[k] = (need[k] || 0) + l.qty })
  return Object.entries(need).filter(([k, q]) => (db.stock[k] || 0) < q - 0.0005)
    .map(([k, q]) => { const [, s, o] = k.split('|'); const have = db.stock[k] || 0; return `${skuName(s)}${o !== '自有' ? '（' + ownerName(o) + '）' : ''}：${whName(whCode)} 库存 ${fq(have)}，差 ${fq(rnd(q - have, 3))}` })
}
function changeStock(w, l, delta, d) {
  const k = stockKey(w, l.sku, l.owner)
  db.stock[k] = rnd((db.stock[k] || 0) + delta, 3)
  db.stockLogs.unshift({ at: clock.today, type: d.type, no: d.no, wh: w, sku: l.sku, owner: l.owner || '自有', delta: rnd(delta, 3), bal: db.stock[k], lot: l.lot || '', who: db.me })
}
// 审核即过账：库存不够整张不过，列出差多少
function postStockDoc(d) {
  if (!can('stock', d, '审核')) fail(`${d.no} 现在是「${d.status}」，不能审核`)
  if (d.from) { const s = stockShortage(d.from, d.lines); if (s.length) fail('库存不够，没过账', s) }
  d.lines.forEach((l) => { if (d.from) changeStock(d.from, l, -l.qty, d); if (d.to) changeStock(d.to, l, l.qty, d) })
  if (d.type === '采购入库' && d.src) { const p = purchase(d.src); d.lines.forEach((l) => { p.lines[l.poLine].received = rnd(p.lines[l.poLine].received + l.purQty, 3) }); act(p, '入库 ' + d.no); refreshPoStatus(p) }
  move('stock', d, '审核')
  d.auditor = db.me
}
function unpostStockDoc(d) {
  if (d.to) { const s = stockShortage(d.to, d.lines); if (s.length) fail('料已经被用掉或调走，改不回去', s) }
  d.lines.forEach((l) => { if (d.to) changeStock(d.to, l, -l.qty, d); if (d.from) changeStock(d.from, l, l.qty, d) })
  if (d.type === '采购入库' && d.src) {
    const p = purchase(d.src)
    d.lines.forEach((l) => { p.lines[l.poLine].received = rnd(p.lines[l.poLine].received - l.purQty, 3) })
    if (['部分到货', '已到齐'].includes(p.status)) { p.status = '已审核'; refreshPoStatus(p) }
  }
  move('stock', d, '反审核')
}
const stockDir = (d) => (d.from && d.to ? '移' : d.to ? '入' : '出')

/* ---------- 加工单 ---------- */
const prodQty = (p) => sum(p.lines, (l) => l.qty)
const prodRet = (p) => sum(p.lines, (l) => l.ret)
const prodDef = (p) => sum(p.lines, (l) => l.def)
const prodAmt = (p) => rnd(prodQty(p) * p.price, 2)
const prodLive = (p) => ['已下单', '生产中', '部分回货'].includes(p.status)
function createProduction(o, b) {
  const s = style(b.style)
  const lines = s.colors.flatMap((c) => sizesOf(s.sizeGroup).map((z) => ({ color: c, size: z, qty: b.qty[c + '|' + z] || 0, ret: 0, def: 0 }))).filter((l) => l.qty > 0)
  const p = add(db.productions, {

    price: +b.price, date: clock.today, due: b.due, expect: null, merch: o.merch, settle: sup(b.factory).settle, terms: '', status: '草稿', lines, nodes: [], issues: [], upstream: null, log: [],
  })

}
// 审核：从交期往前倒排节点计划
function auditProduction(p) {
  move('production', p, '审核')
  let end = p.due
  p.nodes = db.dicts.生产节点.slice().reverse().map(([name, days]) => {
    const pf = end, ps = addDays(pf, -(days - 1))
    end = addDays(ps, -1)
    return { name, ps, pf, as: null, af: null, qty: null, note: '', by: null }
  }).reverse()
  const o = order(p.order)
  if (o?.status === '已审核') { o.status = '生产中'; act(o, '加工单 ' + p.no + ' 已下单') }
}
// 节点状态：done / late（延期）/ warn（临期）/ run / todo
function nodeState(n) {
  if (n.af) return n.af > n.pf ? 'late' : 'done'
  if (clock.today > n.pf) return 'late'
  if (diffDays(n.pf, clock.today) <= 2) return 'warn'
  return n.as ? 'run' : 'todo'
}
const curNode = (p) => p.nodes.find((n) => !n.af)
function reportNode(p, i, f) {
  if (!prodLive(p)) fail('加工单审核后才能报进度')
  const n = p.nodes[i]
  if (!f.as && !f.af) fail('开始、完成至少填一个')
  if (f.af && f.as && f.af < f.as) fail('完成时间不能早于开始时间')
  Object.assign(n, { as: f.as || n.as || f.af, af: f.af || null, qty: f.qty ?? n.qty, note: f.note || n.note, by: db.me })
  if (p.status === '已下单') p.status = '生产中'
  act(p, `报进度：${n.name}${f.af ? '完成' : '开始'}${f.qty ? ' ' + f.qty + ' 件' : ''}`)
  return p.nodes.slice(0, i).some((x) => !x.af) ? '前面还有节点没报完成' : null
}
const expectDue = (p) => p.expect || p.due
// 风险：late 已逾期 / near 临期（7 天内）/ node 节点延期 / issue 有未关闭异常
function prodRisk(p) {
  const r = { late: false, near: false, node: false, issue: false, score: 0 }
  if (!['已下单', '生产中', '部分回货'].includes(p.status)) return r
  const left = daysLeft(expectDue(p))
  r.late = left < 0
  r.near = !r.late && left <= 7
  r.node = p.nodes.some((n) => !n.af && clock.today > n.pf)
  r.issue = p.issues.some((i) => i.status !== '已关闭')
  r.score = (r.late ? 8 : 0) + (r.node ? 4 : 0) + (r.issue ? 2 : 0) + (r.near ? 1 : 0)
  return r
}
function reportIssue(p, f) {
  if (!f.type || !f.desc) fail('类型、描述都要填')
  const i = add(p.issues, { id: nextNo('YC'), type: f.type, desc: f.desc, newDate: f.newDate || null, party: f.party || '', status: '待处理', at: clock.today, by: db.me, measure: '' })
  if (f.newDate) p.expect = f.newDate
  act(p, `上报异常：${f.type}${f.newDate ? '，预计交期改为 ' + fd(f.newDate) : ''}`)
  return i
}
function closeIssue(p, i, measure) {
  if (!measure) fail('关闭前要写处理措施')
  Object.assign(i, { measure, status: '已关闭', closedAt: clock.today, closedBy: db.me })
  act(p, '关闭异常：' + i.type)
}
// 领料建议 = 加工数 × BOM 用量 ×（1 + 损耗）− 已领；只算我方采购和客供
function issuePlan(p) {
  const tp = tpOf(p.style, p.ver)
  if (!tp) return []
  const cust = order(p.order)?.customer, acc = {}
  p.lines.forEach((l) => tp.bom.forEach((r) => {
    if (r.src === '工厂自备') return
    const sku = rowSku(r, l.color)
    if (!sku) return
    const owner = r.src === '客供' ? cust || '自有' : '自有'
    const a = (acc[sku + '|' + owner] ||= { sku, owner, src: r.src, need: 0 })
    a.need += l.qty * rowUse(r, l.size) * (1 + r.loss / 100)
  }))
  const docs = db.stockDocs.filter((d) => d.src === p.no && d.status === '已审核')
  return Object.values(acc).map((a) => {
    const issued = rnd(sum(docs.flatMap((d) => d.lines.filter((l) => l.sku === a.sku && l.owner === a.owner).map((l) => (d.type === '退料' ? -l.qty : l.qty)))), 3)
    const need = rnd(a.need, 3)
    return { ...a, need, issued, suggest: Math.max(0, rnd(need - issued, 3)), avail: stockQty('WL01', a.sku, a.owner) }
  })
}
function issueState(p) {
  const plan = issuePlan(p)
  if (!plan.length) return '—'
  if (plan.every((r) => r.issued >= r.need - 0.001)) return '已领齐'
  return plan.some((r) => r.issued > 0) ? '部分领料' : '未领料'
}
function issueMaterials(p, lines) {
  if (!prodLive(p)) fail('加工单审核后才能领料')
  const fw = factoryWh(p.factory)
  if (!fw) fail('这个加工厂还没有工厂仓')
  const ls = lines.filter((l) => l.qty > 0)
  if (!ls.length) fail('至少领一行')
  const short = stockShortage('WL01', ls)
  if (short.length) fail('库存不够，没领成', short)
  const d = createStockDoc({ type: '领料', src: p.no, from: 'WL01', to: fw.code, partner: p.factory, lines: ls })
  postStockDoc(d)
  act(p, '领料 ' + d.no)
  // 订单的加工单都领齐了，算料单自动关闭，释放"本次使用库存"的占用
  const o = order(p.order)
  if (o && o.lines.every((l) => scheduledQty(o, l) >= l.qty) && prodsOf(o).every((x) => issueState(x) === '已领齐'))
    mrpsOf(o).filter((m) => m.status === '已确认').forEach((m) => { m.status = '已关闭'; act(m, '加工单都已领齐料，自动关闭') })
  return d
}
// 回货：lines = { 'KQ|S': { qty, def } }
function registerReturn(p, f) {
  if (!prodLive(p)) fail('加工单审核后才能登记回货')
  const errs = [], got = []
  p.lines.forEach((l) => {
    const x = f.lines[l.color + '|' + l.size]
    const q = +x?.qty || 0, d = +x?.def || 0
    if (!q) return
    if (d > q) errs.push(`${l.color}-${l.size}：次品数不能大于回货数`)
    const cap = Math.floor(l.qty * (1 + OVER))
    if (l.ret + q > cap) errs.push(`${p.style}-${l.color}-${l.size}：加工 ${l.qty} 件，已回 ${l.ret}，最多还能回 ${Math.max(0, cap - l.ret)} 件`)
    got.push({ l, q, d })
  })
  if (!got.length) errs.push('至少登记一个数量')
  if (errs.length) fail('回货没登记上', errs)
  got.forEach(({ l, q, d }) => { l.ret += q; l.def += d })
  const r = add(db.returns, { no: nextNo('HH'), prod: p.no, order: p.order, style: p.style, factory: p.factory, date: f.date || clock.today, wh: f.wh || 'CP01', logistics: f.logistics || '', lines: got.map(({ l, q, d }) => ({ color: l.color, size: l.size, qty: q, def: d })), log: [] })
  act(r, '登记')
  p.status = prodRet(p) >= prodQty(p) * (1 - OVER) ? '已完成' : '部分回货'
  act(p, `回货 ${r.no}：${sum(r.lines, (x) => x.qty)} 件，次品 ${sum(r.lines, (x) => x.def)}${p.status === '已完成' ? '，加工单完成' : ''}`)
  checkOrderDone(order(p.order))
  return r
}
function checkOrderDone(o) {
  if (!o || !orderLive(o)) return
  const ps = prodsOf(o)
  if (ps.length && o.lines.every((l) => scheduledQty(o, l) >= l.qty) && ps.every((p) => ['已完成', '已结案'].includes(p.status))) {
    o.status = '已完成'
    act(o, '全部加工单完成，订单完成')
  }
}

<script>/* 3-ui.js */
/* ============================================================
 * 界面公共件：路由、图标、表格、弹窗、提示……
 * 页面文件用 route() 注册自己的路由，用 expose() 把函数给模板用，
 * 用 SEARCH / TODOS 把自己的东西挂进 ⌘K 搜索和首页待办。
 * ============================================================ */
const G = {} // 模板里能直接用的函数、数据（挂到 app.config.globalProperties）
const expose = (o) => Object.assign(G, o)
const COMPONENTS = {}
const comp = (name, def) => { COMPONENTS[name] = def; return def }

/* ---------- 路由 ---------- */
const ROUTES = []
// meta: { mod: 侧边栏模块 key, t: 标题（字符串或 params => 字符串） }
function route(pat, component, meta) {
  const keys = []
  const re = new RegExp('^' + pat.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)' }) + '$')
  ROUTES.push({ pat, re, keys, comp: component, ...meta })
}
const nav = reactive({ path: '/', query: {}, r: null, params: {}, seq: 0 })
function parseHash() {
  const [path, qs] = (location.hash.slice(1) || '/').split('?')
  nav.path = decodeURIComponent(path)
  nav.query = Object.fromEntries(new URLSearchParams(qs || ''))
  nav.r = null
  nav.params = {}
  for (const r of ROUTES) {
    const m = nav.path.match(r.re)
    if (m) { nav.r = r; nav.params = Object.fromEntries(r.keys.map((k, i) => [k, m[i + 1]])); break }
  }
  nav.seq++
}
window.addEventListener('hashchange', parseHash)
const go = (p) => { location.hash = '#' + p }
const routeTitle = () => { const r = nav.r; if (!r) return '没有这个页面'; return typeof r.t === 'function' ? r.t(nav.params) : r.t }

/* ---------- 提示、确认、出错 ---------- */
const ui = reactive({ toasts: [], err: null, ask: null })
function toast(msg, link, err) {
  const t = { id: Math.random(), msg, link, err }
  ui.toasts.push(t)
  setTimeout(() => { const i = ui.toasts.indexOf(t); if (i >= 0) ui.toasts.splice(i, 1) }, link ? 5000 : 2600)
}
function showErr(e) {
  if (!(e instanceof Err)) { console.error(e); ui.err = { msg: '出错了：' + e.message, list: [] }; return }
  if (e.list.length) ui.err = { msg: e.message, list: e.list }
  else toast(e.message, null, true)
}
// 包一层：动作出错统一弹出；成功返回结果，失败返回 undefined
function run(fn) { try { return fn() ?? true } catch (e) { showErr(e) } }
function ask(title, text, ok = '确定', danger = false) {
  return new Promise((resolve) => { ui.ask = { title, text, ok, danger, resolve } })
}

const TODOS = [] //  () => [{ t, n, to, i, tone }]

const escStack = []
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && escStack.length) { e.preventDefault(); escStack[escStack.length - 1]() } })

const smooth = (pts) => pts.reduce((d, [x, y], i) => {
  if (!i) return `M${x},${y}`
  const [x0, y0] = pts[i - 1], cx = (x0 + x) / 2
  return d + `C${cx},${y0} ${cx},${y} ${x},${y}`
}, '')
comp('AreaChart', {
  props: { series: Array, labels: Array, h: { type: Number, default: 200 } },
  setup(p) {
    const W = 600, L = 40, R = 8, T = 10, B = 22
    const g = computed(() => {
      const max = Math.max(1, ...p.series.flatMap((s) => s.v))
      const step = 10 ** Math.floor(Math.log10(max)), top = Math.ceil(max / step) * step
      const n = p.labels.length, H = p.h
      const x = (i) => L + ((W - L - R) * i) / Math.max(1, n - 1), y = (v) => T + (H - T - B) * (1 - v / top)
      const ticks = [0, 1, 2, 3, 4].map((k) => ({ v: (top * k) / 4, y: y((top * k) / 4) }))
      const lines = p.series.map((s) => { const pts = s.v.map((v, i) => [x(i), y(v)]); const d = smooth(pts); return { ...s, d, area: d + `L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z` } })
      const every = Math.ceil(n / 8)
      return { H, ticks, lines, xs: p.labels.map((t, i) => ({ t, x: x(i), show: i % every === 0 || i === n - 1 })) }
    })
    const fmtK = (v) => (v >= 10000 ? rnd(v / 10000, 1) + '万' : fq(v))
    return { g, W, L, fmtK }
  },
  template: `<div class="chart"><svg :viewBox="'0 0 ' + W + ' ' + g.H" width="100%" :height="g.H" preserveAspectRatio="none">

comp('Matrix', {

  emits: ['update:modelValue'],
  setup(p, { emit }) {
    const s = computed(() => style(p.st))
    const cs = computed(() => p.colors || s.value.colors)
    const zs = computed(() => sizesOf(s.value.sizeGroup))
    const v = (c, z) => p.modelValue[c + '|' + z] || 0
    // 同一拍里连着改几格（粘贴）时 props 还没更新，所以从上次发出的值接着改
    let cur = p.modelValue
    watch(() => p.modelValue, (x) => { cur = x })
    const set = (c, z, x) => { cur = { ...cur, [c + '|' + z]: Math.max(0, parseInt(x) || 0) }; emit('update:modelValue', cur) }
    // 从 Excel 粘一块数字进来：从这一格往右、往下填
    function paste(c, z, e) {
      const rows = e.clipboardData.getData('text').trim().split(/\r?\n/).map((r) => r.split('\t'))
      if (rows.length === 1 && rows[0].length === 1) return
      e.preventDefault()
      const ci = cs.value.indexOf(c), zi = zs.value.indexOf(z)
      rows.forEach((r, i) => r.forEach((x, j) => { const cc = cs.value[ci + i], zz = zs.value[zi + j]; if (cc && zz) set(cc, zz, x) }))
    }
    const rowT = (c) => sum(zs.value, (z) => v(c, z))
    const colT = (z) => sum(cs.value, (c) => v(c, z))
    const all = computed(() => sum(cs.value, rowT))
    return { cs, zs, v, set, paste, rowT, colT, all }
  },
  template: `<table class="mx"><thead><tr><th></th><th v-for="z in zs" :key="z">{{ z }}</th><th class="tot">合计</th></tr></thead>

      <td class="tot">{{ rowT(c) }}</td></tr></tbody>
    <tfoot><tr><td class="dim">合计</td><td v-for="z in zs" :key="z" class="tot">{{ colT(z) }}</td><td class="tot">{{ all }}</td></tr></tfoot></table>`,
})

    const c = color || skuOf(code)?.color || m.skus.find((k) => k.color)?.color
    return MAT_DRAW[matKind(m)](c ? colorOf(c).hex : '#efe8da')
  }
  return garmentSvg('tee', '#d9dcd3')
}
const PIC_CACHE = new Map()
const picSvg = (code, color) => { const k = code + '|' + (color || ''); if (!PIC_CACHE.has(k)) PIC_CACHE.set(k, picOf(code, color)); return PIC_CACHE.get(k) }

comp('Thumb', {
  props: { code: String, s: { type: Number, default: 32 }, color: String },
  setup: (p) => ({ svg: computed(() => picSvg(p.code, p.color)) }),
  template: `<span class="thumb" :style="{ width: s + 'px', height: s + 'px' }"><svg viewBox="0 0 100 100" width="100%" height="100%" v-html="svg"></svg></span>`,
})

/* 大图 + 各颜色的小图，点小图换颜色（款式、样衣、物料详情右侧） */
comp('Gallery', {
