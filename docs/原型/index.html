<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCM 原型 · 服装供应链</title>
<meta name="description" content="SCM 一期可点击原型：假数据，刷新恢复。对应 docs/PRD.md 第 6 章。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2/dist/index.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2/dist/index.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/element-plus@2/dist/locale/zh-cn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2/dist/index.iife.min.js"></script>
<style>
:root {
  /* 靛蓝 */
  --lm-indigo-950: #142038;
  --lm-indigo-900: #1b2a4a; /* 侧边栏底色 */
  --lm-indigo-600: #2d4e8c; /* 主色：主按钮、链接、选中 */
  --lm-indigo-50: #f1f4f9; /* 表格行悬停 */

  /* 栀子黄：明线、待处理 */
  --lm-stitch: #d9a23a; /* 只用在深色底上 */
  --lm-pending-text: #8a5a00;
  --lm-pending-bg: #fbf1da;
  --lm-pending-line: #d9a23a;

  /* 苔绿：完成、启用 */
  --lm-done-text: #2e7350;
  --lm-done-bg: #e6f1ea;
  --lm-done-line: #b9d6c5;

  /* 茜草红：危险、失败 */
  --lm-danger-text: #b4392b;
  --lm-danger-bg: #f8ebea;
  --lm-danger-line: #e3b9b3;

  /* 墨色文字与坯布底 */
  --lm-ink: #1c2230;
  --lm-ink-2: #3b4254;
  --lm-muted: #5b6475;
  --lm-faint: #8a909c; /* 只给占位符、禁用 */
  --lm-line: #dcdfd7;
  --lm-line-soft: #e8eae4;
  --lm-paper: #ffffff;
  --lm-greige: #eef0eb;
  --lm-greige-2: #f6f7f3; /* 表头 */

  /* 侧边栏 */
  --lm-side-text: #c3cde0;
  --lm-side-text-dim: #8c9ab6;
  /* 斜纹：135° 的细线，像牛仔布的斜纹组织 */
  --lm-twill: repeating-linear-gradient(135deg, rgb(255 255 255 / 3.5%) 0 1px, transparent 1px 5px);

  /* 字体：中文用系统字体；数字、编码用 Barlow（只含拉丁字符，中文会自动落回系统字体） */
  --lm-font: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', system-ui, sans-serif;
  --lm-font-num: 'Barlow', var(--lm-font);

  /* 尺寸 */
  --lm-side-width: 216px;
  --lm-side-width-collapsed: 64px;
  --lm-header-height: 48px;
  --lm-radius: 4px;
  --lm-radius-panel: 6px;

  /* ---------- Element Plus 主题：把它的变量换成上面的颜色 ---------- */
  --el-color-primary: #2d4e8c;
  --el-color-primary-light-3: #6c83ae;
  --el-color-primary-light-5: #96a6c6;
  --el-color-primary-light-7: #c0cadc;
  --el-color-primary-light-8: #d5dce8;
  --el-color-primary-light-9: #eaedf4;
  --el-color-primary-dark-2: #243e70;

  --el-color-success: #2e7350;
  --el-color-success-light-3: #6d9d84;
  --el-color-success-light-5: #96b9a8;
  --el-color-success-light-7: #c0d5ca;
  --el-color-success-light-8: #d5e3dc;
  --el-color-success-light-9: #eaf1ee;
  --el-color-success-dark-2: #255c40;

  --el-color-warning: #94660c;
  --el-color-warning-light-3: #b49455;
  --el-color-warning-light-5: #cab286;
  --el-color-warning-light-7: #dfd1b6;
  --el-color-warning-light-8: #eae0ce;
  --el-color-warning-light-9: #f4f0e7;
  --el-color-warning-dark-2: #76520a;

  --el-color-danger: #b4392b;
  --el-color-danger-light-3: #ca746b;
  --el-color-danger-light-5: #da9c95;
  --el-color-danger-light-7: #e8c4bf;
  --el-color-danger-light-8: #f0d7d5;
  --el-color-danger-light-9: #f8ebea;
  --el-color-danger-dark-2: #902e22;

  --el-color-info: #677083;
  --el-color-info-light-3: #959ba8;
  --el-color-info-light-5: #b3b8c1;
  --el-color-info-light-7: #d1d4da;
  --el-color-info-light-8: #e1e2e6;
  --el-color-info-light-9: #f0f1f3;
  --el-color-info-dark-2: #525a69;

  --el-font-family: var(--lm-font);
  --el-text-color-primary: var(--lm-ink);
  --el-text-color-regular: var(--lm-ink-2);
  --el-text-color-secondary: var(--lm-muted);
  --el-text-color-placeholder: var(--lm-faint);
  --el-border-color: var(--lm-line);
  --el-border-color-light: var(--lm-line-soft);
  --el-border-color-lighter: var(--lm-line-soft);
  --el-border-color-extra-light: #f0f1ed;
  --el-bg-color-page: var(--lm-greige);
  --el-fill-color-light: var(--lm-greige-2);
  --el-fill-color-lighter: #fafbf8;
  --el-border-radius-base: var(--lm-radius);
  --el-border-radius-small: 3px;
}

/* ---------- 基础（照 SCM web/src/styles/base.css） ---------- */
html,
body,
#app {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--lm-font);
  font-size: 14px;
  line-height: 1.5;
  color: var(--lm-ink);
  background: var(--lm-greige);
  -webkit-font-smoothing: antialiased;
}

.num {
  font-family: var(--lm-font-num);
  font-variant-numeric: tabular-nums;
}

.code {
  font-family: var(--lm-font-num);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}

.muted {
  color: var(--lm-muted);
}

.page {
  padding: 20px 24px 28px;
}

.panel {
  background: var(--lm-paper);
  border: 1px solid var(--lm-line);
  border-radius: var(--lm-radius-panel);
}

.panel + .panel {
  margin-top: 16px;
}

.panel-body {
  padding: 16px 20px 20px;
}

.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 20px 0;
}

.panel-title h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}

.panel-title .hint {
  font-size: 12px;
  color: var(--lm-muted);
}

.pagination {
  margin-top: 16px;
  justify-content: flex-end;
}

.el-table {
  --el-table-header-bg-color: var(--lm-greige-2);
  --el-table-header-text-color: var(--lm-muted);
  --el-table-row-hover-bg-color: var(--lm-indigo-50);
  --el-table-border-color: var(--lm-line-soft);
}

.el-table th.el-table__cell {
  font-size: 13px;
  font-weight: 600;
}

.el-table .el-table__cell {
  padding: 10px 0;
}

.el-table .cell.num,
.el-table td.num .cell,
.el-table th.num .cell {
  font-family: var(--lm-font-num);
  font-variant-numeric: tabular-nums;
}

.el-table td.code .cell {
  font-family: var(--lm-font-num);
  font-weight: 500;
}

.el-dialog__title {
  font-size: 16px;
  font-weight: 600;
}

.el-button + .el-button.is-link {
  margin-left: 14px;
}

:focus-visible {
  outline: 2px solid var(--lm-indigo-600);
  outline-offset: 2px;
}

a.link {
  color: var(--lm-indigo-600);
  text-decoration: none;
  cursor: pointer;
}

a.link:hover {
  text-decoration: underline;
}

/* ---------- 外框 ---------- */
.shell {
  display: flex;
  height: 100%;
}

.shell-main {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
}

.shell-content {
  flex: 1;
  overflow: auto;
}

/* ---------- 侧边栏：靛蓝斜纹（照 AppSidebar.vue） ---------- */
.sidebar {
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  width: var(--lm-side-width);
  color: var(--lm-side-text);
  background: var(--lm-twill), var(--lm-indigo-900);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  height: 56px;
  padding: 0 20px;
  line-height: 56px;
  border-bottom: 1px solid rgb(255 255 255 / 6%);
}

.brand-en {
  font-family: var(--lm-font-num);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--lm-stitch);
}

.brand-cn {
  font-size: 13px;
  letter-spacing: 0.06em;
  color: #fff;
}

.side-search {
  padding: 12px 12px 4px;
}

.side-search .el-input__wrapper {
  background: rgb(255 255 255 / 7%);
  box-shadow: none;
}

.side-search .el-input__wrapper.is-focus {
  box-shadow: 0 0 0 1px var(--lm-stitch) inset;
}

.side-search .el-input__inner {
  color: #fff;
}

.side-search .el-input__inner::placeholder,
.side-search .el-input__prefix {
  color: var(--lm-side-text-dim);
}

.nav {
  flex: 1;
  overflow: hidden auto;
  padding: 4px 0 8px;
}

.nav .el-menu {
  --el-menu-bg-color: transparent;
  --el-menu-text-color: var(--lm-side-text);
  --el-menu-hover-text-color: #fff;
  --el-menu-hover-bg-color: rgb(255 255 255 / 6%);
  --el-menu-active-color: #fff;
  --el-menu-item-height: 36px;
  --el-menu-sub-item-height: 32px;
  --el-menu-base-level-padding: 20px;
  --el-menu-level-padding: 16px;

  border-right: none;
}

.nav .el-sub-menu.is-active > .el-sub-menu__title {
  color: #fff;
}

.nav .el-menu-item.is-active {
  position: relative;
  font-weight: 600;
  background: rgb(255 255 255 / 7%);
}

.nav .el-menu-item.is-active::after {
  position: absolute;
  inset: 3px 10px;
  pointer-events: none;
  content: '';
  border: 1px dashed var(--lm-stitch);
  border-radius: 4px;
}

.nav .phase {
  margin-left: 8px;
  padding: 0 5px;
  font-size: 11px;
  line-height: 16px;
  color: var(--lm-side-text-dim);
  border: 1px dashed rgb(217 162 58 / 60%);
  border-radius: 3px;
}

.side-foot {
  padding: 10px 20px 14px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--lm-side-text-dim);
  border-top: 1px solid rgb(255 255 255 / 6%);
}

/* ---------- 顶栏 + 页签（照 AppHeader.vue、TabsBar.vue） ---------- */
.app-header {
  display: flex;
  flex-shrink: 0;
  align-items: stretch;
  justify-content: space-between;
  height: var(--lm-header-height);
  background: var(--lm-paper);
  border-bottom: 1px solid var(--lm-line);
}

.app-header .right {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  gap: 10px;
  padding: 0 16px 0 8px;
  font-size: 13px;
  color: var(--lm-ink-2);
}

.proto-badge {
  padding: 0 8px;
  font-size: 12px;
  line-height: 22px;
  color: var(--lm-pending-text);
  background: var(--lm-pending-bg);
  border: 1px dashed var(--lm-pending-line);
  border-radius: 3px;
}

.tabs {
  display: flex;
  flex: 1;
  align-items: stretch;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}

.tab {
  position: relative;
  display: flex;
  flex-shrink: 0;
  align-items: center;
  border-right: 1px solid var(--lm-line-soft);
}

.tab a {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 16px;
  font-size: 13px;
  color: var(--lm-muted);
  text-decoration: none;
  cursor: pointer;
}

.tab.closable a {
  padding-right: 4px;
}

.tab a:hover {
  color: var(--lm-ink);
}

.tab.active a {
  font-weight: 600;
  color: var(--lm-ink);
}

.tab.active::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 2px;
  content: '';
  background: var(--lm-indigo-600);
}

.tab .close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  margin-right: 10px;
  padding: 0;
  font-size: 12px;
  color: var(--lm-faint);
  cursor: pointer;
  background: none;
  border: 0;
  border-radius: 3px;
}

.tab .close:hover {
  color: var(--lm-ink);
  background: var(--lm-greige);
}

/* ---------- 通用件（照 PageHeader / StatusTag / FilterBar / BlankState） ---------- */
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

.page-header h1 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}

.page-header p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--lm-muted);
}

.page-header .actions {
  display: flex;
  flex-shrink: 0;
  flex-wrap: wrap;
  gap: 8px;
}

.page-header .actions .el-button + .el-button {
  margin-left: 0;
}

.phase-tag {
  padding: 0 7px;
  font-size: 12px;
  font-weight: 400;
  line-height: 20px;
  color: var(--lm-pending-text);
  background: var(--lm-pending-bg);
  border: 1px dashed var(--lm-pending-line);
  border-radius: 3px;
}

.status-tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  font-size: 12px;
  line-height: 1;
  white-space: nowrap;
  border: 1px solid;
  border-radius: 3px;
}

.status-tag.done {
  color: var(--lm-done-text);
  background: var(--lm-done-bg);
  border-color: var(--lm-done-line);
}

.status-tag.pending {
  color: var(--lm-pending-text);
  background: var(--lm-pending-bg);
  border-style: dashed;
  border-color: var(--lm-pending-line);
}

/* 进行中：靛蓝虚线（还在缝，没收线） */
.status-tag.doing {
  color: var(--lm-indigo-600);
  background: var(--lm-indigo-50);
  border-style: dashed;
  border-color: var(--el-color-primary-light-5);
}

.status-tag.off {
  color: var(--lm-muted);
  background: var(--lm-greige-2);
  border-style: dashed;
  border-color: #b7bcc4;
}

.status-tag.danger {
  color: var(--lm-danger-text);
  background: var(--lm-danger-bg);
  border-color: var(--lm-danger-line);
}

.filter-bar {
  padding: 16px 20px 2px;
  border-bottom: 1px solid var(--lm-line-soft);
}

.filter-bar .el-form-item {
  margin: 0 20px 14px 0;
}

.filter-bar .el-input,
.filter-bar .el-select {
  width: 180px;
}

.status-tabs {
  padding: 0 20px;
  border-bottom: 1px solid var(--lm-line-soft);
}

.status-tabs .el-tabs__header {
  margin: 0;
}

.status-tabs .el-tabs__nav-wrap::after {
  display: none;
}

.proto-note {
  margin: 18px 2px 0;
  font-size: 12px;
  color: var(--lm-faint);
}

.proto-note b {
  font-weight: 500;
  color: var(--lm-muted);
}

.blank-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 24px;
  text-align: center;
}

.hang-tag {
  position: relative;
  width: 52px;
  height: 72px;
  margin-bottom: 16px;
  background: var(--lm-paper);
  border: 1.5px dashed #b7bcc4;
  border-radius: 6px 6px 8px 8px;
  transform: rotate(-6deg);
}

.hang-tag::before {
  position: absolute;
  top: 9px;
  left: 50%;
  width: 9px;
  height: 9px;
  content: '';
  border: 1.5px solid #b7bcc4;
  border-radius: 50%;
  transform: translateX(-50%);
}

.blank-state h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.blank-state p {
  max-width: 30em;
  margin: 6px 0 0;
  color: var(--lm-muted);
}

/* ---------- 小部件 ---------- */
.swatch {
  display: inline-block;
  width: 14px;
  height: 14px;
  margin-right: 6px;
  vertical-align: -2px;
  border: 1px solid var(--lm-line);
  border-radius: 3px;
}

.color-chip {
  display: inline-flex;
  align-items: center;
  margin: 0 8px 4px 0;
  font-size: 13px;
  white-space: nowrap;
}

.thumb {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--lm-greige-2);
  border: 1px solid var(--lm-line-soft);
  border-radius: var(--lm-radius);
}

.desc-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px 24px;
  margin: 0;
}

.desc-grid > div {
  min-width: 0;
}

.desc-grid dt {
  font-size: 12px;
  color: var(--lm-muted);
}

.desc-grid dd {
  margin: 2px 0 0;
  overflow-wrap: anywhere;
}

.desc-grid .wide {
  grid-column: span 2;
}

.desc-grid .full {
  grid-column: 1 / -1;
}

.flow-bar {
  display: flex;
  align-items: center;
  gap: 0;
  margin: 2px 0 16px;
  padding: 12px 20px;
  font-size: 13px;
  background: var(--lm-paper);
  border: 1px solid var(--lm-line);
  border-radius: var(--lm-radius-panel);
}

.flow-step {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--lm-faint);
}

.flow-step .dot {
  width: 9px;
  height: 9px;
  border: 1.5px solid currentcolor;
  border-radius: 50%;
}

.flow-step.done {
  color: var(--lm-done-text);
}

.flow-step.done .dot {
  background: currentcolor;
}

.flow-step.current {
  font-weight: 600;
  color: var(--lm-indigo-600);
}

.flow-step.current .dot {
  background: var(--lm-indigo-50);
  border-style: dashed;
}

.flow-line {
  flex: 1;
  min-width: 18px;
  height: 0;
  margin: 0 10px;
  border-top: 1px dashed var(--lm-line);
}

.flow-line.done {
  border-top: 1px solid var(--lm-done-line);
}

/* 颜色 × 尺码矩阵 */
.matrix {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.matrix th,
.matrix td {
  padding: 7px 10px;
  text-align: right;
  border-bottom: 1px solid var(--lm-line-soft);
}

.matrix th {
  font-weight: 600;
  color: var(--lm-muted);
  background: var(--lm-greige-2);
}

.matrix th:first-child,
.matrix td:first-child {
  text-align: left;
}

.matrix td {
  font-family: var(--lm-font-num);
  font-variant-numeric: tabular-nums;
}

.matrix td:first-child {
  font-family: var(--lm-font);
}

.matrix .total {
  font-weight: 600;
  background: var(--lm-greige-2);
}

.matrix .el-input-number {
  width: 92px;
}

.matrix .sub {
  display: block;
  font-size: 11px;
  color: var(--lm-muted);
}

/* 进度节点时间线 */
.nodes {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
}

.node {
  position: relative;
  padding: 12px 12px 10px;
  font-size: 12px;
  background: var(--lm-paper);
  border: 1px dashed var(--lm-line);
  border-radius: var(--lm-radius-panel);
}

.node h3 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 600;
}

.node .row {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  color: var(--lm-muted);
}

.node .row b {
  font-family: var(--lm-font-num);
  font-weight: 500;
  color: var(--lm-ink-2);
}

.node .row b.late {
  color: var(--lm-danger-text);
}

.node .bar {
  height: 4px;
  margin-top: 8px;
  overflow: hidden;
  background: var(--lm-greige);
  border-radius: 2px;
}

.node .bar i {
  display: block;
  height: 100%;
  background: var(--lm-indigo-600);
}

.node.done {

const matOf = (code) => db.materials.find((m) => m.code === code)
const styleOf = (code) => db.styles.find((s) => s.code === code)

const prodOf = (no) => db.production.find((p) => p.no === no)
const purchaseOf = (no) => db.purchases.find((p) => p.no === no)
const sampleOf = (no) => db.samples.find((s) => s.no === no)

function skuInfo(sku) {
  for (const m of db.materials) {
    const s = m.skus.find((x) => x.sku === sku)
    if (s) return { mat: m, sku: s }
  }
  return { mat: null, sku: null }
}

function skuLabel(sku) {
  const { mat, sku: s } = skuInfo(sku)
  if (!mat) return sku || '—'
  const tail = [s.color ? colorOf(s.color).name : '', s.spec].filter(Boolean).join(' ')
  return mat.name + (tail ? ' · ' + tail : '')
}

const sumValues = (obj) => Object.values(obj || {}).reduce((a, b) => a + (Number(b) || 0), 0)
const matrixTotal = (qty) => Object.values(qty || {}).reduce((a, sizes) => a + sumValues(sizes), 0)
const orderQty = (o) => o.lines.reduce((a, l) => a + matrixTotal(l.qty), 0)
const orderAmount = (o) => o.lines.reduce((a, l) => a + matrixTotal(l.qty) * l.price, 0)
const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000)
const daysLeft = (d) => days(TODAY, d)

function packsOf(style) {
  return db.packs[style] || []
}

function packOf(style, ver) {
  return packsOf(style).find((p) => p.ver === ver)
}

function effectivePack(style) {
  return packsOf(style).find((p) => p.status === '已生效')
}

const TONES = {
  done: ['已审核', '已完成', '已到齐', '合作中', '启用', '已生效', '通过', '已转大货', '已关闭', '已结案', '已评审', '已入库'],
  pending: ['待审核', '待排单', '待评审', '待准入', '待处理', '待派单', '改版'],
  doing: ['生产中', '打样中', '处理中', '部分到货', '部分回货', '开发中', '已下单'],
  off: ['草稿', '停用', '已作废', '已淘汰', '已取消', '淘汰'],
  danger: ['黑名单', '延期', '逾期'],
}

function toneOf(status) {
  for (const [tone, list] of Object.entries(TONES)) if (list.includes(status)) return tone
  return 'off'
}

/* 生产节点：是否延期、进度 */
function nodeState(n) {
  if (n.ae) return days(n.pe, n.ae) > 0 ? 'done-late' : 'done'
  if (n.as) return n.pe < TODAY ? 'late' : 'doing'
  if (n.ps < TODAY) return 'late'
  return 'todo'
}

function prodCurrentNode(p) {
  return p.nodes.find((n) => !n.ae) || null
}

function prodLate(p) {
  if (p.status === '已完成') return false
  return p.nodes.some((n) => nodeState(n) === 'late') || p.due < TODAY
}

function prodReceived(p) {
  return matrixTotal(p.received)
}

function prodProgress(p) {
  const total = matrixTotal(p.qty)
  if (!total) return 0
  const doneNodes = p.nodes.filter((n) => n.ae).length
  const cur = prodCurrentNode(p)
  const partial = cur && cur.as ? Math.min(cur.qty / total, 0.95) : 0
  return Math.round(((doneNodes + partial) / p.nodes.length) * 100)
}

/* ---------------- 算料 ---------------- */
function availableStock(sku, owner) {
  return db.stock
    .filter((r) => r.sku === sku && r.owner === owner && whOf(r.wh)?.type === '物料仓')
    .reduce((a, r) => a + r.qty, 0)
}

function inTransit(sku) {
  return db.purchases
    .filter((p) => ['已审核', '部分到货'].includes(p.status))
    .flatMap((p) => p.lines)
    .filter((l) => l.sku === sku)
    .reduce((a, l) => a + Math.max(0, l.qty - l.inQty), 0)
}

function computeMrp(orderNos) {
  const rows = new Map()
  const issues = []
  for (const no of orderNos) {
    const o = orderOf(no)
    if (!o) continue
    for (const line of o.lines) {
      const pack = line.pack ? packOf(line.style, line.pack) : effectivePack(line.style)
      if (!pack) {
        issues.push(`${line.style} 还没有已生效的资料包，这一款没算进来`)
        continue
      }
      for (const [color, sizes] of Object.entries(line.qty)) {
        for (const [size, q] of Object.entries(sizes)) {
          if (!q) continue
          for (const b of pack.bom) {
            const sku = b.colorMode === '随款色' ? b.colorMap[color] : b.fixedSku
            if (!sku) {
              const msg = `${line.style} 的「${b.part}」没配 ${colorOf(color).name} 用哪个物料颜色`
              if (!issues.includes(msg)) issues.push(msg)
              continue
            }
            const u = b.qtyMode === '分码' ? b.usage[size] : b.usage
            const owner = b.source === '客供' ? o.customer || '自有' : '自有'
            const key = sku + '|' + b.source + '|' + owner
            let r = rows.get(key)
            if (!r) {
              const { mat } = skuInfo(sku)
              r = { key, sku, mat, source: b.source, owner, parts: new Set(), orders: new Set(), gross: 0, withLoss: 0, loss: b.loss, prep: 0 }
              rows.set(key, r)
            }
            r.parts.add(b.part)
            r.orders.add(no)
            r.gross += q * u
            r.withLoss += q * u * (1 + b.loss / 100)
          }
        }
      }
    }
  }
  const list = [...rows.values()].map((r) => {
    const available = r.source === '加工厂自备' ? 0 : availableStock(r.sku, r.owner)
    const transit = r.source === '我方采购' ? inTransit(r.sku) : 0
    return reactive({
      ...r,
      parts: [...r.parts].join('、'),
      orders: [...r.orders],
      gross: round4(r.gross),
      withLoss: round4(r.withLoss),
      available,
      transit,
      useTransit: 0, // 在途只作参考，默认不扣（PRD §6.6.1）
      use: null, // null = 默认取 min(可用库存, 需求)
      checked: true,
    })
  })
  return { rows: list, issues }
}

function mrpNeed(r) {
  return round4(r.withLoss * (1 + (r.prep || 0) / 100))
}

function mrpUse(r) {
  return r.use === null ? Math.min(r.available, mrpNeed(r)) : r.use
}

function mrpNet(r) {
  return Math.max(0, round4(mrpNeed(r) - mrpUse(r) - (r.useTransit || 0)))
}

function mrpSuggest(r) {
  const net = mrpNet(r)
  if (net <= 0 || !r.mat) return 0
  const inBuyUnit = Math.ceil(round4(net / (r.mat.rate || 1)))
  return Math.max(inBuyUnit, r.mat.moq || 0)
}

/* 颜色 × 尺码矩阵。editable 时可以直接改数量；received 传进来时每格下面小字显示已回货 */
const QtyMatrix = {
  props: { qty: Object, sizes: Array, editable: Boolean, received: Object, colorOrder: Array },
  computed: {
    colors() {
      return this.colorOrder || Object.keys(this.qty || {})
    },
    total() {
      return matrixTotal(this.qty)
    },
  },
  methods: {
    rowTotal(c) {
      return sumValues(this.qty[c])
    },
    colTotal(s) {
      return this.colors.reduce((a, c) => a + (Number(this.qty[c]?.[s]) || 0), 0)
    },
    rec(c, s) {
      return this.received?.[c]?.[s] ?? 0
    },
    fmtQ,
  },
  components: { ColorChip },
  template: `
    <table class="matrix">
      <thead>
        <tr>
          <th>颜色 \\ 尺码</th>
          <th v-for="s in sizes" :key="s">{{ s }}</th>
          <th>合计</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="c in colors" :key="c">
          <td><ColorChip :code="c" /></td>
          <td v-for="s in sizes" :key="s">
            <el-input-number v-if="editable" v-model="qty[c][s]" :min="0" :step="10" size="small" controls-position="right" />
            <template v-else>
              {{ fmtQ(qty[c]?.[s] ?? 0) }}
              <span v-if="received" class="sub">回 {{ rec(c, s) }}</span>
            </template>
          </td>
          <td class="total">{{ fmtQ(rowTotal(c)) }}</td>
        </tr>
        <tr>
          <td class="total">合计</td>
          <td v-for="s in sizes" :key="s" class="total">{{ fmtQ(colTotal(s)) }}</td>
          <td class="total">{{ fmtQ(total) }}</td>
        </tr>
      </tbody>
    </table>`,
}

/* ---------------- 物料档案 ---------------- */
function blankMaterial() {
  return { code: '', name: '', cat: '', type: '面料', unit: '米', buyUnit: '米', rate: 1, width: null, gsm: null, comp: '', supplier: '', supplierNo: '', price: null, moq: null, lead: null, status: '启用', skus: [] }
}

const MaterialsPage = page({
  props: ['params', 'query'],
  data: () => ({
    cat: '',
    q: { keyword: '', supplier: '', status: '' },
    applied: { keyword: '', supplier: '', status: '' },
    drawer: false,
    form: blankMaterial(),
    editing: null,
    page: 1,
  }),
  computed: {
    tree() {
      return [{ id: '', label: '全部物料', children: db.materialCategories }]
    },
    list() {
      const { keyword, supplier, status } = this.applied
      return db.materials.filter((m) => {
        if (this.cat && !(m.cat === this.cat || m.cat.startsWith(this.cat + '-'))) return false
        if (keyword && !(m.code + m.name + m.supplierNo).includes(keyword)) return false
        if (supplier && m.supplier !== supplier) return false
        if (status && m.status !== status) return false
        return true
      })
    },
    selectableSuppliers() {
      return db.suppliers
    },
  },
  methods: {
    catName(id) {
      const all = db.materialCategories.flatMap((c) => [c, ...(c.children || []).map((x) => ({ ...x, label: c.label + ' / ' + x.label }))])
      return all.find((c) => c.id === id)?.label || '—'
    },
    search() {
      this.applied = { ...this.q }
    },
    reset() {
      this.q = { keyword: '', supplier: '', status: '' }
      this.search()
    },
    openCreate() {
      this.editing = null
      this.form = blankMaterial()
      this.form.cat = this.cat || 'FAB-W'
      this.drawer = true
    },
    openEdit(m) {
      this.editing = m
      this.form = JSON.parse(JSON.stringify(m))
      this.drawer = true
    },
    addSku() {
      this.form.skus.push({ sku: '', color: '', colorNo: '', spec: '', safety: 0, isNew: true })
    },
    skuCode(s) {
      const base = this.form.code || '（物料编码）'
      return [base, s.color, s.color ? '' : s.spec].filter(Boolean).join('-') || base
    },
    used(s) {
      return db.stock.some((r) => r.sku === s.sku) || Object.values(db.packs).flat().some((p) => p.bom.some((b) => b.fixedSku === s.sku || Object.values(b.colorMap || {}).includes(s.sku)))
    },
    removeSku(i) {
      this.form.skus.splice(i, 1)
    },
    save() {
      if (!this.form.name) return ElMessage.warning('名称要填')
      if (this.editing) {
        Object.assign(this.editing, JSON.parse(JSON.stringify(this.form)))
        this.editing.skus.forEach((s) => (s.sku = s.sku || [this.editing.code, s.color || s.spec].join('-')))
        ElMessage.success('保存好了')
      } else {
        const prefix = { 面料: 'ML', 里料: 'ML', 辅料: 'FL', 标签吊牌: 'BQ', 包材: 'BC' }[this.form.type] || 'ML'
        const n = db.materials.filter((m) => m.code.startsWith(prefix)).length + 1
        this.form.code = prefix + String(n).padStart(4, '0')
        this.form.skus.forEach((s) => (s.sku = [this.form.code, s.color || s.spec].join('-')))
        db.materials.unshift(JSON.parse(JSON.stringify(this.form)))
        ElMessage.success(`建好了，编码 ${this.form.code}`)
      }
      this.drawer = false
    },
    toggle(m) {
      const stop = m.status === '启用'
      ElMessageBox.confirm(stop ? `停用后，新的 BOM、采购单里选不到「${m.name}」；已有单据和库存不受影响。` : `启用「${m.name}」？`, stop ? '停用物料' : '启用物料', { confirmButtonText: stop ? '停用' : '启用', cancelButtonText: '取消', type: 'warning' })
        .then(() => {
          m.status = stop ? '停用' : '启用'
          ElMessage.success(stop ? '已停用' : '已启用')
        })
        .catch(() => {})
    },
    firstHex(m) {
      return colorOf(m.skus[0]?.color).hex
    },
  },
  template: `
  <div class="page">
    <PageHeader title="物料档案" description="面料、里料、辅料、标签吊牌、包材统一建档。一个物料按颜色、规格分 SKU，BOM、采购、库存都落到 SKU。">
      <template #actions>
        <el-button icon="Upload" @click="proto('弹出导入向导：下载模板 → 填好上传 → 先预览错误行，确认后才导入。旧系统导出的物料表按这个模板转一次')">从 Excel 导入</el-button>
        <el-button type="primary" icon="Plus" @click="openCreate">新增物料</el-button>
      </template>
    </PageHeader>
    <div class="split">
      <aside class="panel tree-panel">
        <h2>物料分类</h2>
        <el-tree :data="tree" node-key="id" default-expand-all highlight-current :current-node-key="cat" :expand-on-click-node="false" @node-click="(n) => (cat = n.id)" />
      </aside>
      <section class="panel">
        <el-form class="filter-bar" inline @submit.prevent="search">
          <el-form-item label="关键字"><el-input v-model="q.keyword" clearable placeholder="编码、名称、供应商货号" /></el-form-item>
          <el-form-item label="供应商">
            <el-select v-model="q.supplier" clearable filterable placeholder="全部">
              <el-option v-for="s in db.suppliers" :key="s.id" :label="s.short" :value="s.id" />
            </el-select>
          </el-form-item>
          <el-form-item label="状态">
            <el-select v-model="q.status" clearable placeholder="全部" style="width:110px"><el-option label="启用" value="启用" /><el-option label="停用" value="停用" /></el-select>
          </el-form-item>
          <el-form-item><el-button type="primary" native-type="submit">查询</el-button><el-button @click="reset">重置</el-button></el-form-item>
        </el-form>
        <div class="panel-body">
          <el-table :data="list" empty-text="这个分类下还没有物料，或者没有符合条件的">
            <el-table-column width="60"><template #default="{ row }"><span class="thumb" :style="{ width: '34px', height: '34px', background: firstHex(row) }"></span></template></el-table-column>
            <el-table-column prop="code" label="物料编码" width="96" class-name="code" />
            <el-table-column label="名称" min-width="190"><template #default="{ row }">{{ row.name }}<div class="muted" style="font-size:12px">{{ [catName(row.cat), row.comp, row.width && row.width + 'cm', row.gsm && row.gsm + 'g'].filter(Boolean).join(' · ') }}</div></template></el-table-column>
            <el-table-column label="单位" width="84"><template #default="{ row }">{{ row.unit }}<span v-if="row.buyUnit !== row.unit" class="muted" style="font-size:12px"><br>采购按{{ row.buyUnit }}</span></template></el-table-column>
            <el-table-column label="默认供应商" min-width="110"><template #default="{ row }">{{ supName(row.supplier) }}<div class="muted code" style="font-size:12px">{{ row.supplierNo }}</div></template></el-table-column>
            <el-table-column label="参考单价" width="96" align="right" class-name="num"><template #default="{ row }">{{ row.price ? money(row.price) : '—' }}</template></el-table-column>
            <el-table-column label="SKU" width="64" align="right" class-name="num"><template #default="{ row }">{{ row.skus.length }}</template></el-table-column>
            <el-table-column label="状态" width="80"><template #default="{ row }"><StatusTag :status="row.status" /></template></el-table-column>
            <el-table-column label="操作" width="120"><template #default="{ row }">
              <el-button link type="primary" @click="openEdit(row)">编辑</el-button>
              <el-button link :type="row.status === '启用' ? 'danger' : 'primary'" @click="toggle(row)">{{ row.status === '启用' ? '停用' : '启用' }}</el-button>
            </template></el-table-column>
          </el-table>
          <el-pagination class="pagination" layout="total, sizes, prev, pager, next" :total="list.length" :page-size="20" />
        </div>
      </section>
    </div>

    <el-drawer v-model="drawer" :title="editing ? '编辑物料 ' + editing.code : '新增物料'" size="62%">
      <el-form :model="form" label-width="96px">
        <el-row :gutter="16">
          <el-col :span="12"><el-form-item label="物料编码"><el-input v-model="form.code" disabled placeholder="保存后按 分类码 + 4 位流水 生成" /></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="名称" required><el-input v-model="form.name" placeholder="如 220g 斜纹棉" /></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="类型"><el-select v-model="form.type"><el-option v-for="t in ['面料','里料','辅料','标签吊牌','包材']" :key="t" :label="t" :value="t" /></el-select></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="分类"><el-tree-select v-model="form.cat" :data="db.materialCategories" node-key="id" :props="{ label: 'label', value: 'id' }" check-strictly default-expand-all /></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="库存单位"><el-select v-model="form.unit"><el-option v-for="u in ['米','码','公斤','个','条','套','卷']" :key="u" :label="u" :value="u" /></el-select></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="采购单位"><el-select v-model="form.buyUnit"><el-option v-for="u in ['米','码','公斤','个','条','套','卷']" :key="u" :label="u" :value="u" /></el-select></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="换算"><el-input-number v-model="form.rate" :min="0.0001" :precision="4" :controls="false" style="width:100%" /></el-form-item></el-col>
          <el-col :span="24" style="margin:-10px 0 8px 96px" class="muted"><small>1 {{ form.buyUnit }} = {{ form.rate }} {{ form.unit }}。BOM、库存按库存单位记，采购单按采购单位下，入库时自动换算。</small></el-col>
          <el-col :span="8"><el-form-item label="门幅 (cm)"><el-input-number v-model="form.width" :controls="false" style="width:100%" /></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="克重 (g/㎡)"><el-input-number v-model="form.gsm" :controls="false" style="width:100%" /></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="成分"><el-input v-model="form.comp" placeholder="如 100% 棉" /></el-form-item></el-col>
          <el-col :span="12"><el-form-item label="默认供应商">
            <el-select v-model="form.supplier" filterable clearable placeholder="算料后按它分采购单">
              <el-option v-for="s in db.suppliers" :key="s.id" :label="s.short + (['停用','黑名单'].includes(s.status) ? '（' + s.status + '，不能选）' : '')" :value="s.id" :disabled="['停用','黑名单'].includes(s.status)" />
            </el-select>
          </el-form-item></el-col>
          <el-col :span="12"><el-form-item label="供应商货号"><el-input v-model="form.supplierNo" /></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="参考单价"><el-input-number v-model="form.price" :precision="2" :controls="false" style="width:100%" /></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="起订量"><el-input-number v-model="form.moq" :controls="false" style="width:100%" /></el-form-item></el-col>
          <el-col :span="8"><el-form-item label="采购周期(天)"><el-input-number v-model="form.lead" :controls="false" style="width:100%" /></el-form-item></el-col>
        </el-row>
        <div class="panel-title" style="padding:6px 0 10px"><h2>SKU（颜色 / 规格）</h2><el-button size="small" icon="Plus" @click="addSku">加一个颜色或规格</el-button></div>
        <el-table :data="form.skus" size="small" empty-text="还没有 SKU。面料按颜色加，拉链纽扣这类按规格加。">
          <el-table-column label="颜色" width="150"><template #default="{ row }"><el-select v-model="row.color" size="small" clearable placeholder="无颜色"><el-option v-for="c in db.colors" :key="c.code" :label="c.name + ' ' + c.code" :value="c.code" /></el-select></template></el-table-column>
          <el-table-column label="供应商色号" width="140"><template #default="{ row }"><el-input v-model="row.colorNo" size="small" /></template></el-table-column>
          <el-table-column label="规格" width="110"><template #default="{ row }"><el-input v-model="row.spec" size="small" placeholder="如 60cm" /></template></el-table-column>
          <el-table-column label="SKU 编码" min-width="130"><template #default="{ row }"><span class="code">{{ row.sku || skuCode(row) }}</span></template></el-table-column>
          <el-table-column label="安全库存" width="110"><template #default="{ row }"><el-input-number v-model="row.safety" size="small" :min="0" :controls="false" style="width:90px" /></template></el-table-column>
          <el-table-column label="" width="90"><template #default="{ row, $index }">
            <el-tooltip v-if="!row.isNew && used(row)" content="已经有库存或被 BOM 用到，不能删，只能停用" placement="top"><el-button link disabled>删除</el-button></el-tooltip>
            <el-button v-else link type="danger" @click="removeSku($index)">删除</el-button>
          </template></el-table-column>
        </el-table>
      </el-form>
      <template #footer><el-button @click="drawer = false">取消</el-button><el-button type="primary" @click="save">保存</el-button></template>
    </el-drawer>
    <ProtoNote sec="§6.1 基础资料">一物一码：同一供应商、同一货号和色号不能建第二个物料 SKU，保存时会提示已有的那一个。</ProtoNote>
  </div>`,
})

const SupplierPage = page({
  props: ['params', 'query'],
  data: () => ({ tab: '全部', keyword: '', cat: '', drawer: false, current: null }),
  computed: {
    cats() {
      return [...new Set(db.suppliers.map((s) => s.cat))]
    },
    list() {
      return db.suppliers.filter((s) => (this.tab === '全部' || s.status === this.tab) && (!this.cat || s.cat === this.cat) && (!this.keyword || (s.id + s.short + s.name).includes(this.keyword)))
    },
    counts() {
      const c = { 全部: db.suppliers.length }
      for (const s of db.suppliers) c[s.status] = (c[s.status] || 0) + 1
      return c
    },
  },
  methods: {
    expired(s) {
      return s.certs.filter((c) => c.until !== '长期' && c.until < TODAY).length
    },
    open(s) {
      this.current = s
      this.drawer = true
    },
    admit(s) {
      ElMessageBox.confirm(`准入以后，「${s.short}」可以被选进采购单、加工单。资质附件齐了吗？`, '准入供应商', { confirmButtonText: '准入', cancelButtonText: '再看看' })
        .then(() => {
          s.status = '合作中'
          ElMessage.success('已准入' + (['成衣厂', '加工厂'].includes(s.cat) ? '，同时建好了它的工厂仓' : ''))
        })
        .catch(() => {})
    },
    block(s) {
      ElMessageBox.prompt('拉黑后，新建采购单、加工单时选不到它；已经下的单照常执行，但会标红提醒。原因会写进操作日志。', `把「${s.short}」拉黑`, { confirmButtonText: '拉黑', cancelButtonText: '取消', inputPlaceholder: '写清原因，如 两批面料克重不足', inputValidator: (v) => !!v || '原因要写', confirmButtonClass: 'el-button--danger' })
        .then(({ value }) => {
          s.status = '黑名单'
          s.blackReason = value
          ElMessage.success('已拉黑')
        })
        .catch(() => {})
    },
    stop(s) {
      ElMessageBox.confirm(`停用后，新单据里选不到「${s.short}」；已有单据不受影响，随时可以重新启用。`, '停用供应商', { confirmButtonText: '停用', cancelButtonText: '取消', type: 'warning' })
        .then(() => {
          s.status = '停用'
          ElMessage.success('已停用')
        })
        .catch(() => {})
    },
    restore(s) {
      s.status = '合作中'
      ElMessage.success('已恢复合作')
    },
  },
  template: `
  <div class="page">
    <PageHeader title="供应商档案" description="面料商、辅料商、成衣厂、加工厂、外协（印绣洗）都在这里。只有「合作中」的能被选进新单据。">

    </PageHeader>
    <section class="panel">
      <el-tabs v-model="tab" class="status-tabs">
        <el-tab-pane v-for="t in ['全部','合作中','待准入','停用','黑名单']" :key="t" :name="t" :label="t + ' ' + (counts[t] || 0)" />
      </el-tabs>
      <el-form class="filter-bar" inline @submit.prevent>
        <el-form-item label="关键字"><el-input v-model="keyword" clearable placeholder="编码、简称、全称" /></el-form-item>
        <el-form-item label="分类"><el-select v-model="cat" clearable placeholder="全部"><el-option v-for="c in cats" :key="c" :label="c" :value="c" /></el-select></el-form-item>
      </el-form>
      <div class="panel-body">
        <el-table :data="list" empty-text="这个状态下没有供应商">
          <el-table-column prop="id" label="编码" width="74" class-name="code" />
          <el-table-column label="简称 / 全称" min-width="180"><template #default="{ row }"><a class="link" @click="open(row)">{{ row.short }}</a><div class="muted" style="font-size:12px">{{ row.name }}</div></template></el-table-column>
          <el-table-column prop="cat" label="分类" width="120" />
          <el-table-column prop="level" label="等级" width="60" align="center" />
          <el-table-column label="结算" width="100"><template #default="{ row }">{{ row.settle }}{{ row.days ? ' ' + row.days + ' 天' : '' }}</template></el-table-column>
          <el-table-column prop="invoice" label="发票" width="90" />

            <span v-else>{{ row.certs.length }} 份<span v-if="expired(row)" class="late-text">，{{ expired(row) }} 份过期</span></span>
          </template></el-table-column>
          <el-table-column label="状态" width="90"><template #default="{ row }"><el-tooltip v-if="row.blackReason" :content="row.blackReason" placement="top"><span><StatusTag :status="row.status" /></span></el-tooltip><StatusTag v-else :status="row.status" /></template></el-table-column>
          <el-table-column label="操作" width="170"><template #default="{ row }">
            <el-button link type="primary" @click="open(row)">编辑</el-button>

            <el-button v-if="row.status === '合作中'" link type="primary" @click="stop(row)">停用</el-button>
            <el-button v-if="row.status === '停用'" link type="primary" @click="restore(row)">恢复</el-button>
            <el-button v-if="row.status !== '黑名单'" link type="danger" @click="block(row)">拉黑</el-button>
          </template></el-table-column>
        </el-table>
      </div>
    </section>

    <el-drawer v-model="drawer" :title="current ? current.short + ' · ' + current.id : ''" size="56%">
      <template v-if="current">
        <div v-if="current.status === '黑名单'" class="callout danger">已拉黑：{{ current.blackReason }}</div>
        <dl class="desc-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          <div class="wide"><dt>全称</dt><dd>{{ current.name }}</dd></div>
          <div><dt>分类</dt><dd>{{ current.cat }}</dd></div>
          <div><dt>等级</dt><dd>{{ current.level }}</dd></div>
          <div><dt>结算方式 / 账期</dt><dd>{{ current.settle }} {{ current.days ? current.days + ' 天' : '' }}</dd></div>
          <div><dt>发票</dt><dd>{{ current.invoice }}</dd></div>
          <div><dt>联系人</dt><dd>{{ current.contact }} <span class="num">{{ current.phone }}</span></dd></div>
          <div><dt>负责采购 / 跟单</dt><dd>{{ current.buyer }}</dd></div>
          <div class="wide"><dt>开户行 / 账号</dt><dd class="muted">（示意）某某银行 某某支行 · 6222 **** **** 0012</dd></div>
        </dl>
        <div class="panel-title" style="padding:20px 0 10px"><h2>资质附件</h2><el-button size="small" icon="Upload" @click="proto('上传营业执照、验厂报告、检测证书并填有效期；到期前 30 天首页提醒')">上传资质</el-button></div>
        <el-table :data="current.certs" size="small" empty-text="还没传资质。准入前至少要有营业执照。">
          <el-table-column prop="name" label="资质" />
          <el-table-column label="有效期至" width="140" class-name="num"><template #default="{ row }"><span :class="row.until !== '长期' && row.until < TODAY ? 'late-text' : ''">{{ row.until }}{{ row.until !== '长期' && row.until < TODAY ? '（已过期）' : '' }}</span></template></el-table-column>
          <el-table-column label="" width="80"><template #default><el-button link type="primary" @click="proto('预览附件')">查看</el-button></template></el-table-column>
        </el-table>
        <p class="muted" style="font-size:12px;margin-top:16px">邀请供应商自己注册、实名认证、线上验厂属于“外部协同门户”，等甲方定了外部账号范围（待决问题 Q02）再做。</p>

    <ProtoNote sec="§6.8 供应商">一期：档案、分类、准入状态、资质附件、停用和黑名单；绩效考核、合作历史放后面。</ProtoNote>
  </div>`,
})

const StyleDetailPage = page({
  props: ['params', 'query'],
  data() {
    const s = styleOf(this.params.id)
    const packs = packsOf(this.params.id)
    return {
      tab: this.query.tab || 'basic',
      packTab: 'bom',
      bomOpen: ['大身'],
      skuColors: s ? [...s.colors] : [],
      skuGroup: s ? s.sizeGroup : '',
      ver: (packs.find((p) => p.status === '已生效') || packs[0])?.ver || '',
      printing: false,
    }
  },
  computed: {
    s() {
      return styleOf(this.params.id)
    },
    sizes() {
      return sizeGroupOf(this.skuGroup)?.sizes || []
    },
    skuRows() {
      const rows = []
      for (const c of this.skuColors) for (const z of this.sizes) {
        const exists = this.s.colors.includes(c) && this.s.sizeGroup === this.skuGroup
        rows.push({ sku: `${this.s.code}-${c}-${z}`, color: c, size: z, exists, used: this.usedIn(c) })
      }
      return rows
    },
    removedUsed() {
      return this.s.colors.filter((c) => !this.skuColors.includes(c) && this.usedIn(c))
    },
    packs() {
      return packsOf(this.s.code)
    },
    pack() {
      return this.packs.find((p) => p.ver === this.ver)
    },
    processTotal() {
      const list = this.pack?.process || []
      return { sec: list.reduce((a, p) => a + p.sec, 0), price: list.reduce((a, p) => a + p.price, 0) }
    },
    bomCost() {
      return (this.pack?.bom || []).reduce((a, b) => a + this.lineCost(b), 0)
    },
    logs() {
      return db.logs[this.s.code] || []
    },
    orders() {
      return db.orders.filter((o) => o.lines.some((l) => l.style === this.s.code))
    },
  },
  methods: {
    usedIn(color) {
      return db.orders.some((o) => o.status !== '草稿' && o.lines.some((l) => l.style === this.s.code && l.qty[color]))
    },
    saveSkus() {
      if (this.removedUsed.length) return ElMessage.error(`${this.removedUsed.map((c) => colorOf(c).name).join('、')} 已经有订单在用，不能去掉，只能停用这个颜色`)
      const added = this.skuRows.filter((r) => !r.exists).length
      this.s.colors = [...this.skuColors]
      this.s.sizeGroup = this.skuGroup
      ;(db.logs[this.s.code] ||= []).unshift({ at: TODAY + ' 15:00', by: db.me.name, text: `颜色尺码改为 ${this.skuColors.map((c) => colorOf(c).name).join('、')} × ${sizeGroupOf(this.skuGroup).name}，新增 SKU ${added} 个` })
      ElMessage.success(`保存好了，新增 SKU ${added} 个`)
    },
    mat(code) {
      return matOf(code) || {}
    },
    usageText(b) {
      if (b.qtyMode === '统一') return fmtQ(b.usage)
      const v = Object.values(b.usage)
      return fmtQ(Math.min(...v)) + ' ~ ' + fmtQ(Math.max(...v))
    },
    avgUsage(b) {
      if (b.qtyMode === '统一') return b.usage
      const v = Object.values(b.usage)
      return v.reduce((a, x) => a + x, 0) / v.length
    },
    lineCost(b) {
      if (b.source !== '我方采购') return 0
      return this.avgUsage(b) * (1 + b.loss / 100) * (this.mat(b.mat).price || 0)
    },
    skuOf(b, color) {
      return b.colorMode === '随款色' ? b.colorMap[color] : b.fixedSku
    },
    colorNo(sku) {
      return skuInfo(sku).sku?.colorNo || ''
    },
    newVersion() {
      const base = this.packs.find((p) => p.status === '已生效') || this.packs[0]
      const n = Math.max(...this.packs.map((p) => Number(p.ver.slice(1)))) + 1
      const copy = JSON.parse(JSON.stringify(base))
      Object.assign(copy, { ver: 'V' + n, status: '草稿', date: TODAY, by: db.me.name, note: '从 ' + base.ver + ' 复制，改完再生效' })
      this.packs.unshift(copy)
      this.ver = copy.ver
      ElMessage.success(`复制出 ${copy.ver}（草稿）。已生效的 ${base.ver} 不受影响`)
    },
    activate() {
      const old = this.packs.find((p) => p.status === '已生效')
      ElMessageBox.confirm(`${this.pack.ver} 生效后，${old ? old.ver + ' 自动作废；' : ''}以后新审核的订单用 ${this.pack.ver}。已经审核的订单锁定的是原来的版本，不会被改动。`, '生效资料包', { confirmButtonText: '生效', cancelButtonText: '取消' })
        .then(() => {
          if (old) old.status = '已作废'
          this.pack.status = '已生效'
          ;(db.logs[this.s.code] ||= []).unshift({ at: TODAY + ' 15:10', by: db.me.name, text: `资料包 ${this.pack.ver} 生效${old ? '，' + old.ver + ' 作废' : ''}` })
          ElMessage.success('已生效')
        })
        .catch(() => {})
    },
    sizesOfStyle,
  },
  template: `
  <div class="page" v-if="s">
    <PageHeader :title="s.code + ' ' + s.name" :description="s.cat + ' · ' + s.year + ' ' + s.season + ' · 波段 ' + s.wave + ' · 设计师 ' + s.designer">
      <template #title-extra><StatusTag :status="s.status" /></template>
      <template #actions>
        <el-button icon="CopyDocument" @click="proto('复制成新款：带出资料包，改款号和颜色')">复制为新款</el-button>
        <el-button icon="Printer" @click="printing = true">打印资料包</el-button>
        <el-button type="primary" icon="Edit" @click="proto('编辑基本信息；款号不能改')">编辑</el-button>
      </template>
    </PageHeader>

    <section class="panel"><div class="panel-body">
      <el-tabs v-model="tab" class="sub-tabs">
        <el-tab-pane label="基本信息" name="basic">
          <div style="display:flex;gap:24px;align-items:flex-start">
            <GarmentThumb :shape="s.shape" :color="s.colors[0]" :size="150" />
            <dl class="desc-grid" style="flex:1">
              <div><dt>款号</dt><dd class="code">{{ s.code }}</dd></div>
              <div><dt>款式名称</dt><dd>{{ s.name }}</dd></div>
              <div><dt>品类</dt><dd>{{ s.cat }}</dd></div>
              <div><dt>年份 / 季节 / 波段</dt><dd>{{ s.year }} / {{ s.season }} / {{ s.wave }}</dd></div>
              <div><dt>风格 / 性别</dt><dd>{{ s.styleTag }} / {{ s.gender }}</dd></div>
              <div><dt>来源</dt><dd>{{ s.source }}<template v-if="s.sample"> · <a class="link code" @click="go('/samples/' + s.sample)">{{ s.sample }}</a></template></dd></div>
              <div><dt>客户 / 客户款号</dt><dd>{{ custName(s.customer) }} <span class="code">{{ s.customerNo }}</span></dd></div>
              <div><dt>默认加工厂</dt><dd>{{ supName(s.factory) }}</dd></div>
              <div><dt>吊牌价</dt><dd class="num">{{ money(s.tagPrice) }}</dd></div>
              <div><dt>成分</dt><dd>{{ s.comp }}</dd></div>
              <div><dt>执行标准</dt><dd>{{ s.standard }}</dd></div>
              <div><dt>安全类别</dt><dd>{{ s.safety }}</dd></div>
              <div><dt>上市日期</dt><dd class="num">{{ s.launch }}</dd></div>
              <div class="wide"><dt>颜色</dt><dd><ColorChip v-for="c in s.colors" :key="c" :code="c" /></dd></div>
              <div><dt>尺码组</dt><dd>{{ sizeGroupOf(s.sizeGroup).name }}</dd></div>
              <div class="full"><dt>用到这个款的订单</dt><dd><a v-for="o in orders" :key="o.no" class="link code" style="margin-right:12px" @click="go('/orders/' + o.no)">{{ o.no }}</a><span v-if="!orders.length" class="muted">还没有</span></dd></div>
            </dl>
          </div>
        </el-tab-pane>

        <el-tab-pane label="颜色尺码 SKU" name="sku">
          <div class="inline-actions">
            <span>颜色</span>
            <el-select v-model="skuColors" multiple style="width:320px" placeholder="选这个款有的颜色">

            </el-select>

const SampleDetailPage = page({
  props: ['params', 'query'],
  data: () => ({ reviewing: false, review: { result: '通过', opinion: '', by: '林夏、何蔓' }, converting: false, conv: { name: '', copyBom: true, customer: '' } }),
  computed: {
    s() {
      return sampleOf(this.params.id)
    },
    last() {
      return this.s.rounds[this.s.rounds.length - 1]
    },
    newCode() {
      const n = db.styles.filter((x) => x.code.startsWith('27C')).length + 1
      return '27C' + (this.s.catCode || 'F') + String(n).padStart(3, '0')
    },
  },
  methods: {
    openReview() {
      this.review = { result: '通过', opinion: '', by: '林夏、何蔓' }
      this.reviewing = true
    },
    submitReview() {
      const r = this.review
      this.last.review = { at: TODAY, by: r.by, result: r.result === '改版重做' ? '改版' : r.result, opinion: r.opinion || '（没写意见）' }
      this.last.status = '已评审'
      if (r.result === '通过') this.s.status = '通过'
      else if (r.result === '淘汰') this.s.status = '已淘汰'
      else {
        this.s.status = '开发中'
        this.s.rounds.push({ no: nextNo('DY'), round: this.last.round + 1, kind: '改版样', status: '待派单', due: '', nodes: ['接单', '纸样', '裁剪', '车版', '完成'].map((name) => ({ name, at: '' })), review: null })
      }
      this.reviewing = false
      ElMessage.success(r.result === '改版重做' ? '已生成下一版打样单，改版原因带过去了' : '评审结果已保存')
    },
    // 随款色默认按颜色码配：款式颜色 YM → 物料里颜色也是 YM 的 SKU；配不上的留空，页面上标出来
    autoMap(mat) {
      return Object.fromEntries(this.s.colors.map((c) => [c, matOf(mat).skus.find((k) => k.color === c)?.sku]).filter(([, v]) => v))
    },
    openConvert() {
      this.conv = { name: this.s.name, copyBom: true, customer: '' }
      this.converting = true
    },
    convert() {
      const code = this.newCode
      db.styles.unshift({ code, name: this.conv.name, cat: this.s.cat, year: 2027, season: '春', wave: 'C2', styleTag: '休闲', gender: '女', designer: this.s.designer, source: '样衣转大货', sample: this.s.no, customer: this.conv.customer, customerNo: '', sizeGroup: this.s.sizeGroup, colors: [...this.s.colors], tagPrice: this.s.tagPrice, comp: '待补', standard: '待补', safety: '待补', launch: '', factory: this.s.factory || 'S004', status: '启用', shape: this.s.shape, disabledSkus: [] })
      db.packs[code] = this.conv.copyBom
        ? [{ ver: 'V1', status: '草稿', date: TODAY, by: db.me.name, note: '样衣 ' + this.s.no + ' 转大货自动生成，用量按大货复核后再生效', bom: [
            { part: '大身', mat: 'ML0001', colorMode: '随款色', colorMap: this.autoMap('ML0001'), qtyMode: '统一', usage: 1.2, loss: 5, source: '我方采购' },
            { part: '罗纹', mat: 'ML0004', colorMode: '随款色', colorMap: this.autoMap('ML0004'), qtyMode: '统一', usage: 0.15, loss: 5, source: '我方采购' },
          ], process: [] }]
        : []
      db.logs[code] = [{ at: TODAY + ' 16:00', by: db.me.name, text: `由样衣 ${this.s.no} 转大货，生成款号 ${code}` }]
      this.s.status = '已转大货'
      this.s.style = code
      this.converting = false
      ElMessage.success(`转大货完成，款号 ${code}`)
      go('/styles/' + code + '?tab=pack')
    },
  },
  template: `
  <div class="page" v-if="s">
    <PageHeader :title="s.no + ' ' + s.name" phase="二期" :description="s.cat + ' · ' + s.season + ' · 设计师 ' + s.designer + ' · 版师 ' + s.pattern">
      <template #title-extra><StatusTag :status="s.status" /></template>
      <template #actions>
        <el-button v-if="last.status === '待评审'" type="primary" @click="openReview">评审第 {{ last.round }} 版</el-button>
        <el-button v-if="s.status === '通过'" type="primary" icon="Promotion" @click="openConvert">转大货</el-button>
        <el-button v-if="s.status === '已转大货'" @click="go('/styles/' + s.style)">看大货款 {{ s.style }}</el-button>
        <el-button v-if="last.status === '打样中'" @click="proto('同步版师在手机上点的节点完成')">汇报打样进度</el-button>
      </template>
    </PageHeader>
    <FlowBar :steps="['开发中', '待评审', '通过', '已转大货']" :current="s.status === '已淘汰' ? '' : s.status" />
    <div class="columns" style="grid-template-columns:minmax(0,2fr) minmax(0,3fr)">
      <section class="panel block">
        <h2>样衣档案</h2>
        <div style="display:flex;gap:16px;align-items:flex-start">
          <GarmentThumb :shape="s.shape" :color="s.colors[0]" :size="96" />
          <dl class="desc-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));flex:1">
            <div><dt>打样方式</dt><dd>{{ s.way }}</dd></div>
            <div><dt>打样工厂</dt><dd>{{ s.factory ? supName(s.factory) : '内部版房' }}</dd></div>
            <div class="wide"><dt>面料来源</dt><dd>{{ s.fabric }}</dd></div>
            <div class="wide"><dt>颜色</dt><dd><ColorChip v-for="c in s.colors" :key="c" :code="c" /></dd></div>
            <div><dt>尺码组</dt><dd>{{ s.sizeGroup }}</dd></div>
            <div><dt>预估吊牌价</dt><dd class="num">{{ money(s.tagPrice) }}</dd></div>
          </dl>
        </div>
      </section>
      <section class="panel block">
        <h2>打样版次</h2>
        <div v-for="r in [...s.rounds].reverse()" :key="r.no" style="border:1px solid var(--lm-line-soft);border-radius:6px;padding:12px 14px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div><b>第 {{ r.round }} 版</b> · {{ r.kind }} · <span class="code">{{ r.no }}</span></div>
            <StatusTag :status="r.status" />
          </div>
          <el-steps :active="r.nodes.filter((n) => n.at).length" finish-status="success" simple style="padding:10px 14px">
            <el-step v-for="n in r.nodes" :key="n.name" :title="n.name + (n.at ? ' ' + n.at : '')" />
          </el-steps>
          <div v-if="r.review" style="margin-top:10px;font-size:13px">评审 <StatusTag :status="r.review.result" />　{{ r.review.opinion }} <span class="muted">（{{ r.review.at }} · {{ r.review.by }}）</span></div>

        </div>
      </section>
    </div>

    <el-dialog v-model="reviewing" :title="'评审第 ' + last.round + ' 版'" width="480px">
      <el-form label-width="72px">

/* ============================================================
 * 订单、排单、算料

const ORDER_STEPS = ['草稿', '待审核', '待排单', '生产中', '已完成']

function orderProduction(no) {
  return db.production.filter((p) => p.order === no)
}

function orderReceived(o) {
  return orderProduction(o.no).reduce((a, p) => a + prodReceived(p), 0)
}

function addDays(d, n) {
  const x = new Date(d)
  x.setDate(x.getDate() + n)
  return x.toISOString().slice(0, 10)
}

const OrderListPage = page({
  props: ['params', 'query'],
  data: () => ({ tab: '全部', keyword: '' }),
  computed: {
    list() {
      return db.orders.filter((o) => (this.tab === '全部' || o.status === this.tab) && (!this.keyword || (o.no + custName(o.customer) + o.contract + o.lines.map((l) => l.style).join()).includes(this.keyword)))
    },
    counts() {
      const c = { 全部: db.orders.length }
      for (const o of db.orders) c[o.status] = (c[o.status] || 0) + 1
      return c
    },
  },
  methods: {
    received: orderReceived,
    styleText(o) {
      const s = styleOf(o.lines[0].style)
      return s.code + ' ' + s.name + (o.lines.length > 1 ? ` 等 ${o.lines.length} 款` : '')
    },
  },
  template: `
  <div class="page">
    <PageHeader title="订单" description="客户订单、自营备货、翻单、补单都在这里。审核即评审：审核时确认交期、锁定资料包版本。">
      <template #actions>
        <el-button icon="Upload" @click="proto('按模板导入订单：一行一个 SKU（款号、颜色、尺码、数量、单价、交期），导入前先预览错误行')">从 Excel 导入</el-button>
        <el-button type="primary" icon="Plus" @click="proto('新建订单：选客户、款式后出现 颜色 × 尺码 表格，直接填数量')">新建订单</el-button>
      </template>
    </PageHeader>
    <section class="panel">
      <el-tabs v-model="tab" class="status-tabs">
        <el-tab-pane v-for="t in ['全部', ...ORDER_STEPS]" :key="t" :name="t" :label="t + ' ' + (counts[t] || 0)" />
      </el-tabs>
      <el-form class="filter-bar" inline @submit.prevent>
        <el-form-item label="关键字"><el-input v-model="keyword" clearable placeholder="订单号、客户、合同号、款号；多个用空格隔开" style="width:320px" /></el-form-item>
      </el-form>
      <div class="panel-body">
        <el-table :data="list" empty-text="这个状态下没有订单">
          <el-table-column label="订单号" width="140"><template #default="{ row }"><a class="link code" @click="go('/orders/' + row.no)">{{ row.no }}</a></template></el-table-column>
          <el-table-column prop="type" label="类型" width="80" />
          <el-table-column label="客户" width="100"><template #default="{ row }">{{ custName(row.customer) }}</template></el-table-column>
          <el-table-column label="款式" min-width="150"><template #default="{ row }">{{ styleText(row) }}</template></el-table-column>
          <el-table-column label="数量" width="70" align="right" class-name="num"><template #default="{ row }">{{ fmt(orderQty(row)) }}</template></el-table-column>
          <el-table-column label="金额" width="100" align="right" class-name="num"><template #default="{ row }">{{ money(orderAmount(row)) }}</template></el-table-column>
          <el-table-column label="客户交期" width="96" class-name="num"><template #default="{ row }">{{ row.due }}</template></el-table-column>
          <el-table-column label="承诺交期" width="96" class-name="num"><template #default="{ row }">{{ row.promise || '—' }}</template></el-table-column>
          <el-table-column prop="follower" label="跟单" width="64" />
          <el-table-column label="回货" width="100"><template #default="{ row }"><el-progress v-if="['生产中','已完成'].includes(row.status)" :percentage="Math.round(received(row) / orderQty(row) * 100)" :stroke-width="6" /><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column label="状态" width="86"><template #default="{ row }"><StatusTag :status="row.status" /></template></el-table-column>
        </el-table>

  </div>`,
})
OrderListPage.data = ((orig) =>
  function () {
    return { ...orig.call(this), ORDER_STEPS }
  })(OrderListPage.data)

const OrderDetailPage = page({
  props: ['params', 'query'],
  data: () => ({ tab: 'down', auditing: false, auditForm: { promise: '', opinion: '' }, scheduling: false, plan: [], changing: false, change: { type: '数量', detail: '', reason: '', duty: '客户' } }),
  computed: {
    o() {
      return orderOf(this.params.id)
    },
    prods() {
      return orderProduction(this.o.no)
    },
    purchases() {
      return db.purchases.filter((p) => p.orders.includes(this.o.no))
    },
    picks() {
      const jg = this.prods.map((p) => p.no)
      return db.stockOuts.filter((x) => jg.includes(x.src))
    },
    mrpPreview() {
      const { rows, issues } = computeMrp([this.o.no])
      return {
        buy: rows.filter((r) => r.source === '我方采购' && mrpSuggest(r) > 0),
        customer: rows.filter((r) => r.source === '客供'),
        issues,
      }
    },
    planGroups() {
      const g = {}
      for (const r of this.plan) if (r.factory) (g[r.factory + '|' + r.mode] ||= []).push(r)
      return Object.values(g)
    },
    refPrice() {
      const p = effectivePack(this.o.lines[0].style)
      return p ? p.process.reduce((a, x) => a + x.price, 0) : 0
    },
    factories() {
      return db.suppliers.filter((s) => ['成衣厂', '加工厂'].includes(s.cat))
    },
  },
  methods: {
    sizes(style) {
      return sizesOfStyle(style)
    },
    packText(line) {
      if (line.pack) return '资料包 ' + line.pack + '（已锁定）'
      const p = effectivePack(line.style)
      return p ? '资料包 ' + p.ver + '（审核时锁定）' : '还没有已生效的资料包'
    },
    submit() {
      const missing = this.o.lines.filter((l) => !effectivePack(l.style))
      if (missing.length) return ElMessage.error(`${missing.map((l) => l.style).join('、')} 的资料包还是草稿，生效后才能提交审核（算料要用 BOM）`)
      this.o.status = '待审核'
      ElMessage.success('已提交，等审核')
    },
    openAudit() {
      this.auditForm = { promise: this.o.due, opinion: '' }
      this.auditing = true
    },
    doAudit() {
      this.o.lines.forEach((l) => (l.pack = effectivePack(l.style).ver))
      this.o.promise = this.auditForm.promise
      this.o.status = '待排单'
      this.o.auditBy = db.me.name
      this.o.auditAt = TODAY + ' 15:20'
      this.auditing = false
      ElMessage.success('审核通过，资料包版本已锁定。下一步：排单、算料')
    },
    back() {
      ElMessageBox.confirm('退回后订单回到草稿，业务员改完再提交。', '退回订单', { confirmButtonText: '退回', cancelButtonText: '取消' })
        .then(() => {
          this.o.status = '草稿'
          ElMessage.success('已退回')
        })
        .catch(() => {})
    },
    unaudit() {
      if (this.prods.length || this.purchases.length) return ElMessage.error('已经有加工单或采购单了，不能反审核。要改数量、交期请走「变更」')
      this.o.status = '待审核'
      this.o.lines.forEach((l) => (l.pack = ''))
      ElMessage.success('已反审核')
    },
    remove() {
      ElMessageBox.confirm('删除后这张订单就没了，不能恢复。草稿才能删。', '删除订单', { confirmButtonText: '删除', cancelButtonText: '取消', type: 'warning', confirmButtonClass: 'el-button--danger' })
        .then(() => {
          db.orders.splice(db.orders.indexOf(this.o), 1)
          ElMessage.success('已删除')
          go('/orders')
        })
        .catch(() => {})
    },
    openSchedule() {
      // 贯穿例子：卡其 400 件排给某某制衣厂（清加工 38 元/件，交期 2027-03-10），藏青、黑色排给明辉服装
      const isExample = this.o.no === 'DD202611050001'
      this.plan = this.o.lines.flatMap((l) =>
        Object.keys(l.qty).map((c) => {
          const s = styleOf(l.style)
          const preset = isExample && c !== 'KQ' ? { factory: 'S005', price: 36, due: '2027-03-12' } : { factory: s.factory, price: isExample ? 38 : Math.round(this.refPrice) || 40, due: isExample ? '2027-03-10' : addDays(this.o.promise || this.o.due, -10) }
          return { style: l.style, color: c, qty: sumValues(l.qty[c]), sizes: l.qty[c], pack: l.pack, mode: '清加工', ...preset }
        }),
      )
      this.scheduling = true
    },
    doSchedule() {
      if (this.plan.some((r) => !r.factory)) return ElMessage.warning('每一行都要选加工厂')
      const made = []
      for (const rows of this.planGroups) {
        const first = rows[0]
        const qty = {}
        rows.forEach((r) => (qty[r.color] = { ...r.sizes }))
        const due = rows.map((r) => r.due).sort()[0]
        const start = addDays(TODAY, 1)
        const span = days(start, due)
        const at = (f) => addDays(start, Math.round(span * f))
        const no = nextNo('JG')
        db.production.unshift({
          no, order: this.o.no, style: first.style, pack: first.pack, factory: first.factory, mode: first.mode, price: first.price, date: TODAY, due, follower: this.o.follower, status: '已下单',
          qty, received: {}, defects: 0, terms: '次品率超 2% 的部分按加工价 2 倍扣款；每延期一天扣总加工费 1%',
          nodes: [
            { name: '到料', ps: start, pe: at(0.25), as: '', ae: '', qty: 0 },
            { name: '裁剪', ps: at(0.25), pe: at(0.35), as: '', ae: '', qty: 0 },
            { name: '车缝', ps: at(0.35), pe: at(0.8), as: '', ae: '', qty: 0 },
            { name: '后整', ps: at(0.8), pe: at(0.9), as: '', ae: '', qty: 0 },
            { name: '包装', ps: at(0.9), pe: at(0.96), as: '', ae: '', qty: 0 },
            { name: '入仓', ps: at(0.96), pe: due, as: '', ae: '', qty: 0 },
          ],
          issues: [], receipts: [], reports: [],
        })
        made.push(no)
      }
      this.o.status = '生产中'
      this.scheduling = false
      ElMessage.success(`生成了 ${made.length} 张加工单：${made.join('、')}`)
      go('/production/' + made[0])
    },
    saveChange() {
      if (!this.change.detail) return ElMessage.warning('写一下改了什么')
      this.o.changes.unshift({ no: nextNo('BG'), ...this.change, by: db.me.name, at: TODAY + ' 15:30', status: '待审核', effect: '审核后同步到加工单；数量变了会提示重新算料' })
      this.changing = false
      this.tab = 'changes'
      ElMessage.success('变更单已提交，审核后生效')
    },
    prodProgress,
    received: orderReceived,
    sumValues,
  },
  template: `
  <div class="page" v-if="o">
    <PageHeader :title="'订单 ' + o.no" :description="o.type + ' · ' + (o.customer ? cust(o.customer).name : '自营') + (o.contract ? ' · 合同 ' + o.contract : '') + (o.source ? ' · 翻自 ' + o.source : '')">

    <section class="panel block">

/* ============================================================
 * 采购单、到料跟踪、入库、出库领料、库存、库存日志
 * ============================================================ */
function nowTime() {
  return TODAY + ' 15:' + String(10 + Math.floor(Math.random() * 49)).padStart(2, '0')
}

/* 一张单据的所有库存变动：先全部检查，够了再一起改（不允许负库存） */
function applyMoves(moves, docType, doc) {
  for (const m of moves) {
    if (m.delta >= 0) continue
    const r = db.stock.find((x) => x.wh === m.wh && x.sku === m.sku && x.owner === m.owner)
    const have = r ? r.qty : 0
    if (have + m.delta < -1e-6) throw new Error(`${whName(m.wh)} 的 ${skuLabel(m.sku)}（${ownerName(m.owner)}）只有 ${fmtQ(have)}，不够出 ${fmtQ(-m.delta)}`)
  }
  const at = nowTime()
  for (const m of moves) {
    let r = db.stock.find((x) => x.wh === m.wh && x.sku === m.sku && x.owner === m.owner)
    if (!r) {
      r = { wh: m.wh, sku: m.sku, owner: m.owner, qty: 0 }
      db.stock.push(r)
    }
    r.qty = round4(r.qty + m.delta)
    db.stockLog.unshift({ at, docType: m.type || docType, doc, wh: m.wh, sku: m.sku, owner: m.owner, change: m.delta, after: r.qty, by: db.me.name })
  }
}

function purchaseRemain(p) {
  return p.lines.reduce((a, l) => a + Math.max(0, l.qty - l.inQty), 0)
}

function purchaseRate(p) {
  const total = p.lines.reduce((a, l) => a + l.qty, 0)
  return total ? Math.round((p.lines.reduce((a, l) => a + Math.min(l.inQty, l.qty), 0) / total) * 100) : 0
}

/* 一张加工单要发给工厂的料（清加工：我方采购 + 客供；包工包料：只有客供） */
function prodNeeds(p) {
  const pack = packOf(p.style, p.pack) || effectivePack(p.style)
  const order = orderOf(p.order)
  const map = new Map()
  if (!pack) return []
  for (const [color, sizes] of Object.entries(p.qty))
    for (const [size, q] of Object.entries(sizes))
      for (const b of pack.bom) {
        if (b.source === '加工厂自备') continue
        if (p.mode === '包工包料' && b.source !== '客供') continue
        const sku = b.colorMode === '随款色' ? b.colorMap[color] : b.fixedSku
        if (!sku) continue
        const owner = b.source === '客供' ? order?.customer || '自有' : '自有'
        const u = b.qtyMode === '分码' ? b.usage[size] : b.usage
        const k = sku + '|' + owner
        const r = map.get(k) || { sku, owner, need: 0 }
        r.need += q * u * (1 + b.loss / 100)
        map.set(k, r)
      }
  const issued = db.stockOuts.filter((x) => x.src === p.no && x.type === '领料出库' && x.status === '已审核').flatMap((x) => x.lines)
  return [...map.values()].map((r) => {
    const done = issued.filter((l) => l.sku === r.sku && l.owner === r.owner).reduce((a, l) => a + l.qty, 0)
    const need = Math.ceil(round4(r.need))
    const available = db.stock.filter((s) => s.sku === r.sku && s.owner === r.owner && whOf(s.wh)?.type === '物料仓').reduce((a, s) => a + s.qty, 0)
    return { ...r, need, issued: done, rest: Math.max(0, need - done), available }
  })
}

    receiveAll() {
      const lines = this.p.lines.filter((l) => l.qty > l.inQty)
      const no = nextNo('RK')
      const moves = lines.map((l) => ({ wh: this.p.wh, sku: l.sku, owner: '自有', delta: round4((l.qty - l.inQty) * (skuInfo(l.sku).mat?.rate || 1)) }))

      }
      db.stockIns.unshift({ no, type: '采购入库', wh: this.p.wh, supplier: this.p.supplier, customer: '', src: this.p.no, date: TODAY, status: '已审核', by: db.me.name, lines: moves.map((m) => ({ sku: m.sku, qty: m.delta, lot: '' })) })

const StockInPage = page({
  props: ['params', 'query'],
  data: () => ({ creating: false, form: { type: '采购入库', src: '', wh: 'WH01', customer: 'C001', lines: [] } }),
  computed: {
    openPurchases() {
      return db.purchases.filter((p) => ['已审核', '部分到货'].includes(p.status))
    },
  },
  watch: {
    'form.src'(no) {
      const p = purchaseOf(no)
      if (!p) return
      this.form.wh = p.wh
      this.form.lines = p.lines.filter((l) => l.qty > l.inQty).map((l) => ({ sku: l.sku, plan: l.qty - l.inQty, qty: round4((l.qty - l.inQty) * (skuInfo(l.sku).mat?.rate || 1)), lot: '', pLine: l }))
    },
    'form.type'(t) {
      this.form.src = ''
      this.form.lines = t === '客供入库' ? [{ sku: 'BQ0003-HE', plan: null, qty: 1212, lot: '' }] : []
    },
  },
  methods: {
    open() {
      this.form = { type: '采购入库', src: '', wh: 'WH01', customer: 'C001', lines: [] }
      this.creating = true
    },
    save(audit) {
      if (!this.form.lines.length) return ElMessage.warning('没有要入库的物料')
      const no = nextNo('RK')
      const owner = this.form.type === '客供入库' ? this.form.customer : '自有'
      const doc = { no, type: this.form.type, wh: this.form.wh, supplier: purchaseOf(this.form.src)?.supplier || '', customer: this.form.type === '客供入库' ? this.form.customer : '', src: this.form.src, date: TODAY, status: '草稿', by: db.me.name, lines: this.form.lines.map((l) => ({ sku: l.sku, qty: l.qty, lot: l.lot })) }
      if (audit) {
        try {
          applyMoves(this.form.lines.map((l) => ({ wh: this.form.wh, sku: l.sku, owner, delta: l.qty })), this.form.type, no)
        } catch (e) {
          return ElMessage.error(e.message)
        }
        doc.status = '已审核'
        const p = purchaseOf(this.form.src)
        if (p) {
          this.form.lines.forEach((l) => (l.pLine.inQty = round4(l.pLine.inQty + l.qty / (skuInfo(l.sku).mat?.rate || 1))))
          p.status = purchaseRemain(p) > 0 ? '部分到货' : '已到齐'
        }
      }
      db.stockIns.unshift(doc)
      this.creating = false
      ElMessage.success(audit ? `入库单 ${no} 已审核：库存已加，采购单已回写` : `入库单 ${no} 已保存为草稿`)
    },
    auditDoc(d) {
      const owner = d.type === '客供入库' ? d.customer : '自有'
      try {
        applyMoves(d.lines.map((l) => ({ wh: d.wh, sku: l.sku, owner, delta: l.qty })), d.type, d.no)
      } catch (e) {
        return ElMessage.error(e.message)
      }
      d.status = '已审核'
      ElMessage.success('已审核，库存已加')
    },
  },
  template: `
  <div class="page">
    <PageHeader title="入库单" description="采购入库、客供入库、其他入库。审核即过账：库存增加、写库存日志、回写采购单。">

    </PageHeader>
    <section class="panel"><div class="panel-body">

        <el-table-column label="供应商 / 客户" width="110"><template #default="{ row }">{{ row.supplier ? supName(row.supplier) : row.customer ? '客供 · ' + custName(row.customer) : '—' }}</template></el-table-column>
        <el-table-column label="来源单" width="150"><template #default="{ row }"><a v-if="row.src && row.src.startsWith('CG')" class="link code" @click="go('/purchases/' + row.src)">{{ row.src }}</a><span v-else class="code">{{ row.src || '—' }}</span></template></el-table-column>
        <el-table-column label="内容" min-width="220"><template #default="{ row }">{{ linesBrief(row.lines) }}</template></el-table-column>
        <el-table-column prop="date" label="日期" width="100" class-name="num" />
        <el-table-column label="状态" width="80"><template #default="{ row }"><StatusTag :status="row.status" /></template></el-table-column>
        <el-table-column label="操作" width="80"><template #default="{ row }"><el-button v-if="row.status === '草稿'" link type="primary" @click="auditDoc(row)">审核</el-button></template></el-table-column>
      </el-table>

    <el-dialog v-model="creating" title="新建入库单" width="820px">
      <el-form label-width="80px" inline>
        <el-form-item label="类型"><el-select v-model="form.type" style="width:130px"><el-option v-for="t in ['采购入库','客供入库','其他入库']" :key="t" :label="t" :value="t" /></el-select></el-form-item>

        <el-form-item label="仓库"><el-select v-model="form.wh" style="width:180px"><el-option v-for="w in db.warehouses.filter((x) => x.type !== '成品仓')" :key="w.code" :label="w.name" :value="w.code" /></el-select></el-form-item>
      </el-form>
      <el-table :data="form.lines" size="small" empty-text="选了采购单以后，没到的物料会列在这里">

        <el-table-column label="采购未到" width="100" align="right" class-name="num"><template #default="{ row }">{{ row.plan === null ? '—' : fmtQ(row.plan) }}</template></el-table-column>

      </el-table>
      <p class="muted" style="font-size:12px;margin:10px 0 0">一期记缸号但库存不按缸号分开；要不要按缸号管库存是待决问题。客供入库的料，库存的「物权」记在客户名下，不会被别的订单算料用掉。</p>

})

      return db.stockOuts.filter((x) => this.tab === '全部' || x.type === this.tab)
    },
    openJgs() {
      return db.production.filter((p) => p.status !== '已完成')
    },
  },
  watch: {
    pickJg(no) {
      const p = prodOf(no)
      this.pickLines = p ? prodNeeds(p).map((r) => ({ ...r, qty: Math.min(r.rest, r.available) })) : []
    },
  },
  methods: {
    openPick() {
      this.pickJg = ''
      this.pickLines = []
      this.picking = true
    },
    savePick() {
      const p = prodOf(this.pickJg)
      if (!p) return ElMessage.warning('先选加工单')
      const lines = this.pickLines.filter((l) => l.qty > 0)
      if (!lines.length) return ElMessage.warning('没有要发的料')
      const to = db.warehouses.find((w) => w.factory === p.factory)?.code
      const no = nextNo('LL')
      const moves = []
      for (const l of lines) {
        let rest = l.qty
        for (const s of db.stock.filter((x) => x.sku === l.sku && x.owner === l.owner && whOf(x.wh)?.type === '物料仓' && x.qty > 0)) {
          const take = Math.min(rest, s.qty)
          if (take <= 0) continue
          moves.push({ wh: s.wh, sku: l.sku, owner: l.owner, delta: -take, type: '领料出库' })
          rest = round4(rest - take)
        }
        if (rest > 0) return ElMessage.error(`${skuLabel(l.sku)} 库存不够，还差 ${fmtQ(rest)}`)
        moves.push({ wh: to, sku: l.sku, owner: l.owner, delta: l.qty, type: '领料入库' })
      }
      try {
        applyMoves(moves, '领料出库', no)
      } catch (e) {
        return ElMessage.error(e.message)
      }
      db.stockOuts.unshift({ no, type: '领料出库', from: moves[0].wh, to, src: p.no, date: TODAY, status: '已审核', by: db.me.name, lines: lines.map((l) => ({ sku: l.sku, qty: l.qty, owner: l.owner })) })

      ElMessage.success(`领料单 ${no} 已审核：料从物料仓转到 ${whName(to)}`)
    },
    srcLink(row) {
      if (row.src.startsWith('JG')) go('/production/' + row.src)

    },

      <div class="panel-body">

          <el-table-column label="从 → 到" min-width="220"><template #default="{ row }">{{ whName(row.from) }} → {{ row.to ? whName(row.to) : '退回供应商' }}</template></el-table-column>

const ProductionDetailPage = page({
  props: ['params', 'query'],
  data() {
    return {
      tab: this.query.tab || 'matrix',
      reporting: false,
      rep: { node: '', as: '', ae: '', qty: 0, note: '' },
      receiving: false,
      recv: { rows: [], wh: 'WH09', logistics: '', note: '' },
      issuing: false,
      iss: { type: '缺料', desc: '', duty: '供应商', newDue: '' },
      NODE_STATE_TEXT,
      NODE_STATE_TONE,
    }
  },
  computed: {
    p() {
      return prodOf(this.params.id)
    },
    total() {
      return matrixTotal(this.p.qty)
    },
    late() {
      return prodLate(this.p)
    },
    needs() {
      return prodNeeds(this.p).map((r) => ({ ...r, atFactory: db.stock.filter((s) => s.sku === r.sku && s.owner === r.owner && whOf(s.wh)?.factory === this.p.factory).reduce((a, s) => a + s.qty, 0) }))
    },
  },
  methods: {
    nodeState,
    received: prodReceived,
    progress: prodProgress,
    nodePct(n) {
      return Math.min(100, Math.round((n.qty / this.total) * 100))
    },
    lateBy(plan, actual) {
      return actual && plan && actual > plan ? days(plan, actual) : 0
    },
    openReport(name) {
      const n = (name && this.p.nodes.find((x) => x.name === name)) || prodCurrentNode(this.p) || this.p.nodes[0]
      this.rep = { node: n.name, as: n.as || TODAY, ae: '', qty: n.qty, note: '' }
      this.reporting = true
    },
    saveReport() {
      const n = this.p.nodes.find((x) => x.name === this.rep.node)
      n.as = this.rep.as || n.as || TODAY
      n.qty = this.rep.qty
      if (this.rep.ae) n.ae = this.rep.ae
      else if (this.rep.qty >= this.total) n.ae = TODAY
      this.p.reports.unshift({ at: TODAY + ' 15:40', by: db.me.name, node: n.name, qty: n.qty, note: this.rep.note })
      prodStatusAfterReport(this.p)
      this.reporting = false
      ElMessage.success(`「${n.name}」已更新${n.ae ? '，标记完成' : ''}`)
    },
    openReceive() {
      this.recv = { rows: Object.keys(this.p.qty).map((c) => ({ color: c, plan: sumValues(this.p.qty[c]), got: sumValues(this.p.received[c]), qty: 0, defects: 0 })), wh: 'WH09', logistics: '', note: '' }
      this.receiving = true
    },
    saveReceive() {
      const sum = this.recv.rows.reduce((a, r) => a + r.qty, 0)
      if (!sum) return ElMessage.warning('填一下这次回了多少件')
      for (const r of this.recv.rows) {
        let left = r.qty
        const rec = (this.p.received[r.color] ||= {})
        for (const [size, q] of Object.entries(this.p.qty[r.color])) {
          const room = q - (rec[size] || 0)
          const take = Math.min(room, left)
          rec[size] = (rec[size] || 0) + take
          left -= take
        }
      }
      const defects = this.recv.rows.reduce((a, r) => a + r.defects, 0)
      this.p.defects += defects
      this.p.receipts.unshift({ no: nextNo('HH'), date: TODAY, qty: sum, defects, wh: this.recv.wh, logistics: this.recv.logistics, note: this.recv.note })
      this.p.status = prodReceived(this.p) >= this.total ? '已完成' : '部分回货'
      this.receiving = false
      this.tab = 'receipts'
      ElMessage.success(`回货 ${sum} 件已登记${this.p.status === '已完成' ? '，全部回齐，加工单完成' : ''}。成品入库推聚水潭放二期`)
    },
    saveIssue() {
      if (!this.iss.desc) return ElMessage.warning('写一下出了什么事')
      this.p.issues.unshift({ ...this.iss, by: db.me.name, at: TODAY + ' 15:45', action: '', status: '待处理' })
      this.issuing = false
      this.tab = 'issues'
      ElMessage.success('异常已上报，首页「异常待处理」能看到')
    },
    closeIssue(i) {
      ElMessageBox.prompt('写一下怎么处理的，关闭后进入历史。', '关闭异常', { confirmButtonText: '关闭异常', cancelButtonText: '取消', inputValue: i.action })
        .then(({ value }) => {
