# 前端静态文件 + 把 /api、/files 转给后端容器 app:8080
# 浏览器只和这一个地址打交道，和开发时 Vite 代理是一个道理，没有跨域
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # 上传上限：Spring 那边是 10MB。这里放宽一点，超了由 Spring 返回"文件太大"的 400，而不是 Nginx 的 413 页面
    client_max_body_size 11m;

    # 压缩：Element Plus 的 js 从 1MB 压到 300 多 KB
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # 直接覆盖成连到 Nginx 的那个 IP，不在客户端传来的 X-Forwarded-For 后面追加：客户端伪造的值进不来
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location /files/ {
        proxy_pass http://app:8080;
    }

    # 打包出来的 js、css 文件名带内容哈希，内容一变名字就变，可以放心让浏览器缓存很久
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其他路径都返回 index.html：/system/user 这种地址是前端路由，服务器上没有这个文件
    # index.html 不缓存，发版后用户刷新一下就能拿到新版本
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
