# SCM 的全部服务（RFC 002 §4）。配置和密钥在同目录的 .env 里，每一项的说明见 env.example。
#
# 升级时这个文件会被新版本覆盖，不要直接改。要改什么（加内存、换 Docker 网段、多挂一个目录……）写在同目录的
# compose.override.yml 里：docker compose 会自动叠加它，升级也不会覆盖。
#
# 常用命令，都在安装目录里执行：
#   sudo docker compose ps                      各服务的状态
#   sudo docker compose logs --tail 100 app     应用最近的日志（更早的在 logs/ 下）
#   sudo docker compose up -d                   改了 .env 以后让它生效
#   sudo docker compose down                    全部停掉（数据不会删）
name: scm

# 容器日志滚动：每个 10MB、留 3 个，不会写满硬盘。应用的日志另外写在 logs/，留 30 天
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Nginx + 前端页面，唯一对外开端口的服务。/api 转给 app，/files 校验签名后直接发上传目录里的文件
  web:
    # 按 SCM_WEB_MODE 叠加 web-http.yml 或 web-https.yml：两种模式开的端口、用的配置文件不一样
    extends:
      file: web-${SCM_WEB_MODE:-http}.yml
      service: web
    image: scm-web:${SCM_VERSION:?.env 里没有 SCM_VERSION}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SCM_HTTPS_PORT: ${SCM_HTTPS_PORT:-443}
      SCM_PUBLIC_SCHEME: ${SCM_PUBLIC_SCHEME:-}
      # 文件地址的签名密钥，和 app 用同一个（架构 §8）；改名成 SCM_ 开头，配置模板才会替换它
      SCM_FILE_SIGN_KEY: ${FILE_SIGN_KEY:?.env 里没有 FILE_SIGN_KEY}
      NGINX_ENVSUBST_FILTER: ^SCM_    # 配置模板里只替换 SCM_ 开头的变量，$host 这些 Nginx 自己的变量不动
    volumes:
      - ./nginx:/etc/nginx/scm:ro
      - ./data/uploads:/data/uploads:ro
    # 不依赖 app：应用重启、升级时 Nginx 照常在，/api 回"系统正在升级"，而不是连不上
    # Nginx 只解析 app 这一个名字，由 Docker 自带的 DNS 回答，用不到外面的 DNS。不写这一行的话，app 停着的时候
    # Docker 会把"app"转给服务器的 DNS 去查：有的 DNS（代理软件、把查不到的域名劫持到广告页的运营商 DNS）会回一个假地址，
    # Nginx 连着假地址一直等，页面收不到上面那句提示。写成 127.0.0.1，查不到的名字马上失败，Nginx 马上回提示
    dns: 127.0.0.1
    networks:
      edge:
        ipv4_address: ${SCM_EDGE_WEB_IP:-172.30.250.2}
    mem_limit: 64m
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    image: scm-app:${SCM_VERSION:?.env 里没有 SCM_VERSION}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/scm
      DB_USER: scm
      DB_PASSWORD: ${POSTGRES_PASSWORD:?.env 里没有 POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env 里没有 REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?.env 里没有 JWT_SECRET}
      FILE_SIGN_KEY: ${FILE_SIGN_KEY:?.env 里没有 FILE_SIGN_KEY}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
      LINGMAO_PROXY_TRUSTED_CIDRS: ${SCM_EDGE_WEB_IP:-172.30.250.2}/32
      BACKUP_DIR: /backups
      SCM_PUBLIC_URL: ${SCM_PUBLIC_URL:-}
      SCM_DINGTALK_APP_KEY: ${SCM_DINGTALK_APP_KEY:-}
      SCM_DINGTALK_APP_SECRET: ${SCM_DINGTALK_APP_SECRET:-}
      SCM_DINGTALK_AGENT_ID: ${SCM_DINGTALK_AGENT_ID:-}
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/exports:/data/exports   # 私有导出不挂给 Nginx；下载必须重新校验账号和当前权限
      - ./logs:/data/logs
      - ./backups:/backups:ro           # 只读：管理后台显示最近一次备份的时间和大小
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 90s              # 25s 排空 + Web 35s + worker 15s + probe 3s，另留 12s 余量；连接池最后关闭
    networks:
      - default
      - edge
    mem_limit: 1200m                    # 堆最多用 75%，见 deploy/app.Dockerfile
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s                # 第一次启动、升级时要执行数据库迁移

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: scm
      POSTGRES_DB: scm
      # 只在第一次启动、data/postgres 还是空的时候用来建库。之后改 .env 里的密码，数据库不认，应用就连不上了
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 里没有 POSTGRES_PASSWORD}
    # 按 4G 内存的机器调的（应用占 1.2G）。机器更大时可以在 compose.override.yml 里把 command 整个换掉
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1            # 云硬盘都是 SSD
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
      - -c
      # 原始 SQL、绑定参数和语句报错（ERROR）都可能带银行账号、税号这些业务值，不进数据库日志；
      # 慢 SQL 由应用记录（只记操作名、摘要和耗时）。log_min_messages=log 留下启动、关闭、检查点、
      # FATAL / PANIC（磁盘满、连不上）这些，数据库起不来时 `docker compose logs postgres` 还能看到原因。
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_error_verbosity=terse
      - -c
      - log_min_error_statement=panic
      - -c
      - log_min_messages=log
    shm_size: 256mb                     # Docker 默认只给 64MB，并行查询会不够用
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    stop_grace_period: 60s              # 让数据库正常关闭，不用下次启动时做恢复
    logging: *logging
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "scm", "-d", "scm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 共享限流和缓存。会话吊销存 PostgreSQL；限流键不能被 LRU 静默逐出。
  redis:
    image: redis:7
    restart: unless-stopped
    user: redis                         # 镜像的启动脚本只在命令是 redis-server 时才切到 redis 用户，这里命令是 sh，直接指定
    environment:
      TZ: Asia/Shanghai
      # redis-cli 自动用这个变量登录；redis-server 的密码也从它取，不写在命令行里（docker inspect 看命令行就看到了）
      REDISCLI_AUTH: ${REDIS_PASSWORD:?.env 里没有 REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDISCLI_AUTH" --save '' --appendonly no --maxmemory 96mb --maxmemory-policy noeviction
    mem_limit: 128m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 智能助手（可选，RFC 017）：默认不起。.env 里写 COMPOSE_PROFILES=assistant 才起，模型的地址和 Key 也在 .env（部署手册第 10 节）。
  # 只能替用户查数据：拿浏览器换来的 30 分钟只读令牌调 app，写接口、导出下载在 app 那边就拦了。
  # 自己的表在同一个库的 assistant schema，用单独的库账号 scm_assistant（读不到 app 的表），安装、升级、恢复脚本负责建它
  assistant:
    profiles: ["assistant"]
    image: scm-assistant:${SCM_VERSION:?.env 里没有 SCM_VERSION}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ASSISTANT_DATABASE_URL: postgres://scm_assistant@postgres:5432/scm
      # 不写进连接串：密码里有特殊字符也不用转义。不写成必填（:?）：没开助手时 compose 照样要展开这一段，
      # .env 里缺这一项会让所有 compose 命令都报错；缺了由安装、升级脚本说清楚（lib.sh 的 ensure_assistant_db）
      PGPASSWORD: ${ASSISTANT_DB_PASSWORD:-}
      ASSISTANT_APP_URL: http://app:8080
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:-}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-}
      ASSISTANT_LLM_MODE: ${ASSISTANT_LLM_MODE:-external}
      ASSISTANT_LLM_STREAM_USAGE: ${ASSISTANT_LLM_STREAM_USAGE:-true}
      ASSISTANT_USER_DAILY_REQUESTS: ${ASSISTANT_USER_DAILY_REQUESTS:-200}
      ASSISTANT_DAILY_TOKENS: ${ASSISTANT_DAILY_TOKENS:-5000000}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 25s              # 正在答的等 15 秒，没答完的中止、留 3 秒记进库；它自己 22 秒一定退出
    networks:
      - default                         # 连 postgres
      - edge                            # Nginx 转 /assistant/ 过来；它也从这里调 app
    mem_limit: 192m
    logging: *logging
    healthcheck:
      # 用 http.get 不用 fetch：fetch 要加载 undici，每 30 秒多占二三十 MB，和主进程挤在同一个 192m 里
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8091/assistant/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1)).setTimeout(4000,()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 每天定时备份数据库（scripts/backup-loop.sh），备份在 backups/ 下。复用 postgres 镜像：pg_dump 和数据库版本一致
  backup:
    image: postgres:16
    restart: unless-stopped
    command: ["bash", "/scripts/backup-loop.sh"]
    environment:
      TZ: Asia/Shanghai
      PGHOST: postgres
      PGUSER: scm
      PGDATABASE: scm
      PGPASSWORD: ${POSTGRES_PASSWORD:?.env 里没有 POSTGRES_PASSWORD}
      # 连库最多等 15 秒。开机时数据库容器还没起来，名字解析到别处（公司 DNS、代理软件）时 psql 会一直等下去，
      # 备份循环就卡住、再也不备份（11-27 在装了代理的 Mac 上试出来的）
      PGCONNECT_TIMEOUT: "15"
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      SCM_BACKUP_CONTAINER: "1"         # 告诉 backup.sh 它是在容器里执行的
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging

networks:
  edge:
    ipam:
      config:
        - subnet: ${SCM_EDGE_SUBNET:-172.30.250.0/28}
