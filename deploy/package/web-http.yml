# .env 里 SCM_WEB_MODE=http 时，compose.yml 的 web 服务叠加这里：只开 HTTP 端口，用 nginx/http.conf。
# 升级时会被覆盖，不要改这里（要改写 compose.override.yml）
services:
  web:
    ports:
      - "${SCM_HTTP_PORT:-80}:80"
    volumes:
      # Nginx 镜像启动时把 templates/ 下的文件渲染进 conf.d/，替换掉镜像自带的默认站点
      - ./nginx/http.conf:/etc/nginx/templates/default.conf.template:ro
