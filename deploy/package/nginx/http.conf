# HTTP 模式（.env 里 SCM_WEB_MODE=http）的 Nginx 配置。升级时会被覆盖，不要改这里：
# 信任的入口地址写在 trusted-proxies.conf；别的要改的告诉我们，放进下一个版本。
# 前面有负载均衡、网关负责 HTTPS，或者只在内网用、试用期，都用这个模式（部署手册第 4 节）

server {
    listen 80 default_server;
    server_name _;

    # 上传文件地址的签名密钥，site.conf 的 /files/ 用。容器启动时换成 .env 里的 FILE_SIGN_KEY（Nginx 镜像自带的模板功能）
    set $scm_file_sign_key "${SCM_FILE_SIGN_KEY}";

    include /etc/nginx/scm/site.conf;
}
