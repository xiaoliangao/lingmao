# 在 http 段里只引入一次。对外协议（http/https）由部署配置决定，从不信客户端传的请求头。
log_format scm_safe escape=json
    '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
    '"status":$status,"requestTime":$request_time,"requestId":"$scm_request_id"}';

map $http_x_request_id $scm_request_id {
    default $request_id;
    "~^[A-Za-z0-9][A-Za-z0-9._:-]{7,63}$" $http_x_request_id;
}
map $scm_public_scheme $scm_forwarded_proto {
    default $scheme;
    https https;
    http http;
}
map $scm_forwarded_proto $scm_hsts {
    default "";
    https "max-age=31536000";
}
map $uri $scm_upload_filename {
    default download;
    ~^/files/.*/([^/]+)$ $1;
}
map $uri $scm_upload_disposition {
    default "attachment; filename*=UTF-8''$scm_upload_filename";
    ~*\.(jpg|jpeg|png|gif|webp)$ inline;
}
