# Override the image's combined log at server scope: $request / $request_uri contain signed query credentials.
# $uri deliberately contains only the normalized path; headers, cookies, args and bodies never enter this log.
access_log /dev/stdout scm_safe;
# Nginx's built-in error formatter includes the complete request and cannot redact its query string.
# Request failures remain visible as safe status/path/requestId/timing records above. Startup errors still use the master log.
error_log /dev/null warn;
