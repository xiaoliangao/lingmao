# http.conf、https.conf 共用的部分（放在它们的 server 块里）。升级时会被覆盖，不要改这里

# 应用容器每次重建 IP 都会变。proxy_pass 写成变量，Nginx 就会在请求时用 resolver（Docker 自带的 DNS，127.0.0.11）
# 查 app 的地址，结果最多缓存 10 秒。写死 proxy_pass http://app:8080 的话，Nginx 只在启动时查一次，
# 应用重建以后一直连旧 IP，要重启 Nginx 才好。应用没起来时查不到 app 或者连不上，Nginx 回 502，下面换成"系统正在升级"
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

# 用户的真实 IP：只信 trusted-proxies.conf 里列出的入口（负载均衡、网关）传来的 X-Forwarded-For。
# 一个都没列时不信任何人，$remote_addr 就是直接连过来的地址，用户自己伪造的头不起作用
include /etc/nginx/scm/trusted-proxies.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 应用的上传上限是 10MB。Nginx 放宽到 11MB：超了由应用返回"文件太大"，而不是 Nginx 自己的 413 页面
client_max_body_size 11m;

gzip on;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

# 两个安全头，always：错误响应也带上。
# 下面的 location 里都不写 add_header：location 里只要写一个，这两个就不再继承下去。缓存时间用 expires 设
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
server_tokens off;                  # 响应头和错误页里不带 Nginx 的版本号

root /usr/share/nginx/html;

location /api/ {
    set $app http://app:8080;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # 整个覆盖成用户的真实 IP（上面 real_ip 换过的），用户自己带的 X-Forwarded-For 进不到应用（RFC 002 §12）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    # 应用重启、升级的那几十秒里连不上：回一个和应用同样格式的 JSON，前端照常弹出提示，而不是"网络错误"。
    # 只换 Nginx 自己产生的错误；应用自己的响应原样转发（没开 proxy_intercept_errors）
    error_page 502 503 504 =200 /__upgrading.json;
}

location = /__upgrading.json {
    internal;
    alias /etc/nginx/scm/upgrading.json;
    charset utf-8;
    charset_types application/json;
    expires -1;
}

# 上传的文件，地址是 /files/2026/11/21/<随机名>.jpg（缩略图在同一个目录，文件名多一个 _s）。
# Nginx 直接从上传目录发，不经过应用。文件名是随机的、内容不会变，浏览器缓存 30 天
location /files/ {
    alias /data/uploads/;
    expires 30d;
}

# 前端的 js、css：文件名带内容哈希，内容一变文件名就变，缓存 30 天。找不到就是 404，不回落到 index.html
location /assets/ {
    try_files $uri =404;
    expires 30d;
}

# 其他都是前端页面：没有对应的文件就给 index.html，由前端路由处理。index.html 不缓存，升级后刷新一下就是新版本
location / {
    try_files $uri /index.html;
    expires -1;
}
