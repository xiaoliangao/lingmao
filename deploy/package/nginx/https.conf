# HTTPS 模式（.env 里 SCM_WEB_MODE=https）的 Nginx 配置。升级时会被覆盖，不要改这里。
# 证书放在安装目录的 certs/fullchain.pem（证书链）和 certs/privkey.pem（私钥），见部署手册第 4 节。
# 换了证书以后让 Nginx 重新读：cd /opt/scm && sudo docker compose exec web nginx -s reload
#
# 容器启动时，这个文件里的 HTTPS 端口占位会换成 .env 里的 SCM_HTTPS_PORT（Nginx 镜像自带的模板功能）

# HTTP 一律跳到 HTTPS。端口是 443 时浏览器会自己把 :443 去掉
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host:${SCM_HTTPS_PORT}$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/scm/site.conf;
}
