# HTTPS 模式（.env 里 SCM_WEB_MODE=https）的 Nginx 配置。升级时会被覆盖，不要改这里。
# 证书放在安装目录的 certs/fullchain.pem（证书链）和 certs/privkey.pem（私钥），见部署手册第 4 节。
# 换了证书以后让 Nginx 重新读：cd /opt/scm && sudo docker compose exec web nginx -s reload
#
# 容器启动时，这个文件里的 HTTPS 端口、文件签名密钥的占位会换成 .env 里的值（Nginx 镜像自带的模板功能）

# HTTP 一律跳到 HTTPS。端口是 443 时浏览器会自己把 :443 去掉
server {
    listen 80 default_server;
    server_name _;
    # .env 里的端口也可以写成 127.0.0.1:8443 这样，跳转地址里只要最后的端口号
    set $scm_https_port "${SCM_HTTPS_PORT}";
    if ($scm_https_port ~ "([0-9]+)$") {
        set $scm_https_port $1;
    }
    return 301 https://$host:$scm_https_port$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传文件地址的签名密钥，site.conf 的 /files/ 用（.env 里的 FILE_SIGN_KEY）
    set $scm_file_sign_key "${SCM_FILE_SIGN_KEY}";

    include /etc/nginx/scm/site.conf;
}
