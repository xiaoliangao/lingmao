# 信任的入口。前面有负载均衡、网关、CDN 这类入口时，把它们的 IP 或网段写在这里，一行一个，比如：
#
#   set_real_ip_from 10.0.0.0/8;
#   set_real_ip_from 100.64.0.0/10;
#
# 写了以后，Nginx 才会从这些地址传来的 X-Forwarded-For 里取用户的真实 IP，操作日志里记的才是用户的 IP，而不是入口的。
# 没写的地址传来的 X-Forwarded-For 一律不信：这个头用户自己能随便填。
#
# 不知道入口的 IP：看云厂商负载均衡的文档（"获取客户端真实 IP"一节），
# 或者看 Nginx 的访问日志 sudo docker compose logs --tail 20 web，每行开头就是连过来的地址。
#
# 升级不会覆盖这个文件。改完先检查、再让 Nginx 重新读（在安装目录里执行）：
#   sudo docker compose exec web nginx -t
#   sudo docker compose exec web nginx -s reload
