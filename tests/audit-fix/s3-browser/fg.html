<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><title>成品仓实际组件回归</title></head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from 'vue'
      import { createPinia } from 'pinia'
      import { createRouter, createMemoryHistory } from 'vue-router'
      import ElementPlus from 'element-plus'
      import * as icons from '@element-plus/icons-vue'
      import zhCn from 'element-plus/es/locale/lang/zh-cn'
      import 'element-plus/dist/index.css'
      import '/src/styles/tokens.css'
      import '/src/styles/base.css'
      import '/src/styles/element.css'
      import { getToken, setToken, startSessionSync } from '/src/utils/token.ts'
      import { vPerm } from '/src/directives/perm.ts'
      import AppLayout from '/src/layout/AppLayout.vue'
      import FgIn from '/src/views/fg/stock-in/index.vue'
      import FgOut from '/src/views/fg/stock-out/index.vue'
      import FgStock from '/src/views/fg/stock/index.vue'
      import FgDetail from '/src/views/fg/doc/detail.vue'
      import ProductionDetail from '/src/views/production/order/detail.vue'
      import HomePage from '/src/views/home/index.vue'
      import Fixture from './FgFixture.vue'
      import Panels from './FgPanels.vue'
      if (!getToken()) setToken('synthetic-fg-session')
      startSessionSync()
      const router = createRouter({ history: createMemoryHistory(), routes: [
        { path: '/', component: AppLayout, props: { area: 'workbench' }, children: [
          { path: '/fg-in', component: FgIn, meta: { title: '成品入库单' } },
          { path: '/fg-out', component: FgOut, meta: { title: '成品出库单' } },
          { path: '/fg-stock', component: FgStock, meta: { title: '成品库存' } },
          { path: '/fg-in/:id', component: FgDetail, meta: { title: '成品入库单', detail: true } },
          { path: '/fg-out/:id', component: FgDetail, meta: { title: '成品出库单', detail: true } },
          { path: '/fg-panels', component: Panels, meta: { title: '回货边界回归' } },
          { path: '/production/:id', component: ProductionDetail, meta: { title: '外发加工单', detail: true } },
          { path: '/home', component: HomePage, meta: { title: '首页' } },
        ] },
        { path: '/:pathMatch(.*)*', component: { template: '<div>合成来源页面</div>' } },
      ] })
      const app = createApp(Fixture).use(createPinia()).use(router).use(ElementPlus, { locale: zhCn })
      for (const [name, component] of Object.entries(icons)) app.component(name, component)
      app.directive('perm', vPerm)
      await router.push(new URLSearchParams(location.search).get('path') || '/fg-in?companyId=1')
      await router.isReady()
      app.mount('#app')
    </script>
  </body>
</html>
