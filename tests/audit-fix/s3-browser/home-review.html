<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><title>首页及评审回归</title></head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from 'vue'
      import { createPinia } from 'pinia'
      import { createRouter, createMemoryHistory } from 'vue-router'
      import ElementPlus from 'element-plus'
      import * as icons from '@element-plus/icons-vue'
      import zhCn from 'element-plus/es/locale/lang/zh-cn'
      import 'element-plus/dist/index.css'
      import '/src/styles/tokens.css'
      import '/src/styles/base.css'
      import '/src/styles/element.css'
      import { setToken } from '/src/utils/token.ts'
      import { vPerm } from '/src/directives/perm.ts'
      import Fixture from './HomeReviewFixture.vue'
      import TechPackFixture from './TechPackFixture.vue'
      import UpstreamFixture from './UpstreamFixture.vue'
      setToken('synthetic-home-review')
      const router = createRouter({ history: createMemoryHistory(), routes: [{ path: '/:pathMatch(.*)*', component: Fixture }] })
      const component = location.search.includes('wide-pack=1') ? TechPackFixture : location.search.includes('upstream=1') ? UpstreamFixture : Fixture
      const app = createApp(component).use(createPinia()).use(router).use(ElementPlus, { locale: zhCn })
      for (const [name, component] of Object.entries(icons)) app.component(name, component)
      app.directive('perm', vPerm)
      await router.isReady()
      app.mount('#app')
    </script>
  </body>
</html>
