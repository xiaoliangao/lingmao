- op: GET /api/materials
  tool: list_materials
  label: 物料
  perm: basic:material:list
- op: GET /api/materials/{id}
  tool: get_material
  label: 物料详情
  perm: basic:material:list
- op: GET /api/styles
  tool: list_styles
  label: 款式
