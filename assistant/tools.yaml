# 助手能用的工具（RFC 017 §3.3）：一条是 app 的一个 GET 接口，没列的模型看不见。
# 参数和说明从 openapi.json 取（接口上的 @Operation、字段的 Javadoc），这里只写：
#   op    "GET /api/..."，和 openapi.json 的路径一字不差
#   tool  给模型的名字（小写字母、数字、下划线，不能重复）
#   label 给人看的，查的时候对话里显示"正在查：…"
#   perm  用户有这个权限码才交给模型，和接口上 @PreAuthorize 的一致（可以更严：没别的权限用不起来的）；只要登录的写 login
#   hint  可选，什么时候用它（补在接口说明后面）
#   ask   可选，一句能直接问的例句：卡片里按这个人的权限推荐、输入时 Tab 补全（GET /assistant/suggestions）。
#         要单号、款号才问得了的（详情、下游、记录）不写
#   askIf 可选，权限码的列表：有其中一个才推荐 ask。只要登录、可没有对应模块权限时查出来是空的那种要写，不然会推给问了也白问的人
# 启动时逐条核对（只收 GET、返回 R、不是导出 / 下载 / 预览），不合规的服务起不来。
# 真正的拦截在 app：助手令牌调不了写接口、文件接口，拿不到文件签名地址，数据范围和字段权限照这个人的来。
# 不进白名单：附件、资质证书、工艺单文件和预览、供应商银行账号、各种导出模板，以及建单时用的下拉和带出接口。
# 详情里带的文件列表（files、photos、attachments）给模型前去掉（tools.ts 的 DROP_KEYS）。
# 成品（库存、出入库单）不进：甲方 11-21 答 Q44，成品库存以聚水潭为准，本系统的成品模块收回不用。

# ---- 首页 ----
- op: GET /api/board/home/todos
  tool: my_todos
  label: 我的待办
  perm: login
  hint: 用户问"我有什么要处理的""待审核的有几张"时先用它
  ask: 今天有哪些待我处理的事
- op: GET /api/board/home/deliveries
  tool: upcoming_deliveries
  label: 近期交期
  perm: login
  hint: 近期要交货、已经逾期的订单和生产单（没有订单、生产单权限的查出来是空的，回答"你没有权限看"，不要说没有）
  ask: 最近一周有哪些要交货的
  askIf: [order:order:list, production:order:list]

- op: GET /api/board/home/kpi
  tool: home_overview
  label: 概况
  perm: login
  hint: 开发款式、在手订单、在制生产、在途物料四个数；某一块是 null 是这个人没有那个模块的权限，回答"你没有权限看"，不要说 0
  ask: 现在整体的概况怎么样
  askIf: [style:style:list, order:order:list, production:order:list, purchase:order:list]

# ---- 需求订单 ----
- op: GET /api/orders
  tool: list_orders
  label: 需求订单
  perm: order:order:list
  hint: 按订单号、合同号、款号、状态、日期找需求订单；拿到 id 再查详情
  ask: 待审核的需求订单有哪些
- op: GET /api/orders/{id}
  tool: get_order
  label: 订单详情
  perm: order:order:list
  hint: 一张订单的款、颜色尺码数量、交期、审批进度（approval）
- op: GET /api/orders/{id}/references
  tool: order_downstream
  label: 订单的下游单据
  perm: order:order:list
  hint: 订单下游有哪些生产单、算料单；"为什么不能反审核"先查它
- op: GET /api/orders/{id}/logs
  tool: order_logs
  label: 订单的操作记录
  perm: order:order:list
  hint: 谁在什么时候建、改、提交、审核了这张订单
- op: GET /api/order-changes
  tool: list_order_changes
  label: 订单变更
  perm: order:change:list
  ask: 最近有哪些订单变更
- op: GET /api/order-changes/{id}
  tool: get_order_change
  label: 变更单详情
  perm: order:change:list
- op: GET /api/order-progress
  tool: order_progress
  label: 订单进度
  perm: order:progress:list
  hint: 订单每个款排产、齐料（kitting）、生产、回货、发货到哪一步了；问订单的料齐了没有也用它
  ask: 哪些订单已经逾期了

# ---- 算料、采购 ----
- op: GET /api/mrp-calcs
  tool: list_mrp_calcs
  label: 算料单
  perm: purchase:mrp:list
  ask: 还有哪些算料单没确认
- op: GET /api/mrp-calcs/{id}
  tool: get_mrp_calc
  label: 算料单详情
  perm: purchase:mrp:list
  hint: 一张算料单每种物料要多少、库存抵多少、要买多少
- op: GET /api/mrp-calcs/{id}/references
  tool: mrp_calc_downstream
  label: 算料单的下游单据
  perm: purchase:mrp:list
- op: GET /api/purchase-orders
  tool: list_purchase_orders
  label: 采购单
  perm: purchase:order:list
  ask: 待审核的采购单有几张
- op: GET /api/purchase-orders/{id}
  tool: get_purchase_order
  label: 采购单详情
  perm: purchase:order:list
  hint: 一张采购单的明细、到货情况、审批进度
- op: GET /api/purchase-orders/{id}/references
  tool: purchase_order_downstream
  label: 采购单的下游单据
  perm: purchase:order:list
  hint: 采购单下游的入库单、退货单
- op: GET /api/purchase-orders/{id}/logs
  tool: purchase_order_logs
  label: 采购单的操作记录
  perm: purchase:order:list
- op: GET /api/purchase-orders/pending-items
  tool: pending_arrivals
  label: 待到料
  perm: purchase:order:list
  hint: 还没到齐的采购物料，"哪些料还没到""某个物料什么时候到"用它
  ask: 哪些物料到料逾期了
- op: GET /api/reorder-items
  tool: reorder_items
  label: 补货清单
  perm: purchase:order:list
  hint: 低于最小库存、该补货的物料，差得多的在前
  ask: 哪些物料低于最小库存要补货

# ---- 物料库存 ----
- op: GET /api/stocks
  tool: list_stocks
  label: 物料库存
  perm: inventory:stock:list
  hint: 某个物料 SKU 在哪个仓有多少
- op: GET /api/stocks/summary
  tool: stock_summary
  label: 按物料汇总的库存
  perm: inventory:stock:list
  hint: 按物料汇总的库存（物料仓、工厂仓合计）
  ask: 面料库存还剩多少
- op: GET /api/inventory-docs
  tool: list_inventory_docs
  label: 出入库单
  perm: inventory:doc:list
  hint: 物料入库单（kind=IN）、出库单（kind=OUT）
  ask: 这周入库了哪些物料
- op: GET /api/inventory-docs/{id}
  tool: get_inventory_doc
  label: 出入库单详情
  perm: inventory:doc:list
- op: GET /api/inventory-docs/{id}/references
  tool: inventory_doc_links
  label: 出入库单的关联单据
  perm: inventory:doc:list
- op: GET /api/stocks/movement
  tool: stock_movement
  label: 进销存汇总
  perm: inventory:stock:list
  hint: 一段时间里每个物料 SKU 的期初、入库、出库、期末；没说时间按这个月
  ask: 这个月物料的进出库汇总
- op: GET /api/stock-logs
  tool: stock_logs
  label: 库存流水
  perm: inventory:stock:list
  hint: 一条条的库存变动记录（哪张单、哪天、进出多少），"这个料最近谁领了"用它
  ask: 最近有哪些物料出库记录
- op: GET /api/inventory-counts
  tool: list_stock_counts
  label: 盘点单
  perm: inventory:count:list
  ask: 最近的盘点单有哪些

# ---- 生产 ----
- op: GET /api/production-orders
  tool: list_production_orders
  label: 生产单
  perm: production:order:list
  ask: 生产中的外发加工单有哪些
- op: GET /api/production-orders/{id}
  tool: get_production_order
  label: 生产单详情
  perm: production:order:list
  hint: 一张生产单的款、数量、加工厂、节点进度、审批进度
- op: GET /api/production-orders/{id}/references
  tool: production_order_links
  label: 生产单的关联单据
  perm: production:order:list
- op: GET /api/production-orders/{id}/receipts
  tool: production_receipts
  label: 生产单的回货
  perm: production:order:list
  hint: 这张生产单的回货记录
- op: GET /api/production-orders/{id}/materials
  tool: production_materials
  label: 生产单的领料
  perm: production:order:list
  hint: 这张生产单要领的料、领了多少
- op: GET /api/production-board/cards
  tool: production_overview
  label: 生产概况
  perm: production:board:list
  hint: 在制、待开工、临期、逾期各多少
  ask: 生产看板上在制和逾期的各有几单
- op: GET /api/production-board/factories
  tool: production_by_factory
  label: 各工厂的生产情况
  perm: production:board:list
  ask: 各工厂的生产情况怎么样
- op: GET /api/production-orders/my-follow
  tool: my_follow
  label: 我的跟单
  perm: production:mobile:list
  hint: 跟单是这个人、已下单或生产中的生产单，风险高的在前
  ask: 我跟的生产单进度怎么样
- op: GET /api/production-orders/{id}/issues
  tool: production_issues
  label: 生产单的异常
  perm: production:order:list
  hint: 一张生产单上报过的异常（没关闭的在前）

# ---- 资料包、核价 ----
- op: GET /api/tech-packs
  tool: list_tech_packs
  label: 款式的资料包
  perm: techpack:pack:list
  hint: 一个款的资料包各版本和状态（生效了没有）；先用 list_styles 按款号拿到款式 id
- op: GET /api/tech-packs/{id}
  tool: get_tech_pack
  label: 资料包详情
  perm: techpack:pack:list
  hint: 一版资料包的物料清单（BOM：用什么料、单件用量、损耗）
- op: GET /api/style-costs
  tool: style_costs
  label: 款式核价
  perm: techpack:cost:query
  hint: 每款按生效的生产 BOM 算的单件成本
  ask: 各款的单件成本是多少

# ---- 基础资料 ----
- op: GET /api/materials
  tool: list_materials
  label: 物料
  perm: basic:material:list
- op: GET /api/materials/{id}
  tool: get_material
  label: 物料详情
  perm: basic:material:list
- op: GET /api/styles
  tool: list_styles
  label: 款式
  perm: style:style:list
  ask: 今年秋季有哪些款
- op: GET /api/styles/{id}
  tool: get_style
  label: 款式详情
  perm: style:style:list
- op: GET /api/suppliers
  tool: list_suppliers
  label: 供应商
  perm: supplier:supplier:list
  ask: 有哪些面料供应商
- op: GET /api/suppliers/{id}
  tool: get_supplier
  label: 供应商详情
  perm: supplier:supplier:list
- op: GET /api/warehouses/options
  tool: list_warehouses
  label: 仓库
  perm: login
  hint: 仓库的 id 和名字；按仓库查库存前先用它找 id
