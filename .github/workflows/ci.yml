name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      JAVA_TOOL_OPTIONS: -Xmx1200m -XX:ActiveProcessorCount=4 -Dspring.test.context.cache.maxSize=4
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scm
          POSTGRES_DB: scm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scm -d scm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dev/ci/requirements.txt
      - name: Install pinned tools and browser
        id: tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir web install --frozen-lockfile
          python -m pip install --requirement dev/ci/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server poppler-utils
          bash dev/fetch-font.sh
      - name: P36 — private PostgreSQL helper guards and cleanup failure regressions
        run: python3 tests/audit-fix/s4-lifecycle/private-pg-log-test.py
      - name: P36 — initialize private PostgreSQL collector and verify container log isolation
        id: private_pg
        env:
          SCM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 tests/prod-readiness/a4-lifecycle/ci_private_pg_log.py initialize
      - name: CI credential redaction and process-group cleanup regressions
        env:
          SCM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 tests/prod-readiness/a4-lifecycle/ci_helpers_test.py
      - name: T01–T10 and T12 — real database concurrency, security, migration and audit; production JAR
        id: backend
        run: ./mvnw -B -ntp -Pprod-readiness verify
      - name: P33 — summarize all measured SQL distributions from raw plans
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: python3 tests/audit-fix/s4-lifecycle/summarize-notice-plans.py
      - name: Strict TypeScript, lint, regression tests and production web build
        id: web
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        working-directory: web
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          node --test ../tests/prod-readiness/a3-browser/core.test.mjs
          pnpm build
      - name: T11 — real browser concurrency, table, matrix, IME, dates and fault recovery
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.web.outcome == 'success' }}
        run: python3 tests/prod-readiness/a3-browser/run.py
      - name: S3 — write recovery, real wide forms and bounded upstream pages
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.web.outcome == 'success' }}
        run: |
          python3 tests/audit-fix/s3-browser/write-recovery.py
          python3 tests/audit-fix/s3-browser/supplier-amounts.py
      - name: S3 — actual cross-tab authentication cookies and insecure HTTP origin
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.web.outcome == 'success' }}
        env:
          SCM_UI_REQUIRE_INSECURE_ORIGIN: '1'
        run: python3 tests/audit-fix/s3-browser/auth-cookies.py
      - name: S3 — bounded replenishment pages, source previews and safe page selection
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.web.outcome == 'success' }}
        run: python3 tests/audit-fix/s3-browser/bounded-lists.py
      - name: S3 — explicit kitting failures, retry and stale request cancellation
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.web.outcome == 'success' }}
        run: python3 tests/audit-fix/s3-browser/production-kitting.py
      - name: Production artifact isolation
        if: ${{ !cancelled() && steps.backend.outcome == 'success' && steps.web.outcome == 'success' }}
        run: python3 tests/prod-readiness/a4-lifecycle/artifact_gate.py
      - name: Real Nginx HTTP/TLS and proxy boundary faults
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          docker build -t scm-gateway-gate -f tests/prod-readiness/a4-lifecycle/gateway.Dockerfile .
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" --workdir /workspace scm-gateway-gate python3 tests/prod-readiness/a2-security/gateway.py
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/workspace" --workdir /workspace scm-gateway-gate python3 tests/prod-readiness/a4-lifecycle/deployment_logs.py --component nginx
      - name: Production PostgreSQL log privacy with actual compose settings
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python3 tests/prod-readiness/a4-lifecycle/deployment_logs.py --component postgres --docker-postgres
      - name: Authenticate ephemeral runtime PostgreSQL and Redis after integration tests
        id: runtime
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        env:
          SCM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 tests/prod-readiness/a4-lifecycle/ci_runtime_auth.py
      - name: T08 — two actual JVMs and one database cache load
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        env:
          SCM_PROD_READINESS: '1'
          SCM_TEST_REDIS_PASSWORD: ${{ env.SCM_CI_REDIS_PASSWORD }}
          SCM_TEST_PG_PASSWORD: ${{ env.SCM_CI_DB_PASSWORD }}
          SCM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 tests/prod-readiness/a4-lifecycle/ci_two_instances.py
      - name: T12 — production bootstrap faults and real SIGTERM drain
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        env:
          SCM_PROD_READINESS: '1'
          SCM_TEST_REDIS_PASSWORD: ${{ env.SCM_CI_REDIS_PASSWORD }}
          SCM_TEST_PG_PASSWORD: ${{ env.SCM_CI_DB_PASSWORD }}
        run: python3 tests/prod-readiness/a4-lifecycle/process_gate.py
      - name: Prototype build and existing browser self-check
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.web.outcome == 'success' }}
        run: |
          python dev/ci/check-prototype.py
          git diff --exit-code -- docs/原型/index.html
      - name: Backup account read-only isolation
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/operations
          sudo --preserve-env=GITHUB_ACTIONS bash dev/ci/check-backup-readonly.sh | tee test-artifacts/operations/backup-readonly.log
      - name: Real PostgreSQL restore drill
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p test-artifacts/operations
          sudo --preserve-env=GITHUB_ACTIONS bash dev/ci/check-restore.sh | tee test-artifacts/operations/restore.log
      - name: Capture the original PR base in the same browser
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.runtime.outcome == 'success' && steps.web.outcome == 'success' }}
        env:
          SCM_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash dev/ci/capture-before.sh "$SCM_PR_BASE_SHA"
      - name: Start services, health/API smoke and real Playwright regressions
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.web.outcome == 'success' }}
        env:
          SCM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash dev/ci/run-smoke.sh after
      - name: P36 — remove private service logs before container teardown
        if: ${{ always() && steps.tools.outcome == 'success' }}
        env:
          SCM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: python3 tests/prod-readiness/a4-lifecycle/ci_private_pg_log.py cleanup
      - name: Redact transient credentials in test reports
        id: redaction
        if: always()
        run: python3 dev/ci/sanitize-artifacts.py
      - name: Upload test evidence and rendered screenshots
        if: ${{ always() && steps.redaction.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: audit-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/audit-query-capacity.json
            target/a1-production/
            target/a2-production/
            target/test-artifacts/
            test-artifacts/
