name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scm
          POSTGRES_DB: scm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scm -d scm_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dev/ci/requirements.txt
      - name: Install pinned tools and browser
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir web install --frozen-lockfile
          python -m pip install --requirement dev/ci/requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openssh-server poppler-utils
          bash dev/fetch-font.sh
      - name: Schema, migration, unit and integration tests; production JAR
        run: ./mvnw -B -ntp verify
      - name: Strict TypeScript, lint, regression tests and production web build
        working-directory: web
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
      - name: Prototype build and existing browser self-check
        run: |
          export CHROME="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          node docs/原型/check.mjs --shots test-artifacts/prototype --only '/basics?tab=sizes'
          git diff --exit-code -- docs/原型/index.html
      - name: Backup account read-only isolation and restore drill
        run: |
          mkdir -p test-artifacts/operations
          sudo --preserve-env=GITHUB_ACTIONS bash dev/ci/check-backup-readonly.sh | tee test-artifacts/operations/backup-readonly.log
          sudo --preserve-env=GITHUB_ACTIONS bash dev/ci/check-restore.sh | tee test-artifacts/operations/restore.log
      - name: Capture the original PR base in the same browser
        if: github.event_name == 'pull_request'
        env:
          SCM_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SCM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash dev/ci/capture-before.sh "$SCM_PR_BASE_SHA"
      - name: Start services, health/API smoke and real Playwright regressions
        env:
          SCM_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash dev/ci/run-smoke.sh after
      - name: Redact transient credentials in test reports
        if: always()
        run: python3 dev/ci/sanitize-artifacts.py
      - name: Upload test evidence and rendered screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: audit-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/audit-query-capacity.json
            test-artifacts/
